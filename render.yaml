# Render Blueprint Specification for Özerler Mermer ERP
# Deploys Spring Boot 4 + Java 24 Web Service and Free PostgreSQL Database

services:
  - type: web
    name: marble-erp
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: marble-erp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: marble-erp-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: marble-erp-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: marble-erp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marble-erp-db
          property: password
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: CORS_ALLOWED_ORIGIN_PATTERN
        value: https://*.onrender.com
      - key: JAVA_OPTS
        value: -XX:+UseSerialGC -Xms128m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+ExitOnOutOfMemoryError

databases:
  - name: marble-erp-db
    databaseName: marble_erp
    user: marbleuser
    plan: free
    region: oregon
