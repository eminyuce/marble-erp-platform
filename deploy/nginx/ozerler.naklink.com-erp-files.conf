# Paste this INSIDE the existing TLS server for ozerler.naklink.com,
# before any "location /" or image regex. Host nginx terminates HTTPS;
# this repository does not run nginx.
#
# Path-style presigned URLs are:
#   https://ozerler.naklink.com/erp-files/<object-key>?X-Amz-...
# SigV4 covers the Host header and the raw path. Do not strip /erp-files/,
# do not add a /files/ prefix, and do not replace Host with rustfs:9000.
# ^~ stops the static-asset regex (jpg, png, svg) from sending objects to the app.

location ^~ /erp-files/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;

    # Keep upstream keepalive under RustFS's 75s header-read timeout.
    proxy_set_header Connection "";

    # The browser signed Host: ozerler.naklink.com. Forward that host unchanged.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do not compress or re-chunk the body. Query string stays on $request_uri.
    proxy_set_header Accept-Encoding "identity";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
