name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        # continue-on-error is temporary for this first PR only. Remove it in the next PR
        # so a Checkstyle violation fails the job. verify still runs Checkstyle at validate.
        continue-on-error: true
        run: ./mvnw -B -ntp checkstyle:check

      - name: Build and test
        run: ./mvnw -B -ntp verify
