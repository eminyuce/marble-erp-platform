name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: "24"
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        # TEMPORARY: continue-on-error is only for this first PR that introduces the Checkstyle gate.
        # It must be removed in the next PR so Checkstyle violations fail the build.
        continue-on-error: true
        run: ./mvnw -B -ntp checkstyle:check

      - name: Build and test
        run: ./mvnw -B -ntp verify
