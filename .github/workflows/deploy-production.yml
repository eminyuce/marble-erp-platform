name: Deploy Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Linux VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "Deploying Özerler Mermer ERP to production server..."
            mkdir -p /opt/marble-erp
            cd /opt/marble-erp

            # Pull latest compose and setup
            cat << 'EOF' > docker-compose.prod.yml
            ${{ secrets.DOCKER_COMPOSE_PROD_OVERRIDE || '' }}
            EOF

            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest image and restarting containers..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Run with zero downtime / auto-healing
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --remove-orphans

            echo "Performing production health check..."
            for i in {1..12}; do
              if curl -s -f http://localhost:8080/actuator/health | grep -q "UP"; then
                echo "Deployment successfully verified: System is HEALTHY and UP!"
                exit 0
              fi
              echo "Waiting for Spring Boot application startup ($i/12)..."
              sleep 5
            done

            echo "Health check timed out!"
            exit 1
