# Production stack for the server. The image is built by GitHub Actions
# and pulled from Docker Hub. This file does not compile the application.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# No .env file is required. Defaults live in application-prod.yml and in the
# environment entries below. Override a secret by exporting it before compose
# (for example DB_PASSWORD) or by injecting a Docker secret into that variable.
#
# The live server already stores Postgres in the external volume
# docker_postgres_data and RustFS files in /opt/rustfs/data.
# Keep those attachments. Never run "docker compose down -v".
#
# Open http://localhost:81
# DB_HOST inside the app container is the service name "postgres", never localhost.
# The in-app Yayınla button pulls this image and recreates the app container.
# Service DNS names stay "postgres" and "rustfs".
# Data volumes keep their current Docker names so existing files are reused.
# Never run "docker compose down -v".

name: ozerler-marble-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: ozerler-marble-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marble_erp}
      POSTGRES_USER: ${DB_USERNAME:-marbleuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marblepass}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marble-network

  rustfs-perms:
    image: alpine:3.24.1
    container_name: ozerler-marble-erp-rustfs-perms
    user: root
    restart: "no"
    volumes:
      - ${RUSTFS_DATA_DIR:-/opt/rustfs/data}:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    networks:
      - marble-network

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: ozerler-marble-erp-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_ADDRESS: ":9000"
      # Leave RUSTFS_SERVER_DOMAINS unset. It is only for virtual-hosted names
      # (erp-files.ozerler.naklink.com). Path-style /erp-files/<key> needs no domain list.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      # API only. The console port 9001 is not published in production.
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
    volumes:
      - ${RUSTFS_DATA_DIR:-/opt/rustfs/data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marble-network

  deploy-log-perms:
    image: alpine:3.24.1
    container_name: ozerler-marble-erp-deploy-perms
    user: root
    restart: "no"
    volumes:
      - ${MARBLE_HOST_LOG_DIR:-/opt/marble-erp/logs}:/logs
      - uploads_data:/uploads
      - media_data:/media
    command: ["sh", "-c", "mkdir -p /logs /uploads /media && chown -R 1001:1001 /logs /uploads /media && chmod 755 /logs /uploads /media"]
    networks:
      - marble-network

  app:
    image: ${DOCKERHUB_USERNAME:-guvenulu}/marble-erp-platform:${APP_TAG:-latest}
    container_name: ozerler-marble-erp-app
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      deploy-log-perms:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "81"
      SERVER_PORT: "81"
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:-guvenulu}
      APP_TAG: ${APP_TAG:-latest}
      MARBLE_IN_CONTAINER: "true"
      MARBLE_HOST_STACK_DIR: ${MARBLE_HOST_STACK_DIR:-/opt/marble-erp}
      MARBLE_HOST_LOG_DIR: ${MARBLE_HOST_LOG_DIR:-/opt/marble-erp/logs}
      APP_DEPLOYMENT_ENABLED: "true"
      APP_DEPLOYMENT_USE_SUDO: "false"
      APP_DEPLOYMENT_COMMAND: /usr/local/sbin/marble-erp-inapp-deploy
      APP_DEPLOYMENT_REPO_DIR: /stack
      APP_DEPLOYMENT_LOG_FILE: /opt/marble-erp/logs/inapp-deploy.log
      APP_DEPLOYMENT_STATUS_FILE: /opt/marble-erp/logs/inapp-deploy.status
      APP_DEPLOYMENT_LOCK_FILE: /opt/marble-erp/logs/inapp-deploy.lock
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-marble_erp}
      DB_USERNAME: ${DB_USERNAME:-marbleuser}
      DB_PASSWORD: ${DB_PASSWORD:-marblepass}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marble_erp}
      APP_UPLOAD_DIR: /app/uploads
      APP_MEDIA_DIR: /app/media
      STORAGE_TYPE: rustfs
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      # Same host as the app. Nginx forwards /erp-files/ to RustFS without rewriting the path.
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-https://ozerler.naklink.com}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-erp-files}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      PRESIGNED_IMAGE_EXPIRY_MINUTES: ${PRESIGNED_IMAGE_EXPIRY_MINUTES:-30}
      PRESIGNED_DOCUMENT_EXPIRY_MINUTES: ${PRESIGNED_DOCUMENT_EXPIRY_MINUTES:-5}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:81}
      SESSION_STORE_TYPE: ${SESSION_STORE_TYPE:-jdbc}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      # Session cookie Secure=true comes from application-prod.yml.
      # Export SESSION_COOKIE_SECURE=false only for an HTTP exception.
      SESSION_CLEANUP_CRON: "${SESSION_CLEANUP_CRON:-0 * * * * *}"
      PG_DUMP_PATH: pg_dump
    ports:
      - "${APP_PORT:-81}:81"
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MARBLE_HOST_LOG_DIR:-/opt/marble-erp/logs}:/opt/marble-erp/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:81/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - marble-network

networks:
  # New network name. deploy_from_app.sh attaches the already-running
  # Postgres and RustFS containers to it before replacing only the app.
  marble-network:
    name: ozerler-marble-erp

volumes:
  # Live server volume. external so "down -v" cannot delete it.
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-docker_postgres_data}
  # Created earlier by project name marble-erp. Pin them; do not copy or delete.
  uploads_data:
    name: marble-erp_uploads_data
  media_data:
    name: marble-erp_media_data
