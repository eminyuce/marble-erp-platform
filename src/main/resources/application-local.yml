spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/marble_local_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  session:
    jdbc:
      # This profile uses an H2 file database and does not run Flyway.
      # embedded creates SPRING_SESSION only when the database is embedded.
      initialize-schema: embedded
  thymeleaf:
    cache: false

server:
  port: 8080
  request:
    header:
      forwarded:
        strategy: framework
  servlet:
    session:
      cookie:
        # The local profile uses HTTP and an H2 file database.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors:
    allowed-origin: http://localhost:8080,http://127.0.0.1:8080
  storage:
    type: memory

rate-limiting:
  login:
    max-requests: 1000
    window-seconds: 60
  form:
    max-requests: 2000
    window-seconds: 60
  general:
    max-requests: 10000
    window-seconds: 60
