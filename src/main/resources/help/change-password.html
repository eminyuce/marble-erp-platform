<section class="help-page" data-title="Şifre değiştir" data-updated="2026-09-14">
    <ul class="help-panel-list">
        <li>Bu sayfadan şifrenizi değiştirebilirsiniz.</li>
        <li>Önce mevcut şifrenizi, ardından yeni şifrenizi ve onayını girin.</li>
        <li>Yeni şifre en az <strong>6 karakter</strong> olmalı; <strong>büyük harf</strong>, <strong>küçük harf</strong> ve <strong>sayı</strong> içermelidir.</li>
        <li>Şifrenizi değiştirdikten sonra bir sonraki girişte yeni şifrenizi kullanmanız gerekecektir.</li>
    </ul>
</section>
