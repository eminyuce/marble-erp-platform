spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marble_erp}
    username: ${DB_USERNAME:marbleuser}
    password: ${DB_PASSWORD:marblepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  request:
    header:
      forwarded:
        strategy: framework
  servlet:
    session:
      cookie:
        # Dev is plain HTTP on localhost. Prod defaults the same flag to true.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:8080,http://127.0.0.1:8080}
    allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:https://*.trycloudflare.com}
  storage:
    type: ${STORAGE_TYPE:rustfs}
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
      public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${RUSTFS_ACCESS_KEY:marblerustfs}
      secret-key: ${RUSTFS_SECRET_KEY:marblerustfs_change_me}
      bucket: ${RUSTFS_BUCKET:erp-files}
      region: ${RUSTFS_REGION:us-east-1}

# Unset RUSTFS_ENDPOINT means the JVM is on the host, next to published port 9000.
# The Compose app service sets RUSTFS_ENDPOINT=http://rustfs:9000 for Docker DNS.
rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
  public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY:marblerustfs}
  secret-key: ${RUSTFS_SECRET_KEY:marblerustfs_change_me}
  bucket: ${RUSTFS_BUCKET:erp-files}
  region: ${RUSTFS_REGION:us-east-1}

rate-limiting:
  login:
    max-requests: 30
    window-seconds: 60
  form:
    max-requests: 60
    window-seconds: 60
  general:
    max-requests: 120
    window-seconds: 60
