spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marble_erp}
    username: ${DB_USERNAME:marbleuser}
    password: ${DB_PASSWORD:marblepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:8080,http://127.0.0.1:8080}
    allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:https://*.trycloudflare.com}
  storage:
    type: ${STORAGE_TYPE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:marbleminio}
      secret-key: ${MINIO_SECRET_KEY:marbleminio_change_me}
      bucket: ${MINIO_BUCKET:erp-files}
      region: ${MINIO_REGION:us-east-1}

rate-limiting:
  login:
    max-requests: 1000
    window-seconds: 60
  form:
    max-requests: 2000
    window-seconds: 60
  general:
    max-requests: 10000
    window-seconds: 60
