spring:
  application:
    name: marble-erp-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        same-site: lax
        max-age: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  upload:
    dir: uploads
  name: "Özerler Mermer ERP"
  company: "Özerler Mermer A.Ş."
  version: "1.0.0"

rate-limiting:
  login:
    max-requests: 5
    window-seconds: 60
  form:
    max-requests: 10
    window-seconds: 60
  general:
    max-requests: 60
    window-seconds: 60

logging:
  level:
    root: INFO
    com.ozerler.marble: DEBUG
    org.springframework.security: INFO
