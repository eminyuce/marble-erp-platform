spring:
  application:
    name: marble-erp-platform
  profiles:
    active: dev
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  web:
    error:
      include-message: always
      include-exception: true
      include-stacktrace: always
      include-binding-errors: always
      whitelabel:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
    include-binding-errors: always
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        same-site: lax
        max-age: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  upload:
    dir: uploads
  name: "Özerler Mermer ERP"
  company: "Özerler Mermer A.Ş."
  version: "1.0.0"
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

rate-limiting:
  login:
    max-requests: 5
    window-seconds: 60
  form:
    max-requests: 10
    window-seconds: 60
  general:
    max-requests: 60
    window-seconds: 60

logging:
  level:
    root: INFO
    com.ozerler.marble: DEBUG
    org.springframework.security: INFO
  async:
    queue-capacity: 8192
    high-water-mark-percent: 90
    overflow-policy: DROP_LOW_PRIORITY
    batch-size: 256
    drain-timeout-millis: 5000
    poll-timeout-millis: 100
    include-caller-data: false
