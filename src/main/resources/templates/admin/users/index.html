<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Kullanıcı Yönetimi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <!-- Page Header & Actions -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-5">
        <div>
            <div class="flex items-center gap-2">
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Kullanıcı Yönetimi</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">Admin Modülü</span>
            </div>
            <p class="text-sm text-slate-500 mt-1">Sistem kullanıcıları, dinamik rol atamaları (RBAC), erişim kısıtlamaları ve şifre yönetimi.</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="usersTable.download('csv', 'kullanicilar.csv')"
                    class="px-3 py-2 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 text-xs font-semibold rounded-lg shadow-sm flex items-center gap-1.5 transition">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>CSV İndir</span>
            </button>
            <button hx-get="/admin/users/create" hx-target="#modal-container"
                    class="px-4 py-2 bg-amber-700 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg shadow-sm flex items-center gap-1.5 transition cursor-pointer">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>Yeni Kullanıcı Ekle</span>
            </button>
        </div>
    </div>

    <!-- Table Container Card -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <!-- Search and Filter Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="relative flex-1 max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="search-input"
                       class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition"
                       placeholder="Ad, soyad, e-posta veya kullanıcı adı ile ara...">
            </div>
            <div class="text-xs text-slate-400 flex items-center gap-1">
                <i data-lucide="table" class="w-3.5 h-3.5"></i>
                <span>Tabulator 6 Sunucu Sayfalaması</span>
            </div>
        </div>

        <!-- Tabulator 6 Target Div -->
        <div id="users-table"></div>
    </div>

</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/users-grid.js}"></script>
</th:block>
</body>
</html>
