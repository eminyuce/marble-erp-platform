<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Kullanıcılar | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-users-filters
     x-data="{ selectedRoles: [], enabled: '', density: 'compact', rolesInfoOpen: false }"
     :class="{ 'is-compact': density === 'compact' }">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Kullanıcılar')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="users" class="w-7 h-7 text-indigo-600 inline-block"></i>
                <span>Sistem Kullanıcıları &amp; Roller</span>
            </h2>
            <p class="erp-list-lead">Yönetici, ocak/fabrika/atölye şefleri ve operasyon hesaplarını arayın, rol veya duruma göre filtreleyin.</p>
        </div>
    </div>

    <!-- KPI Summary Cards (Blocks Standard) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" th:if="${summary != null}">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="enabled === '' ? 'erp-summary-card--active' : ''"
                @click="enabled = ''; $nextTick(() => reloadUsersGrid())">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Toplam Kullanıcı</div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.totalUsers}">0</span> hesap
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="enabled === 'true' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="enabled = 'true'; $nextTick(() => reloadUsersGrid())">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="user-check" class="w-3.5 h-3.5"></i> Aktif Hesaplar
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.activeUsers}">0</span> aktif
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="enabled === 'false' ? 'erp-summary-card--active ring-2 ring-rose-500' : ''"
                @click="enabled = 'false'; $nextTick(() => reloadUsersGrid())">
            <div class="text-[11px] uppercase tracking-wide text-rose-600 font-semibold flex items-center gap-1">
                <i data-lucide="user-x" class="w-3.5 h-3.5"></i> Askıdaki Hesaplar
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.suspendedUsers}">0</span> askıda
            </div>
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-4">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Sistem Yöneticileri</div>
            <div class="text-lg font-black text-amber-950 mt-1">
                <span th:text="${summary.adminCount}">0</span> yönetici
            </div>
        </div>
    </div>

    <div class="erp-toolbar">
        <a th:href="@{/admin/users/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni kullanıcı tanımla</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Ad, soyad, e-posta veya kullanıcı adı', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('users-table', 'kullanicilar')}"></div>
        </div>
        <input type="hidden" id="filter-enabled" x-model="enabled">

        <div class="erp-quick" aria-label="Rol veya duruma göre daraltın">
            <div class="erp-quick-row">
                <span class="erp-quick-label">Kullanıcı Yetkileri</span>
                <label th:each="filterRole : ${filterRoles}"
                       class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 cursor-pointer mr-1">
                    <input type="checkbox"
                           class="rounded border-slate-300 text-blue-700"
                           data-role-filter
                           th:value="${filterRole.authority}"
                           th:attr="aria-label=${filterRole.label}"
                           @change="onRoleFilterChange($event.target.value, $event.target.checked)">
                    <span th:text="${filterRole.label}">Rol</span>
                </label>
            </div>
            <div class="erp-quick-row">
                <span class="erp-quick-label">Durum</span>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === '' }"
                        @click="enabled = ''; $nextTick(() => reloadUsersGrid())">Tümü
                </button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'true' }"
                        @click="enabled = 'true'; $nextTick(() => reloadUsersGrid())">Aktif
                </button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'false' }"
                        @click="enabled = 'false'; $nextTick(() => reloadUsersGrid())">Askıda
                </button>
            </div>
        </div>
    </div>

    <div class="erp-grid-chrome">
        <span></span>
        <fieldset class="erp-density">
            <legend class="sr-only">Tablo yoğunluğu</legend>
            <span class="erp-density-label">Yoğunluk</span>
            <div class="erp-density-toggle">
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'comfortable' }"
                        @click="density = 'comfortable'">Rahat
                </button>
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'compact' }"
                        @click="density = 'compact'">Kompakt
                </button>
            </div>
        </fieldset>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('users-table')}"></div>

    <section id="roles-info" class="mt-8 rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <button type="button"
                class="w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-slate-50 transition"
                @click="rolesInfoOpen = !rolesInfoOpen; $nextTick(() => { if (window.lucide) lucide.createIcons(); })"
                :aria-expanded="rolesInfoOpen.toString()"
                aria-controls="roles-info-panel">
            <span class="flex items-center gap-3 min-w-0">
                <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-amber-100 text-amber-700">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </span>
                <span>
                    <span class="block text-sm font-bold text-slate-900">Roller ve Yetkiler</span>
                    <span class="block text-xs text-slate-500 mt-0.5">Sistem rollerinin açıklamalarını ve yetkilerini görüntüleyin</span>
                </span>
            </span>
            <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 flex-shrink-0">
                <span x-text="rolesInfoOpen ? 'Gizle' : 'Göster'">Göster</span>
                <span class="inline-flex transition-transform" :class="{ 'rotate-180': rolesInfoOpen }">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </span>
            </span>
        </button>
        <div id="roles-info-panel"
             x-show="rolesInfoOpen"
             x-cloak
             x-transition
             class="px-5 pb-5 border-t border-slate-100">
            <div th:replace="~{fragments/roles-info :: cards}"></div>
        </div>
    </section>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        window.USER_ROLE_LABELS = /*[[${roleLabelMap}]]*/ {};
    </script>
    <script th:src="@{/js/users-grid.js(v=${assetVersion})}"></script>
</th:block>
</body>
</html>
