<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Kullanıcılar | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-users-filters
     x-data="{ selectedRoles: [], enabled: '', density: 'compact' }"
     :class="{ 'is-compact': density === 'compact' }">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Kullanıcılar')}"></div>
            <h2 class="admin-page-title">Kullanıcılar</h2>
            <p class="erp-list-lead">Yönetici ve operasyon hesaplarını arayın, rol veya duruma göre filtreleyin ve işlem
                menüsünden düzenleyin.</p>
        </div>
    </div>

    <div class="erp-toolbar">
        <a th:href="@{/admin/users/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni kullanıcı tanımla</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Ad, soyad, e-posta veya kullanıcı adı', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div x-data="{ exportOpen: false }" class="relative">
                <button @click="exportOpen = !exportOpen" type="button" class="erp-btn-secondary">
                    <i data-lucide="download"></i>
                    <span>Dışa Aktar</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div x-show="exportOpen" @click.outside="exportOpen = false" x-transition
                     class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50"
                     style="display:none;">
                    <button @click="downloadTable(usersTable, 'kullanicilar', 'csv'); exportOpen = false"
                            type="button"
                            class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                        <span><strong>CSV</strong> <span class="text-slate-400">(.csv)</span></span>
                    </button>
                    <button @click="downloadTable(usersTable, 'kullanicilar', 'xlsx'); exportOpen = false"
                            type="button"
                            class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                        <span><strong>Excel</strong> <span class="text-slate-400">(.xlsx)</span></span>
                    </button>
                </div>
            </div>
        </div>
        <input type="hidden" id="filter-enabled" x-model="enabled">

        <div class="erp-quick" aria-label="Rol veya duruma göre daraltın">
            <div class="erp-quick-row">
                <span class="erp-quick-label">Kullanıcı Yetkileri</span>
                <label th:each="filterRole : ${filterRoles}"
                       class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 cursor-pointer mr-1">
                    <input type="checkbox"
                           class="rounded border-slate-300 text-blue-700"
                           data-role-filter
                           th:value="${filterRole.authority}"
                           th:attr="aria-label=${filterRole.label}"
                           @change="onRoleFilterChange($event.target.value, $event.target.checked)">
                    <span th:text="${filterRole.label}">Rol</span>
                </label>
            </div>
            <div class="erp-quick-row">
                <span class="erp-quick-label">Durum</span>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === '' }"
                        @click="enabled = ''; $nextTick(() => reloadUsersGrid())">Tümü
                </button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'true' }"
                        @click="enabled = 'true'; $nextTick(() => reloadUsersGrid())">Aktif
                </button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'false' }"
                        @click="enabled = 'false'; $nextTick(() => reloadUsersGrid())">Askıda
                </button>
            </div>
        </div>
    </div>

    <div class="erp-grid-chrome">
        <span></span>
        <fieldset class="erp-density">
            <legend class="sr-only">Tablo yoğunluğu</legend>
            <span class="erp-density-label">Yoğunluk</span>
            <div class="erp-density-toggle">
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'comfortable' }"
                        @click="density = 'comfortable'">Rahat
                </button>
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'compact' }"
                        @click="density = 'compact'">Kompakt
                </button>
            </div>
        </fieldset>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('users-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        window.USER_ROLE_LABELS = /*[[${roleLabelMap}]]*/ {};
    </script>
    <script th:src="@{/js/users-grid.js}"></script>
</th:block>
</body>
</html>
