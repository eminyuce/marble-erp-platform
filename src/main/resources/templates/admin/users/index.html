<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Kullanıcılar | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-users-filters
     x-data="{ role: '', enabled: '', density: 'compact' }"
     :class="{ 'is-compact': density === 'compact' }">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Kullanıcılar')}"></div>
            <h2 class="admin-page-title">Kullanıcılar</h2>
            <p class="erp-list-lead">Yönetici ve operasyon hesaplarını arayın, rol veya duruma göre filtreleyin ve işlem menüsünden düzenleyin.</p>
        </div>
        <div class="erp-list-header-actions">
            <button type="button" onclick="downloadTableCsv(usersTable, 'kullanicilar.csv')" class="erp-btn-secondary">
                <i data-lucide="download"></i>
                <span>CSV İndir</span>
            </button>
            <button type="button" hx-get="/admin/users/create" hx-target="#modal-container" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni kullanıcı tanımla</span>
            </button>
        </div>
    </div>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Ad, soyad, e-posta veya kullanıcı adı', 'search-input')}"></div>
        <input type="hidden" id="filter-role" x-model="role">
        <input type="hidden" id="filter-enabled" x-model="enabled">

        <div class="erp-quick" aria-label="Rol veya duruma göre daraltın">
            <div class="erp-quick-row">
                <span class="erp-quick-label">Kullanıcı Yetkileri</span>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': role === '' }" @click="role = ''; $nextTick(() => reloadUsersGrid())">Tümü</button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': role === 'ROLE_ADMIN' }" @click="role = 'ROLE_ADMIN'; $nextTick(() => reloadUsersGrid())">Yönetici</button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': role === 'ROLE_USER' }" @click="role = 'ROLE_USER'; $nextTick(() => reloadUsersGrid())">Kullanıcı</button>
            </div>
            <div class="erp-quick-row">
                <span class="erp-quick-label">Durum</span>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === '' }" @click="enabled = ''; $nextTick(() => reloadUsersGrid())">Tümü</button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'true' }" @click="enabled = 'true'; $nextTick(() => reloadUsersGrid())">Aktif</button>
                <button type="button" class="erp-quick-chip" :class="{ 'is-active': enabled === 'false' }" @click="enabled = 'false'; $nextTick(() => reloadUsersGrid())">Askıda</button>
            </div>
        </div>
    </div>

    <div class="erp-grid-chrome">
        <span></span>
        <fieldset class="erp-density">
            <legend class="sr-only">Tablo yoğunluğu</legend>
            <span class="erp-density-label">Yoğunluk</span>
            <div class="erp-density-toggle">
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'comfortable' }" @click="density = 'comfortable'">Rahat</button>
                <button type="button" class="erp-density-btn" :class="{ 'is-active': density === 'compact' }" @click="density = 'compact'">Kompakt</button>
            </div>
        </fieldset>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('users-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/users-grid.js}"></script>
</th:block>
</body>
</html>
