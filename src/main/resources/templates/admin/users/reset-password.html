<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="resetPasswordModalContent" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden flex flex-col">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 class="text-base font-bold text-slate-800">Şifre Sıfırlama</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form th:action="@{'/admin/users/' + ${user.id} + '/reset-password'}"
              method="post"
              th:hx-post="@{'/admin/users/' + ${user.id} + '/reset-password'}"
              hx-target="#modal-container"
              class="p-6 space-y-4">

            <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-xs flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0"></i>
                <div>
                    <strong th:text="${user.fullName}">Kullanıcı</strong> için yeni bir geçici şifre belirliyorsunuz.
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Yeni Geçici Şifre</label>
                <input type="password" name="newPassword" required autofocus
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
                       placeholder="En az 6 karakter">
            </div>

            <div class="pt-3 border-t border-slate-200 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()"
                        class="px-4 py-2 border border-slate-200 text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-lg transition">
                    İptal
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-amber-700 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg shadow-sm transition">
                    Şifreyi Güncelle
                </button>
            </div>
        </form>
    </div>
</div>

<div th:fragment="resetPasswordSuccess" class="hidden">
    <script>
        closeModal();
        reloadUsersGrid();
        alert("Kullanıcı şifresi başarıyla güncellendi.");
    </script>
</div>
</html>
