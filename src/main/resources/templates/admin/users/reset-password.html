<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Şifre Sıfırla | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Kullanıcılar', @{/admin/users}, 'Şifre sıfırla')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Şifre sıfırla',
        'Seçilen kullanıcı için yeni bir geçici şifre belirleyin.',
        ${'Kayıt #' + user.id},
        @{/admin/users})}"></div>

    <div class="erp-form-card">
        <form th:object="${passwordForm}"
              th:action="@{/admin/users/{id}/reset-password(id=${user.id})}"
              method="post"
              class="erp-form">

            <div class="erp-form-body">
                <div th:if="${formErrors != null and !formErrors.isEmpty()}" class="erp-form-errors" role="alert">
                    <div th:each="err : ${formErrors}" th:text="${err}">Hata mesajı</div>
                </div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Hesap', 'Şifresi güncellenecek kullanıcı')}"></div>
                    <div class="erp-form-panel">
                        <p class="erp-form-hint" style="margin:0;">
                            <strong th:text="${user.fullName}">Kullanıcı</strong>
                            · <span th:text="${user.email}">email</span>
                        </p>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Yeni şifre', 'Kullanıcı bir sonraki girişte bu şifreyi kullanır')}"></div>
                    <div class="erp-form-field">
                        <label class="erp-form-label" for="newPassword">Geçici şifre <span class="req">*</span></label>
                        <input id="newPassword" type="password" th:field="*{newPassword}" required autofocus
                               autocomplete="new-password"
                               class="erp-form-input" placeholder="En az 6 karakter"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
                           class="erp-form-field-error"></p>
                    </div>
                </section>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/admin/users})}"></div>
        </form>
    </div>
</div>
</body>
</html>
