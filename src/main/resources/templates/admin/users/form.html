<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${((isEdit ?: false) ? 'Kullanıcı Düzenle' : 'Yeni Kullanıcı') + ' | Özerler Mermer ERP'}">Kullanıcı</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Kullanıcılar', @{/admin/users}, ${(isEdit ?: false) ? 'Düzenle' : 'Yeni kayıt'})}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        ${(isEdit ?: false) ? 'Kullanıcı düzenle' : 'Yeni kullanıcı'},
        ${(isEdit ?: false) ? 'Kimlik, iletişim ve yetki bilgilerini güncelleyin. Değişiklikler kayıttan sonra hemen uygulanır.' : 'Sisteme yeni bir yönetici veya operasyon hesabı ekleyin.'},
        ${(isEdit ?: false) ? 'Kayıt #' + userForm?.id : ''},
        @{/admin/users})}"></div>

    <div class="erp-form-card">
        <form th:object="${userForm}"
              th:action="${(isEdit ?: false)} ? @{/admin/users/{id}/edit(id=${userForm.id})} : @{/admin/users/create}"
              method="post"
              class="erp-form">

            <input type="hidden" th:if="${isEdit ?: false}" th:field="*{id}"/>

            <div class="erp-form-body">
                <div th:if="${formErrors != null and !formErrors.isEmpty()}" class="erp-form-errors" role="alert">
                    <div th:each="err : ${formErrors}" th:text="${err}">Hata mesajı</div>
                </div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kimlik', 'Kişinin görünen adı ve hesap tanımlayıcısı')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="firstName">Ad <span class="req">*</span></label>
                            <input id="firstName" type="text" th:field="*{firstName}" required autocomplete="given-name"
                                   placeholder="Örn: Ahmet"
                                   class="erp-form-input"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"
                               class="erp-form-field-error"></p>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="lastName">Soyad <span class="req">*</span></label>
                            <input id="lastName" type="text" th:field="*{lastName}" required autocomplete="family-name"
                                   placeholder="Örn: Yılmaz"
                                   class="erp-form-input"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                            <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"
                               class="erp-form-field-error"></p>
                        </div>
                        <div class="erp-form-field erp-form-field--full" th:if="${!isEdit}">
                            <label class="erp-form-label" for="username">Kullanıcı adı <span
                                    class="req">*</span></label>
                            <input id="username" type="text" th:field="*{username}" required autocomplete="username"
                                   placeholder="örnek.kullanici"
                                   class="erp-form-input"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                               class="erp-form-field-error"></p>
                            <p th:unless="${#fields.hasErrors('username')}" class="erp-form-hint">Girişte kullanılır;
                                oluşturulduktan sonra değiştirilemez.</p>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('İletişim', 'Bildirimler ve giriş için e-posta adresi')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="email">E-posta <span class="req">*</span></label>
                            <input id="email" type="email" th:field="*{email}" required autocomplete="email"
                                   placeholder="ad.soyad@sirket.com"
                                   class="erp-form-input"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                               class="erp-form-field-error"></p>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section" th:if="${!isEdit}">
                    <div th:replace="~{fragments/form-page :: section('Güvenlik', 'İlk giriş için geçici bir şifre belirleyin')}"></div>
                    <div class="erp-form-field">
                        <label class="erp-form-label" for="password">Geçici şifre <span class="req">*</span></label>
                        <input id="password" type="password" th:field="*{password}" required autocomplete="new-password"
                               placeholder="En az 6 karakter"
                               class="erp-form-input"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                           class="erp-form-field-error"></p>
                        <p th:unless="${#fields.hasErrors('password')}" class="erp-form-hint">Kullanıcı ilk girişte bu
                            şifreyi kullanır; daha sonra kendi şifresini belirleyebilir.</p>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Yetki ve durum', 'Menü erişimi ve hesabın aktif olup olmadığı')}"></div>
                    <div class="erp-form-field">
                        <span class="erp-form-label">Roller</span>
                        <p class="erp-form-hint">Boş bırakılırsa standart kullanıcı rolü atanır.</p>
                        <div class="erp-form-roles">
                            <label th:each="role : ${allRoles}" class="erp-form-check">
                                <input type="checkbox" th:field="*{roles}" th:value="${role.name}">
                                <span th:text="${role.description != null ? role.description : role.name}">Rol</span>
                            </label>
                        </div>
                    </div>
                    <label class="erp-form-check" for="user-enabled">
                        <input type="checkbox" id="user-enabled" th:field="*{enabled}">
                        <span>Kullanıcı hesabı aktif</span>
                    </label>
                </section>

                <div th:if="${(isEdit ?: false) and userForm != null and userForm.createdDate != null}"
                     th:replace="~{fragments/audit :: auditInfo(${userForm.createdDate}, ${userForm.updatedDate}, ${userForm.addUserId}, ${userForm.updateUserId})}"></div>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/admin/users})}"></div>
        </form>
    </div>
</div>
</body>
</html>
