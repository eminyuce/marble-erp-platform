<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Modal Content Fragment -->
<div th:fragment="userModalContent" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 class="text-base font-bold text-slate-800" th:text="${isEdit ? 'Kullanıcı Düzenle' : 'Yeni Kullanıcı Oluştur'}">
                Kullanıcı Oluştur
            </h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Modal Body & Form -->
        <form th:object="${userForm}"
              th:action="${isEdit ? '/admin/users/' + userForm.id + '/edit' : '/admin/users/create'}"
              th:attr="hx-post=${isEdit ? '/admin/users/' + userForm.id + '/edit' : '/admin/users/create'}"
              method="post"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="p-6 overflow-y-auto space-y-4">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:if="${isEdit}" th:field="*{id}"/>

            <div th:if="${formErrors != null and !formErrors.isEmpty()}" class="p-3 bg-rose-50 border border-rose-200 rounded-lg text-rose-800 text-xs space-y-1">
                <div th:each="err : ${formErrors}" th:text="${err}">Hata mesajı</div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ad</label>
                    <input type="text" th:field="*{firstName}" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Soyad</label>
                    <input type="text" th:field="*{lastName}" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">E-Posta</label>
                <input type="email" th:field="*{email}" required
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div th:if="${!isEdit}">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Kullanıcı Adı</label>
                <input type="text" th:field="*{username}" required
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div th:if="${!isEdit}">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Geçici Şifre</label>
                <input type="password" th:field="*{password}" required
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
                       placeholder="En az 6 karakter">
            </div>

            <!-- Roles Checklist -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-2">Roller &amp; Erişim Yetkileri</label>
                <p class="text-[11px] text-slate-500 mb-2">Hesabın erişebileceği menü ve işlemleri seçin. Boş bırakılırsa standart kullanıcı rolü atanır.</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs max-h-48 overflow-y-auto">
                    <label th:each="role : ${allRoles}" class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" th:field="*{roles}" th:value="${role.name}"
                               class="rounded border-slate-300 text-amber-600 focus:ring-amber-500">
                        <span class="text-slate-700" th:text="${role.description != null ? role.description : role.name}">Rol Tanımı</span>
                    </label>
                </div>
            </div>

            <!-- Enabled Switch -->
            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="user-enabled" th:field="*{enabled}"
                       class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                <label for="user-enabled" class="text-xs font-semibold text-slate-700 cursor-pointer">Kullanıcı Hesabı Aktif</label>
            </div>

            <!-- Modal Actions -->
            <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()"
                        class="px-4 py-2 border border-slate-200 text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-lg transition">
                    İptal
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-[#2b6cb0] hover:bg-[#1e4e8c] text-white text-xs font-semibold rounded-lg shadow-sm transition">
                    Kaydet
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Success Fragment -->
<div th:fragment="userModalSuccess" class="hidden">
    <script>
        closeModal();
        if (typeof reloadUsersGrid === "function") {
            reloadUsersGrid();
        }
    </script>
</div>
</html>
