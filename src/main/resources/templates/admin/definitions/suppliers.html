<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Tedarikçiler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Tedarikçiler')}"></div>
            <h2 class="admin-page-title">Tedarikçiler &amp; Fason</h2>
            <p class="erp-list-lead">Satın alma siparişleri, sarf malzeme alımları ve fason hizmet sağlayan iş ortakları.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <a th:href="@{/admin/definitions/suppliers/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni tedarikçi</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Tedarikçi kodu, firma adı veya yetkili', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="supplier-type-filter" class="erp-toolbar-filter" aria-label="Tedarikçi tipi">
                <option value="">Tüm tedarikçi tipleri</option>
                <option th:each="type : ${supplierTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('suppliers-table', 'tedarikciler')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('suppliers-table')}"></div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Tedarikçiyi Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> tedarikçisini silmek istediğinize emin misiniz? Satın alma siparişlerinde kayıtlı tedarikçiler silinemez.
            </p>
            <form :action="'/admin/definitions/suppliers/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#suppliers-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/suppliers/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const type = document.getElementById("supplier-type-filter")?.value || "";
                        return type ? "&type=" + encodeURIComponent(type) : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("suppliers-table", response);
                },
                placeholder: "Tedarikçi kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    {
                        title: "Tedarikçi Kodu",
                        field: "supplierCode",
                        width: 150,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Firma / Ünvan",
                        field: "companyName",
                        minWidth: 200,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-semibold text-slate-800">${gridText(row.companyName)}</div>
                                <div class="text-xs text-slate-400">${gridText(row.address)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Tedarik Tipi",
                        field: "supplierTypeLabel",
                        width: 150,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-cyan-50 text-cyan-800 border border-cyan-200">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Yetkili / İletişim",
                        minWidth: 180,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-medium text-slate-800">${gridText(row.contactPerson)}</div>
                                <div class="text-xs text-slate-500 font-mono">${gridText(row.phone)} ${gridText(row.email)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Vergi Dairesi / No",
                        minWidth: 160,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<span class="font-mono text-slate-600">${gridText(row.taxOffice)} / ${gridText(row.taxNumber)}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", href: "/admin/definitions/suppliers/" + id + "/edit"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "supplier-type-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
