<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Müşteriler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    activeUnit: '',
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    },
    setUnit(u) {
        this.activeUnit = u;
        const sel = document.getElementById('business-unit-filter');
        if (sel) sel.value = u;
        if (window.definitionTable) window.definitionTable.setPage(1);
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Cari Hesaplar')}"></div>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mt-1">
                <div>
                    <h2 class="admin-page-title text-2xl font-black text-slate-900 flex items-center gap-2">
                        <i data-lucide="users" class="w-7 h-7 text-blue-600"></i>
                        <span>Cari Hesaplar / Müşteriler</span>
                    </h2>
                    <p class="erp-list-lead text-xs text-slate-600 mt-1">
                        Ocak, Fabrika, Atölye ve Şantiye carilerini oluşturun, birim bazında filtreleyin, düzenleyin ve yönetin.
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <a th:href="@{/admin/definitions/customers/create}" class="erp-btn-primary">
                        <i data-lucide="user-plus"></i>
                        <span>+ Yeni Cari Aç</span>
                    </a>
                    <a th:href="@{/projects}" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition border border-slate-300">
                        <i data-lucide="building-2" class="w-4 h-4 text-cyan-600"></i>
                        <span>Şantiyeler Modülü</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Birim Kırılımı Hızlı Filtre Sekmeleri (Ocak, Fabrika, Atölye, Şantiye) -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
        <button type="button" @click="setUnit('')"
                :class="activeUnit === '' ? 'bg-slate-900 text-white font-bold shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'"
                class="px-4 py-2 rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>Tüm Cariler</span>
        </button>
        <button type="button" @click="setUnit('QUARRY')"
                :class="activeUnit === 'QUARRY' ? 'bg-amber-600 text-white font-bold shadow-sm' : 'bg-white text-amber-900 hover:bg-amber-50 border border-amber-200'"
                class="px-4 py-2 rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5">
            <i data-lucide="mountain" class="w-3.5 h-3.5 text-amber-600" :class="activeUnit === 'QUARRY' ? 'text-white' : ''"></i>
            <span>Ocak Müşterileri</span>
        </button>
        <button type="button" @click="setUnit('FACTORY')"
                :class="activeUnit === 'FACTORY' ? 'bg-blue-600 text-white font-bold shadow-sm' : 'bg-white text-blue-900 hover:bg-blue-50 border border-blue-200'"
                class="px-4 py-2 rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5">
            <i data-lucide="factory" class="w-3.5 h-3.5 text-blue-600" :class="activeUnit === 'FACTORY' ? 'text-white' : ''"></i>
            <span>Fabrika Müşterileri</span>
        </button>
        <button type="button" @click="setUnit('WORKSHOP')"
                :class="activeUnit === 'WORKSHOP' ? 'bg-rose-600 text-white font-bold shadow-sm' : 'bg-white text-rose-900 hover:bg-rose-50 border border-rose-200'"
                class="px-4 py-2 rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5">
            <i data-lucide="scissors" class="w-3.5 h-3.5 text-rose-600" :class="activeUnit === 'WORKSHOP' ? 'text-white' : ''"></i>
            <span>Atölye Müşterileri</span>
        </button>
        <button type="button" @click="setUnit('SITE')"
                :class="activeUnit === 'SITE' ? 'bg-cyan-600 text-white font-bold shadow-sm' : 'bg-white text-cyan-900 hover:bg-cyan-50 border border-cyan-200'"
                class="px-4 py-2 rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5">
            <i data-lucide="building-2" class="w-3.5 h-3.5 text-cyan-600" :class="activeUnit === 'SITE' ? 'text-white' : ''"></i>
            <span>Şantiye Müşterileri</span>
        </button>
    </div>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Müşteri kodu, firma adı veya yetkili ara...', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="business-unit-filter" class="erp-toolbar-filter" aria-label="İşletme birimi" @change="activeUnit = $el.value">
                <option value="">Tüm birimler</option>
                <option th:each="bu : ${businessUnits}" th:value="${bu.name()}" th:text="${bu.displayName}"></option>
            </select>
            <select id="customer-type-filter" class="erp-toolbar-filter" aria-label="Müşteri tipi">
                <option value="">Tüm müşteri tipleri</option>
                <option th:each="type : ${customerTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('customers-table', 'musteriler')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('customers-table')}"></div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Müşteriyi Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> müşterisini silmek istediğinize emin misiniz? Aktif satış veya sipariş kaydı bulunan müşteriler silinemez.
            </p>
            <form :action="'/admin/definitions/customers/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#customers-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/customers/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const type = document.getElementById("customer-type-filter")?.value || "";
                        const unit = document.getElementById("business-unit-filter")?.value || "";
                        let extra = "";
                        if (type) extra += "&type=" + encodeURIComponent(type);
                        if (unit) extra += "&unit=" + encodeURIComponent(unit);
                        return extra;
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("customers-table", response);
                },
                placeholder: "Müşteri kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Cari Kodu",
                        field: "customerCode",
                        width: 140,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/admin/definitions/customers/${row.id}/transactions" class="font-mono font-bold text-indigo-600 hover:text-indigo-800 hover:underline" title="Cari Hesap Hareketleri">${gridText(cell.getValue())}</a>`;
                        }
                    },
                    {
                        title: "Firma / Ünvan",
                        field: "companyName",
                        minWidth: 200,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <a href="/admin/definitions/customers/${row.id}/transactions" class="font-bold text-slate-900 hover:text-indigo-600 hover:underline block" title="Cari Hesap Hareketleri">${gridText(row.companyName)}</a>
                                <div class="text-xs text-slate-400">${gridText(row.address)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "İşletme Birimi",
                        field: "businessUnitLabel",
                        width: 140,
                        formatter: function (cell) {
                            const val = gridText(cell.getValue());
                            if (!val || val === "—") return '<span class="text-slate-400">Genel</span>';
                            return `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-800 border border-amber-200">${val}</span>`;
                        }
                    },
                    {
                        title: "Müşteri Tipi",
                        field: "customerTypeLabel",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-800 border border-blue-200">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Yetkili / İletişim",
                        minWidth: 180,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-medium text-slate-800">${gridText(row.contactPerson)}</div>
                                <div class="text-xs text-slate-500 font-mono">${gridText(row.phone)} ${gridText(row.email)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Bakiye",
                        field: "balance",
                        width: 140,
                        headerHozAlign: "right",
                        hozAlign: "right",
                        formatter: function (cell) {
                            const val = cell.getValue() != null ? Number(cell.getValue()) : 0;
                            if (val > 0.009) {
                                return `<span class="font-mono font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">${gridMoney(val)} (B)</span>`;
                            } else if (val < -0.009) {
                                return `<span class="font-mono font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${gridMoney(Math.abs(val))} (A)</span>`;
                            }
                            return `<span class="font-mono text-slate-400">0,00 TL</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 150,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "file-text", label: "Hesap Hareketleri", href: "/admin/definitions/customers/" + id + "/transactions"},
                                {icon: "edit-3", label: "Düzenle", href: "/admin/definitions/customers/" + id + "/edit"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });

            window.definitionTable.on("rowClick", (e, row) => {
                if (e.target.closest("button") || e.target.closest("a") || e.target.closest(".tabulator-responsive-collapse-toggle")) {
                    return;
                }
                const data = row.getData();
                if (data && data.id) {
                    window.location.href = "/admin/definitions/customers/" + data.id + "/transactions";
                }
            });

            document.getElementById("business-unit-filter")?.addEventListener("change", () => {
                if (window.definitionTable) window.definitionTable.setPage(1);
            });
            document.getElementById("customer-type-filter")?.addEventListener("change", () => {
                if (window.definitionTable) window.definitionTable.setPage(1);
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "customer-type-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
