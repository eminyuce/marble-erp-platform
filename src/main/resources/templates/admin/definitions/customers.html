<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Müşteriler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    modalOpen: false,
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    isEdit: false,
    form: {
        id: null,
        customerCode: '',
        companyName: '',
        contactPerson: '',
        phone: '',
        email: '',
        address: '',
        taxOffice: '',
        taxNumber: '',
        customerType: 'CONSTRUCTION',
        notes: ''
    },
    openCreateModal() {
        this.isEdit = false;
        this.form = {
            id: null,
            customerCode: '',
            companyName: '',
            contactPerson: '',
            phone: '',
            email: '',
            address: '',
            taxOffice: '',
            taxNumber: '',
            customerType: 'CONSTRUCTION',
            notes: ''
        };
        this.modalOpen = true;
    },
    openEditModal(c) {
        this.isEdit = true;
        this.form = {
            id: c.id,
            customerCode: c.customerCode,
            companyName: c.companyName,
            contactPerson: c.contactPerson || '',
            phone: c.phone || '',
            email: c.email || '',
            address: c.address || '',
            taxOffice: c.taxOffice || '',
            taxNumber: c.taxNumber || '',
            customerType: c.customerType,
            notes: c.notes || ''
        };
        this.modalOpen = true;
    },
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Sistem Tanımları', '/admin/definitions', 'Müşteriler')}"></div>
            <h2 class="admin-page-title">Müşteri Rehberi</h2>
            <p class="erp-list-lead">Satış siparişleri, blok rezervasyonları ve şantiye sözleşmelerinde kullanılan cari hesap kartları.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <button type="button" class="erp-btn-primary" @click="openCreateModal()">
            <i data-lucide="plus"></i>
            <span>Yeni müşteri</span>
        </button>
        <div th:replace="~{fragments/list-chrome :: search('Müşteri kodu, firma adı veya yetkili', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="customer-type-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white">
                <option value="">Tüm müşteri tipleri</option>
                <option th:each="type : ${customerTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('customers-table', 'musteriler')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('customers-table')}"></div>

    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;" @keydown.escape.window="modalOpen = false">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-xl p-6 space-y-4 max-h-[90vh] overflow-y-auto"
             @click.outside="modalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900" x-text="isEdit ? 'Müşteri Düzenle' : 'Yeni Müşteri Tanımla'"></h3>
                <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form th:action="@{/admin/definitions/customers/save}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" :value="form.id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Müşteri / Cari Kodu *</label>
                        <input type="text" name="customerCode" x-model="form.customerCode" required
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Müşteri Tipi *</label>
                        <select name="customerType" x-model="form.customerType" required
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option th:each="type : ${customerTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Firma / Ünvan Adı *</label>
                    <input type="text" name="companyName" x-model="form.companyName" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Yetkili Kişi</label>
                        <input type="text" name="contactPerson" x-model="form.contactPerson"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Telefon</label>
                        <input type="text" name="phone" x-model="form.phone"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-posta</label>
                        <input type="email" name="email" x-model="form.email"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vergi Dairesi</label>
                        <input type="text" name="taxOffice" x-model="form.taxOffice"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Vergi Numarası</label>
                        <input type="text" name="taxNumber" x-model="form.taxNumber"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Adres</label>
                    <textarea name="address" x-model="form.address" rows="2"
                              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Notlar</label>
                    <textarea name="notes" x-model="form.notes" rows="2"
                              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" @click="modalOpen = false" class="erp-btn-secondary">İptal</button>
                    <button type="submit" class="erp-btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Müşteriyi Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> müşterisini silmek istediğinize emin misiniz? Aktif satış veya sipariş kaydı bulunan müşteriler silinemez.
            </p>
            <form :action="'/admin/definitions/customers/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#customers-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/customers/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const type = document.getElementById("customer-type-filter")?.value || "";
                        return type ? "&type=" + encodeURIComponent(type) : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("customers-table", response);
                },
                placeholder: "Müşteri kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    {
                        title: "Cari Kodu",
                        field: "customerCode",
                        width: 140,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Firma / Ünvan",
                        field: "companyName",
                        minWidth: 200,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-semibold text-slate-800">${gridText(row.companyName)}</div>
                                <div class="text-xs text-slate-400">${gridText(row.address)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Müşteri Tipi",
                        field: "customerTypeLabel",
                        width: 150,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-800 border border-blue-200">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Yetkili / İletişim",
                        minWidth: 180,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-medium text-slate-800">${gridText(row.contactPerson)}</div>
                                <div class="text-xs text-slate-500 font-mono">${gridText(row.phone)} ${gridText(row.email)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Vergi Dairesi / No",
                        minWidth: 160,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<span class="font-mono text-slate-600">${gridText(row.taxOffice)} / ${gridText(row.taxNumber)}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", onclick: "openDefinitionEdit(" + id + ")"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "customer-type-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
