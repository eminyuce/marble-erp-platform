<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Masraf Merkezleri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    modalOpen: false,
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    isEdit: false,
    form: {
        id: null,
        code: '',
        name: '',
        businessUnit: 'FACTORY',
        monthlyBudget: '0.00',
        description: ''
    },
    openCreateModal() {
        this.isEdit = false;
        this.form = {
            id: null,
            code: '',
            name: '',
            businessUnit: 'FACTORY',
            monthlyBudget: '0.00',
            description: ''
        };
        this.modalOpen = true;
    },
    openEditModal(cc) {
        this.isEdit = true;
        this.form = {
            id: cc.id,
            code: cc.code,
            name: cc.name,
            businessUnit: cc.businessUnit || 'FACTORY',
            monthlyBudget: cc.monthlyBudget,
            description: cc.description || ''
        };
        this.modalOpen = true;
    },
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Sistem Tanımları', '/admin/definitions', 'Masraf Merkezleri')}"></div>
            <h2 class="admin-page-title">Masraf Merkezleri</h2>
            <p class="erp-list-lead">Maliyet muhasebesi, gider havuzları, iş birimi dağıtımı ve aylık bütçe hedefleri.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <button type="button" class="erp-btn-primary" @click="openCreateModal()">
            <i data-lucide="plus"></i>
            <span>Yeni masraf merkezi</span>
        </button>
        <div th:replace="~{fragments/list-chrome :: search('Merkez kodu veya adı', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="cost-center-unit-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white">
                <option value="">Tüm birimler</option>
                <option th:each="unit : ${businessUnits}" th:value="${unit.name()}" th:text="${unit.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('cost-centers-table', 'masraf_merkezleri')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('cost-centers-table')}"></div>

    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;" @keydown.escape.window="modalOpen = false">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 space-y-4"
             @click.outside="modalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900" x-text="isEdit ? 'Masraf Merkezi Düzenle' : 'Yeni Masraf Merkezi Tanımla'"></h3>
                <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form th:action="@{/admin/definitions/cost-centers/save}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" :value="form.id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Merkez Kodu *</label>
                        <input type="text" name="code" x-model="form.code" required
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">İş Birimi *</label>
                        <select name="businessUnit" x-model="form.businessUnit" required
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                            <option th:each="unit : ${businessUnits}" th:value="${unit.name()}" th:text="${unit.label}"></option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Masraf Merkezi Adı *</label>
                    <input type="text" name="name" x-model="form.name" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Aylık Bütçe (TRY) *</label>
                    <input type="number" step="0.01" name="monthlyBudget" x-model="form.monthlyBudget" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Açıklama</label>
                    <textarea name="description" x-model="form.description" rows="2"
                              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" @click="modalOpen = false" class="erp-btn-secondary">İptal</button>
                    <button type="submit" class="erp-btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Masraf Merkezini Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> masraf merkezini silmek istediğinize emin misiniz? Kayıtlı maliyet fişleri bulunan masraf merkezleri silinemez.
            </p>
            <form :action="'/admin/definitions/cost-centers/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#cost-centers-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/cost-centers/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const unit = document.getElementById("cost-center-unit-filter")?.value || "";
                        return unit ? "&unit=" + encodeURIComponent(unit) : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("cost-centers-table", response);
                },
                placeholder: "Masraf merkezi kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    {
                        title: "Merkez Kodu",
                        field: "code",
                        width: 130,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Masraf Merkezi Adı", field: "name", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İş Birimi",
                        field: "businessUnitLabel",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return businessUnitBadge(row.businessUnit, row.businessUnitLabel);
                        }
                    },
                    {
                        title: "Aylık Bütçe",
                        field: "monthlyBudget",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold">${gridMoney(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Açıklama", field: "description", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", onclick: "openDefinitionEdit(" + id + ")"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "cost-center-unit-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
