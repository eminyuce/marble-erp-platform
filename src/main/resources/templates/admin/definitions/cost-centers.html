<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Masraf Merkezleri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Masraf Merkezleri')}"></div>
            <h2 class="admin-page-title">Masraf Merkezleri</h2>
            <p class="erp-list-lead">Maliyet muhasebesi, gider havuzları, iş birimi dağıtımı ve aylık bütçe hedefleri.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <a th:href="@{/admin/definitions/cost-centers/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni masraf merkezi</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Merkez kodu veya adı', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="cost-center-unit-filter" class="erp-toolbar-filter" aria-label="İş birimi">
                <option value="">Tüm birimler</option>
                <option th:each="unit : ${businessUnits}" th:value="${unit.name()}" th:text="${unit.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('cost-centers-table', 'masraf_merkezleri')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('cost-centers-table')}"></div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Masraf Merkezini Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> masraf merkezini silmek istediğinize emin misiniz? Kayıtlı maliyet fişleri bulunan masraf merkezleri silinemez.
            </p>
            <form :action="'/admin/definitions/cost-centers/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#cost-centers-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/cost-centers/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const unit = document.getElementById("cost-center-unit-filter")?.value || "";
                        return unit ? "&unit=" + encodeURIComponent(unit) : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("cost-centers-table", response);
                },
                placeholder: "Masraf merkezi kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Merkez Kodu",
                        field: "code",
                        width: 130,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Masraf Merkezi Adı", field: "name", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İş Birimi",
                        field: "businessUnitLabel",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return businessUnitBadge(row.businessUnit, row.businessUnitLabel);
                        }
                    },
                    {
                        title: "Aylık Bütçe",
                        field: "monthlyBudget",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold">${gridMoney(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Açıklama", field: "description", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", href: "/admin/definitions/cost-centers/" + id + "/edit"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "cost-center-unit-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
