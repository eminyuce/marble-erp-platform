<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Maden Ocakları | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    modalOpen: false,
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    isEdit: false,
    form: {
        id: null,
        code: '',
        name: '',
        location: '',
        specificGravity: '2.70',
        licenseNo: ''
    },
    openCreateModal() {
        this.isEdit = false;
        this.form = {
            id: null,
            code: '',
            name: '',
            location: '',
            specificGravity: '2.70',
            licenseNo: ''
        };
        this.modalOpen = true;
    },
    openEditModal(q) {
        this.isEdit = true;
        this.form = {
            id: q.id,
            code: q.code,
            name: q.name,
            location: q.location,
            specificGravity: q.specificGravity,
            licenseNo: q.licenseNo || ''
        };
        this.modalOpen = true;
    },
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Sistem Tanımları', '/admin/definitions', 'Ocaklar')}"></div>
            <h2 class="admin-page-title">Maden Ocakları</h2>
            <p class="erp-list-lead">Hammadde blok üretimi yapılan ruhsatlı mermer ocaklarının tescil ve parametreleri.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <button type="button" class="erp-btn-primary" @click="openCreateModal()">
            <i data-lucide="plus"></i>
            <span>Yeni ocak</span>
        </button>
        <div th:replace="~{fragments/list-chrome :: search('Ocak kodu, adı veya bölgesi', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('quarries-table', 'ocaklar')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('quarries-table')}"></div>

    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;" @keydown.escape.window="modalOpen = false">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 space-y-4"
             @click.outside="modalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900" x-text="isEdit ? 'Ocak Düzenle' : 'Yeni Ocak Tanımla'"></h3>
                <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form th:action="@{/admin/definitions/quarries/save}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" :value="form.id">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ocak Kodu *</label>
                    <input type="text" name="code" x-model="form.code" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ocak Adı *</label>
                    <input type="text" name="name" x-model="form.name" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Lokasyon / Mevkii *</label>
                    <input type="text" name="location" x-model="form.location" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Özgül Ağırlık (ton/m³) *</label>
                        <input type="number" step="0.01" name="specificGravity" x-model="form.specificGravity" required
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Maden Ruhsat No</label>
                        <input type="text" name="licenseNo" x-model="form.licenseNo"
                               class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" @click="modalOpen = false" class="erp-btn-secondary">İptal</button>
                    <button type="submit" class="erp-btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Ocağı Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> ocağını silmek istediğinize emin misiniz? Bu ocağa bağlı blok kayıtları varsa silme işlemi engellenecektir.
            </p>
            <form :action="'/admin/definitions/quarries/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#quarries-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/quarries/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input");
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("quarries-table", response);
                },
                placeholder: "Ocak kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    {
                        title: "Ocak Kodu",
                        field: "code",
                        width: 130,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Ocak Adı", field: "name", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {title: "Lokasyon / Mevkii", field: "location", minWidth: 180, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "Özgül Ağırlık",
                        field: "specificGravity",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-emerald-700">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Ruhsat No", field: "licenseNo", minWidth: 140, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", onclick: "openDefinitionEdit(" + id + ")"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
