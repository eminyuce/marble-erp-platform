<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Stok Sahaları | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page" data-definition-page
     x-data="{
    modalOpen: false,
    deleteModalOpen: false,
    deleteId: null,
    deleteName: '',
    isEdit: false,
    form: {
        id: null,
        code: '',
        name: '',
        businessUnit: 'FACTORY',
        locationType: 'FACTORY_BLOCK_YARD',
        active: true
    },
    openCreateModal() {
        this.isEdit = false;
        this.form = {
            id: null,
            code: '',
            name: '',
            businessUnit: 'FACTORY',
            locationType: 'FACTORY_BLOCK_YARD',
            active: true
        };
        this.modalOpen = true;
    },
    openEditModal(loc) {
        this.isEdit = true;
        this.form = {
            id: loc.id,
            code: loc.code,
            name: loc.name,
            businessUnit: loc.businessUnit,
            locationType: loc.locationType,
            active: loc.active
        };
        this.modalOpen = true;
    },
    confirmDelete(id, name) {
        this.deleteId = id;
        this.deleteName = name;
        this.deleteModalOpen = true;
    }
}">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Sistem Tanımları', '/admin/definitions', 'Stok Sahaları')}"></div>
            <h2 class="admin-page-title">Stok Sahaları &amp; Depolar</h2>
            <p class="erp-list-lead">Ocak, fabrika ve atölyelerdeki fiziksel depolama, rampa ve stok ambarı lokasyonları.</p>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="erp-toolbar">
        <button type="button" class="erp-btn-primary" @click="openCreateModal()">
            <i data-lucide="plus"></i>
            <span>Yeni saha / depo</span>
        </button>
        <div th:replace="~{fragments/list-chrome :: search('Saha kodu veya adı', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <select id="location-unit-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white">
                <option value="">Tüm birimler</option>
                <option th:each="unit : ${businessUnits}" th:value="${unit.name()}" th:text="${unit.label}"></option>
            </select>
            <div th:replace="~{fragments/list-chrome :: exportDropdown('stock-locations-table', 'stok_sahalari')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('stock-locations-table')}"></div>

    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;" @keydown.escape.window="modalOpen = false">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 space-y-4"
             @click.outside="modalOpen = false">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900" x-text="isEdit ? 'Stok Sahası Düzenle' : 'Yeni Stok Sahası Tanımla'"></h3>
                <button type="button" @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form th:action="@{/admin/definitions/stock-locations/save}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" :value="form.id">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Saha / Depo Kodu *</label>
                    <input type="text" name="code" x-model="form.code" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono uppercase focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Saha / Depo Adı *</label>
                    <input type="text" name="name" x-model="form.name" required
                           class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">İş Birimi *</label>
                        <select name="businessUnit" x-model="form.businessUnit" required
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option th:each="unit : ${businessUnits}" th:value="${unit.name()}" th:text="${unit.label}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Lokasyon Tipi *</label>
                        <select name="locationType" x-model="form.locationType" required
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option th:each="type : ${locationTypes}" th:value="${type.name()}" th:text="${type.label}"></option>
                        </select>
                    </div>
                </div>
                <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-700">
                    <input type="checkbox" name="active" x-model="form.active" value="true" class="rounded border-slate-300 text-indigo-700">
                    <span>Aktif kullanımda</span>
                </label>
                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" @click="modalOpen = false" class="erp-btn-secondary">İptal</button>
                    <button type="submit" class="erp-btn-primary">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div x-show="deleteModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
         style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4"
             @click.outside="deleteModalOpen = false">
            <h3 class="text-base font-bold text-slate-900">Stok Sahasını Sil</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                <strong x-text="deleteName"></strong> kodlu sahayı silmek istediğinize emin misiniz? Temel ERP sahaları ve içinde kayıtlı blok bulunan sahalar silinemez.
            </p>
            <form :action="'/admin/definitions/stock-locations/' + deleteId + '/delete'" method="post" class="flex items-center justify-end gap-3 pt-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" @click="deleteModalOpen = false" class="erp-btn-secondary">Vazgeç</button>
                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">Evet, Sil</button>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/definitions-page.js(v=${assetVersion})}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.definitionTable = new Tabulator("#stock-locations-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/admin/definitions/stock-locations/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "search-input", function () {
                        const unit = document.getElementById("location-unit-filter")?.value || "";
                        return unit ? "&unit=" + encodeURIComponent(unit) : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("stock-locations-table", response);
                },
                placeholder: "Stok sahası kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    {
                        title: "Kod",
                        field: "code",
                        width: 150,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {title: "Saha / Depo Adı", field: "name", minWidth: 200, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "İş Birimi",
                        field: "businessUnitLabel",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return businessUnitBadge(row.businessUnit, row.businessUnitLabel);
                        }
                    },
                    {title: "Lokasyon Tipi", field: "locationTypeLabel", minWidth: 160, formatter: (cell) => gridText(cell.getValue())},
                    {
                        title: "Durum",
                        field: "active",
                        width: 110,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            const active = cell.getValue();
                            return `<button type="button" onclick="toggleDefinitionActive('/admin/definitions/stock-locations/${row.id}/toggle')"
                                class="px-2.5 py-1 rounded-full text-[10px] font-bold ${active ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-200'}">
                                ${active ? "● Aktif" : "○ Pasif"}
                            </button>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const id = cell.getRow().getData().id;
                            return gridActionsHtml([
                                {icon: "edit-3", label: "Düzenle", onclick: "openDefinitionEdit(" + id + ")"},
                                {icon: "trash-2", label: "Sil", onclick: "confirmDefinitionDelete(" + id + ")", danger: true}
                            ]);
                        }
                    }
                ]
            });
            attachTabulatorPagingAnimation(window.definitionTable);
            bindGridSearch(window.definitionTable, "search-input");
            bindGridSelectFilter(window.definitionTable, "location-unit-filter");
            window.definitionTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</th:block>
</body>
</html>
