<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>İş Emirleri &amp; Siparişler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     x-data="{
        deptFilter: '[[${selectedDepartment}]]',
        statusFilter: '[[${selectedStatus}]]',
        setDeptFilter(d) {
            this.deptFilter = d;
            if (typeof reloadOrdersGrid === 'function') reloadOrdersGrid();
        },
        setStatusFilter(s) {
            this.statusFilter = s;
            if (typeof reloadOrdersGrid === 'function') reloadOrdersGrid();
        },
        gridExtraQuery() {
            let q = '';
            if (this.deptFilter) q += '&department=' + encodeURIComponent(this.deptFilter);
            if (this.statusFilter) q += '&status=' + encodeURIComponent(this.statusFilter);
            return q;
        }
     }"
     x-init="window.ordersPageState = $data">

    <!-- Header Section -->
    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('İş Emirleri')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="clipboard-list" class="w-7 h-7 text-indigo-600 inline-block"></i>
                <span>İş Emirleri &amp; Sipariş Yönetimi</span>
            </h2>
            <p class="erp-list-lead">
                Fabrika, Atölye ve Şantiye departmanlarına ait üretim iş emirleri, hammadde bağlantıları ve operasyon durumları.
                <span th:replace="~{fragments/erp-ops :: tip('', 'İş emirlerini kaynak plaka veya blok stoklarına bağlayarak üretim fire ve verimlilik analizini otomatik yapabilirsiniz.')}"></span>
            </p>
        </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="deptFilter === '' ? 'erp-summary-card--active ring-2 ring-slate-900' : ''"
                @click="setDeptFilter('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm Departmanlar</div>
            <div class="text-lg font-black text-slate-900 mt-1 flex items-center gap-1.5">
                <i data-lucide="layers" class="w-4 h-4 text-slate-500"></i>
                <span>Tüm Siparişler</span>
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="deptFilter === 'FACTORY' ? 'erp-summary-card--active ring-2 ring-blue-500' : ''"
                @click="setDeptFilter('FACTORY')">
            <div class="text-[11px] uppercase tracking-wide text-blue-600 font-semibold flex items-center gap-1">
                <i data-lucide="factory" class="w-3.5 h-3.5"></i> Fabrika İş Emirleri
            </div>
            <div class="text-lg font-black text-blue-700 mt-1">Blok &amp; Plaka Kesim</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="deptFilter === 'WORKSHOP' ? 'erp-summary-card--active ring-2 ring-purple-500' : ''"
                @click="setDeptFilter('WORKSHOP')">
            <div class="text-[11px] uppercase tracking-wide text-purple-600 font-semibold flex items-center gap-1">
                <i data-lucide="hammer" class="w-3.5 h-3.5"></i> Atölye İş Emirleri
            </div>
            <div class="text-lg font-black text-purple-700 mt-1">Ebatlama &amp; Özel İşçilik</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="deptFilter === 'SITE' ? 'erp-summary-card--active ring-2 ring-cyan-500' : ''"
                @click="setDeptFilter('SITE')">
            <div class="text-[11px] uppercase tracking-wide text-cyan-600 font-semibold flex items-center gap-1">
                <i data-lucide="building-2" class="w-3.5 h-3.5"></i> Şantiye Montaj
            </div>
            <div class="text-lg font-black text-cyan-700 mt-1">Mahal Döşeme Planı</div>
        </button>
    </div>

    <!-- Operational Filter Chips -->
    <div class="erp-yard-filters">
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('')">Tüm Durumlar</button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'DRAFT' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('DRAFT')">Taslak</button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'IN_PRODUCTION' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('IN_PRODUCTION')">
            <i data-lucide="play" class="w-3.5 h-3.5 inline mr-1 text-blue-600"></i>
            Üretimde
        </button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'READY_FOR_SHIPMENT' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('READY_FOR_SHIPMENT')">
            <i data-lucide="package-check" class="w-3.5 h-3.5 inline mr-1 text-amber-600"></i>
            Sevke Hazır
        </button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'COMPLETED' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('COMPLETED')">
            <i data-lucide="check" class="w-3.5 h-3.5 inline mr-1 text-emerald-600"></i>
            Tamamlandı
        </button>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <a th:href="@{/work-orders/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni İş Emri Oluştur</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('İş emri no, müşteri, taş veya sorumlu...', 'order-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('workorders-table', 'is-emirleri')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('workorders-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let ordersTable;
        document.addEventListener("DOMContentLoaded", () => {
            ordersTable = new Tabulator("#workorders-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50, 100],
                ajaxURL: "/work-orders/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "order-search-input", function () {
                        return window.ordersPageState ? window.ordersPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("workorders-table", response);
                },
                placeholder: "Kriterlere uygun iş emri kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "İş Emri No",
                        field: "orderNo",
                        width: 170,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/work-orders/${row.id}" class="font-mono font-bold text-indigo-700 hover:text-indigo-900 underline flex items-center gap-1.5">
                                <i data-lucide="clipboard-list" class="w-3.5 h-3.5 text-indigo-600 inline"></i>
                                <span>${gridText(cell.getValue())}</span>
                            </a>`;
                        }
                    },
                    {
                        title: "Departman",
                        field: "departmentLabel",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-md text-xs font-semibold bg-slate-100 text-slate-800 border border-slate-200">
                                ${gridText(cell.getValue())}
                            </span>`;
                        }
                    },
                    {
                        title: "Müşteri",
                        field: "customerName",
                        minWidth: 180,
                        formatter: function (cell) {
                            return `<strong class="text-slate-900">${gridText(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Taş Türü",
                        field: "stoneType",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="font-medium text-slate-700">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Miktar",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<strong class="font-mono text-slate-900">${gridText(row.quantity)} ${gridText(row.unit)}</strong>`;
                        },
                        width: 130
                    },
                    {
                        title: "Termin Tarihi",
                        field: "targetDeliveryDate",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="text-slate-600">${gridText(cell.getValue()) || '—'}</span>`;
                        }
                    },
                    {
                        title: "Sorumlu",
                        field: "responsiblePerson",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="text-slate-600 text-xs">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 140,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            let cls = "bg-slate-100 text-slate-800";
                            if (row.status === "IN_PRODUCTION") cls = "bg-blue-100 text-blue-800";
                            else if (row.status === "READY_FOR_SHIPMENT") cls = "bg-amber-100 text-amber-800";
                            else if (row.status === "COMPLETED") cls = "bg-emerald-100 text-emerald-800";
                            else if (row.status === "CANCELLED") cls = "bg-rose-100 text-rose-800";
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${cls}">● ${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 100,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return gridActionsHtml([
                                {icon: 'eye', label: 'Detay', href: '/work-orders/' + row.id}
                            ]);
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(ordersTable);
            bindGridSearch(ordersTable, "order-search-input");
            ordersTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadOrdersGrid() {
            if (ordersTable) ordersTable.setData();
        }
        window.reloadOrdersGrid = reloadOrdersGrid;
    </script>
</th:block>
</body>
</html>
