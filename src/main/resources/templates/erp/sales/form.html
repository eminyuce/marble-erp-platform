<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Yeni Satış Siparişi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Satışlar', @{/sales}, 'Yeni kayıt')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Yeni satış siparişi',
        'Müşteri, teslim tarihi ve sipariş notlarıyla yeni bir satış kaydı oluşturun.',
        '',
        @{/sales})}"></div>

    <div class="erp-form-card">
        <form th:action="@{/sales/create}" method="post" class="erp-form">
            <div class="erp-form-body">
                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Sipariş', 'Numara ve müşteri')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="orderNo">Sipariş no <span class="req">*</span></label>
                            <input id="orderNo" type="text" name="orderNo" th:value="${record != null ? record.orderNo : generatedOrderNo}" required
                                   class="erp-form-input" style="font-family:var(--font-mono);"
                                   placeholder="SAT-2026-00001">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="customerId">Müşteri <span class="req">*</span></label>
                            <select id="customerId" name="customerId" required class="erp-form-select">
                                <option value="" disabled th:selected="${record == null}">Müşteri seçin</option>
                                <option th:each="c : ${customers}" th:value="${c.id}"
                                        th:selected="${record != null and record.customer != null and record.customer.id == c.id}"
                                        th:text="${c.companyName + ' (' + c.customerType.label + ')'}">Müşteri
                                </option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Teslimat', 'Planlanan teslim ve serbest not')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="deliveryDate">Teslim tarihi</label>
                            <input id="deliveryDate" type="date" name="deliveryDate" class="erp-form-input"
                                   th:value="${record != null ? record.deliveryDate : ''}">
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="notes">Notlar</label>
                            <textarea id="notes" name="notes" class="erp-form-textarea"
                                      th:text="${record != null ? record.notes : ''}"
                                      placeholder="Sipariş detayları, teslimat adresi..."></textarea>
                        </div>
                    </div>
                </section>

                <th:block th:if="${isEdit and record != null}">
                    <div th:replace="~{fragments/audit :: auditInfo(${record?.createdDate}, ${record?.updatedDate}, ${record?.addUserId}, ${record?.updateUserId})}"></div>
                </th:block>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/sales})}"></div>
        </form>
    </div>
</div>
</body>
</html>
