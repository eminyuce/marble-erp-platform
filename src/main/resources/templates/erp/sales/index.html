<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Satış Siparişleri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Satışlar')}"></div>
            <h2 class="admin-page-title">Satış Siparişleri</h2>
            <p class="erp-list-lead">Müşteri yönetimi, satış siparişleri, faturalama ve alacak takibi.</p>
        </div>
    </div>

    <div class="erp-toolbar">
        <a th:href="@{/sales/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni sipariş</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Sipariş no, müşteri adı', 'sales-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('sales-table', 'satislar')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('sales-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let salesTable;
        document.addEventListener("DOMContentLoaded", () => {
            salesTable = new Tabulator("#sales-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/sales/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "sales-search-input");
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("sales-table", response);
                },
                placeholder: "Satış siparişi bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Sipariş No",
                        field: "orderNo",
                        width: 160,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/sales/${row.id}" class="font-mono font-bold text-amber-900 hover:text-amber-700 underline">${gridText(cell.getValue())}</a>`;
                        }
                    },
                    {
                        title: "Müşteri",
                        field: "customerName",
                        minWidth: 200,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                        <a href="/sales/${row.id}" class="font-bold text-slate-900 hover:text-amber-700 underline">${gridText(row.customerName)}</a>
                        <div class="text-xs text-slate-500">${gridText(row.customerType)}</div>
                    </div>`;
                        }
                    },
                    {
                        title: "Sipariş Tarihi",
                        field: "orderDate",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="text-sm">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Toplam Tutar",
                        field: "totalAmount",
                        width: 150,
                        formatter: function (cell) {
                            return `<strong>${gridMoney(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Ödenen",
                        field: "paidAmount",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="text-sm text-slate-600">${gridMoney(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 130,
                        formatter: function (cell) {
                            const status = cell.getRow().getData().status;
                            const colors = {
                                'DRAFT': 'bg-slate-100 text-slate-700',
                                'CONFIRMED': 'bg-blue-100 text-blue-800',
                                'SHIPPED': 'bg-amber-100 text-amber-800',
                                'DELIVERED': 'bg-emerald-100 text-emerald-800',
                                'INVOICED': 'bg-green-100 text-green-800',
                                'CANCELLED': 'bg-rose-100 text-rose-800'
                            };
                            const c = colors[status] || 'bg-slate-100 text-slate-700';
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${c}">● ${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return gridActionsHtml([
                                {icon: 'eye', label: 'Detay', href: '/sales/' + row.id},
                                {icon: 'edit-3', label: 'Düzenle', href: '/sales/' + row.id}
                            ]);
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(salesTable);
            bindGridSearch(salesTable, "sales-search-input");
            salesTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadSalesGrid() {
            if (salesTable) salesTable.replaceData();
        }
    </script>
</th:block>
</body>
</html>
