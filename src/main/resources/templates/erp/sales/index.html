<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Satış Siparişleri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Satışlar')}"></div>
            <h2 class="admin-page-title">Satış Siparişleri</h2>
            <p class="erp-list-lead">Müşteri yönetimi, satış siparişleri, faturalama ve alacak takibi.</p>
        </div>
        <div class="erp-list-header-actions">
            <div x-data="{ exportOpen: false }" class="relative">
                <button @click="exportOpen = !exportOpen" type="button" class="erp-btn-secondary">
                    <i data-lucide="download"></i>
                    <span>Dışa Aktar</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div x-show="exportOpen" @click.outside="exportOpen = false" x-transition
                     class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50" style="display:none;">
                    <button @click="downloadTable(salesTable, 'satislar', 'csv'); exportOpen = false"
                            type="button" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                        <span><strong>CSV</strong> <span class="text-slate-400">(.csv)</span></span>
                    </button>
                    <button @click="downloadTable(salesTable, 'satislar', 'xlsx'); exportOpen = false"
                            type="button" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                        <span><strong>Excel</strong> <span class="text-slate-400">(.xlsx)</span></span>
                    </button>
                </div>
            </div>
            <button type="button" hx-get="/sales/create" hx-target="#modal-container" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni sipariş</span>
            </button>
        </div>
    </div>

    <div th:replace="~{fragments/help-accordion :: help(items=${ {'Bu sayfada satış siparişlerini oluşturur ve takip edersiniz.', 'Sipariş no veya müşteri adına göre arama yapabilirsiniz.', '<strong>Yeni sipariş</strong> butonu ile satış siparişi oluşturabilirsiniz.', 'Sipariş detay sayfasından faturalama ve ödeme takibi yapabilirsiniz.', '<strong>CSV İndir</strong> butonu ile tablo verilerini dışa aktarabilirsiniz.'} })}"></div>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Sipariş no, müşteri adı', 'sales-search-input')}"></div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('sales-table')}"></div>
</div>

<th:block layout:fragment="scripts">
<script>
let salesTable;
document.addEventListener("DOMContentLoaded", () => {
    salesTable = new Tabulator("#sales-table", {
        layout: "fitColumns",
        pagination: true,
        paginationMode: "remote",
        paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
        paginationSizeSelector: [5, 10, 25, 50],
        ajaxURL: "/sales/api/data",
        ajaxConfig: { method: "GET", headers: { "Accept": "application/json" } },
        ajaxURLGenerator: function(url, config, params) {
            const searchVal = document.getElementById("sales-search-input")?.value || "";
            return `${url}?page=${params.page}&size=${params.size}&search=${encodeURIComponent(searchVal)}`;
        },
        ajaxResponse: function(url, params, response) {
            camelizeTabulatorRows(response);
            return applyTabulatorTotal("sales-table", response);
        },
        columns: [
            {
                title: "Sipariş No",
                field: "orderNo",
                width: 160,
                formatter: function(cell) {
                    return `<span class="font-mono font-bold text-amber-900">${cell.getValue()}</span>`;
                }
            },
            {
                title: "Müşteri",
                field: "customerName",
                minWidth: 200,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<div>
                        <a href="/sales/${row.id}" class="font-bold text-slate-900 hover:text-amber-700 underline">${row.customerName}</a>
                        <div class="text-xs text-slate-500">${row.customerType}</div>
                    </div>`;
                }
            },
            {
                title: "Sipariş Tarihi",
                field: "orderDate",
                width: 130,
                formatter: function(cell) {
                    return `<span class="text-sm">${cell.getValue() || '—'}</span>`;
                }
            },
            {
                title: "Toplam Tutar",
                field: "totalAmount",
                width: 150,
                formatter: function(cell) {
                    return `<strong>${Number(cell.getValue()).toLocaleString('tr-TR')} TL</strong>`;
                }
            },
            {
                title: "Ödenen",
                field: "paidAmount",
                width: 130,
                formatter: function(cell) {
                    return `<span class="text-sm text-slate-600">${Number(cell.getValue()).toLocaleString('tr-TR')} TL</span>`;
                }
            },
            {
                title: "Durum",
                field: "statusLabel",
                width: 130,
                formatter: function(cell) {
                    const status = cell.getRow().getData().status;
                    const colors = {
                        'DRAFT': 'bg-slate-100 text-slate-700',
                        'CONFIRMED': 'bg-blue-100 text-blue-800',
                        'SHIPPED': 'bg-amber-100 text-amber-800',
                        'DELIVERED': 'bg-emerald-100 text-emerald-800',
                        'INVOICED': 'bg-green-100 text-green-800',
                        'CANCELLED': 'bg-rose-100 text-rose-800'
                    };
                    const c = colors[status] || 'bg-slate-100 text-slate-700';
                    return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${c}">● ${cell.getValue()}</span>`;
                }
            },
            {
                title: "İşlemler",
                width: 120,
                headerSort: false,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return gridActionsHtml([
                        { icon: 'eye', label: 'Detay', href: '/sales/' + row.id },
                        { icon: 'edit-3', label: 'Düzenle', href: '/sales/' + row.id }
                    ]);
                }
            }
        ]
    });

    attachTabulatorPagingAnimation(salesTable);
    bindGridSearch(salesTable, "sales-search-input");
    salesTable.on("renderComplete", () => {
        if (window.lucide) window.lucide.createIcons();
    });
});

function reloadSalesGrid() {
    if (salesTable) salesTable.replaceData();
}
</script>
</th:block>
</body>
</html>
