<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Atölye | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-6">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Atölye')}"></div>
            <h2 class="admin-page-title">Atölye</h2>
            <p class="erp-list-lead">Malzeme kabulü, atölye iş emri, köprü/kenar/pah makineleri ve manuel ince pah.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
            <h3 class="font-bold text-slate-900">Malzeme kabulü</h3>
            <form th:action="@{/workshop/receipts}" method="post" class="space-y-2">
                <select name="source" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    <option th:each="s : ${receiptSources}" th:value="${s.name()}" th:text="${s.label}"></option>
                </select>
                <select name="supplierId" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    <option value="">Tedarikçi (dış fabrika)</option>
                    <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.companyName}"></option>
                </select>
                <input type="text" name="stoneType" required placeholder="Taş cinsi" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" step="0.01" name="quantity" placeholder="Miktar" class="px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    <input type="number" step="0.01" name="areaM2" placeholder="m²" class="px-3 py-2 text-sm border border-slate-200 rounded-lg">
                    <input type="number" step="0.01" name="purchaseCost" placeholder="Alış maliyeti" class="px-3 py-2 text-sm border border-slate-200 rounded-lg">
                </div>
                <input type="date" name="receivedAt" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                <input type="text" name="notes" placeholder="Not" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg">
                <button type="submit" class="w-full min-h-11 py-2.5 bg-[#2b6cb0] text-white text-sm font-semibold rounded-lg">Kabul kaydet</button>
            </form>
            <div class="max-h-36 overflow-y-auto text-xs space-y-1">
                <div th:each="r : ${receipts}" class="flex justify-between border-b border-slate-100 py-1">
                    <span th:text="${r.receiptNo + ' · ' + (r.source != null ? r.source.label : '')}">Kabul</span>
                    <span th:text="${r.areaM2 + ' m²'}">0 m²</span>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3">
            <h3 class="font-bold text-slate-900">Makine parkı</h3>
            <ul class="text-sm space-y-1">
                <li th:each="m : ${workshopMachines}"
                    th:text="${m.name + ' — ' + (m.machineType != null ? m.machineType.label : '')}">Makine</li>
            </ul>
            <p th:if="${#lists.isEmpty(workshopMachines)}" class="text-xs text-slate-400">Kayıtlı atölye makinesi yok.</p>
        </div>
    </div>

    <div class="erp-toolbar">
        <a th:href="@{/workshop/create}" class="erp-btn-primary">
            <i data-lucide="scissors"></i>
            <span>Yeni atölye iş emri</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('İş emri no veya şantiye adı', 'workshop-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('workshop-table', 'atelye_is_emirleri')}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('workshop-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let workshopTable;
        document.addEventListener("DOMContentLoaded", () => {
            workshopTable = new Tabulator("#workshop-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50],
                ajaxURL: "/workshop/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "workshop-search-input");
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("workshop-table", response);
                },
                placeholder: "Atölye iş emri kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Atölye İş Emri No",
                        field: "cutOrderNo",
                        width: 170,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/workshop/${row.id}" class="font-mono font-bold text-amber-900 hover:text-amber-700 underline">${gridText(cell.getValue())}</a>`;
                        }
                    },
                    {title: "Şantiye / Müşteri", field: "projectName", minWidth: 150},
                    {title: "Amaç", field: "purposeLabel", minWidth: 140},
                    {title: "Hedef Mahal", field: "locationName", minWidth: 130},
                    {title: "Makine", field: "machineName", width: 150},
                    {title: "Operatör", field: "operatorName", width: 130},
                    {
                        title: "Üretilen Mamul",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<strong>${gridText(row.itemCount)} Adet</strong> (${gridArea(row.totalAreaM2)})`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "status",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return erpStatusBadge(row.status, row.statusLabel);
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return gridActionsHtml([
                                {icon: 'eye', label: 'Detay', href: '/workshop/' + row.id},
                                {icon: 'edit-3', label: 'Düzenle', href: '/workshop/' + row.id + '/edit'}
                            ]);
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(workshopTable);
            bindGridSearch(workshopTable, "workshop-search-input");
            workshopTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadWorkshopGrid() {
            if (workshopTable) workshopTable.replaceData();
        }
    </script>
</th:block>
</body>
</html>
