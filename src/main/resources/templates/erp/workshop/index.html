<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Atölye &amp; Ebatlama İmalatı | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-5">
        <div>
            <div class="flex items-center gap-2">
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Atölye &amp; Ebatlama İmalatı</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-800">Modül 3</span>
            </div>
            <p class="text-sm text-slate-500 mt-1">Köprü kesme, pah/profil, projeye bağlı kesim planı, yarı mamul/mamul dönüşümü ve ebatlama fireleri.</p>
        </div>
        <div class="flex items-center gap-2">
            <button hx-get="/workshop/create" hx-target="#modal-container"
                    class="px-4 py-2 bg-amber-700 hover:bg-amber-600 text-white text-xs font-semibold rounded-lg shadow-sm flex items-center gap-1.5 transition cursor-pointer">
                <i data-lucide="scissors" class="w-4 h-4"></i>
                <span>Yeni Ebatlama Emri</span>
            </button>
        </div>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="relative flex-1 max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
                <input type="text" id="workshop-search-input"
                       class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition"
                       placeholder="Kesim iş emri no veya proje adı ile ara...">
            </div>
            <div class="text-xs text-slate-400">Tabulator 6 Grid</div>
        </div>

        <div id="workshop-table"></div>
    </div>

</div>

<th:block layout:fragment="scripts">
<script>
let workshopTable;
document.addEventListener("DOMContentLoaded", () => {
    workshopTable = new Tabulator("#workshop-table", {
        layout: "fitColumns",
        pagination: true,
        paginationMode: "remote",
        paginationSize: 10,
        ajaxURL: "/workshop/api/data",
        ajaxConfig: { method: "GET", headers: { "Accept": "application/json" } },
        ajaxURLGenerator: function(url, config, params) {
            const searchVal = document.getElementById("workshop-search-input")?.value || "";
            return `${url}?page=${params.page}&size=${params.size}&search=${encodeURIComponent(searchVal)}`;
        },
        columns: [
            {
                title: "Kesim Emri No",
                field: "cutOrderNo",
                width: 170,
                formatter: function(cell) {
                    return `<span class="font-mono font-bold text-amber-900">${cell.getValue()}</span>`;
                }
            },
            { title: "Proje / Müşteri", field: "projectName", minWidth: 150 },
            { title: "Hedef Mahal", field: "locationName", minWidth: 130 },
            { title: "Makine", field: "machineName", width: 150 },
            { title: "Operatör", field: "operatorName", width: 130 },
            {
                title: "Üretilen Mamul",
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<strong>${row.itemCount} Adet</strong> (${Number(row.totalAreaM2).toFixed(2)} m²)`;
                }
            },
            {
                title: "Durum",
                field: "status",
                width: 110,
                formatter: function(cell) {
                    return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">● ${cell.getValue()}</span>`;
                }
            },
            {
                title: "Soy Ağacı",
                width: 100,
                headerSort: false,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<a href="/genealogy?code=${row.cutOrderNo}" class="p-1.5 text-slate-600 hover:text-amber-700 inline-block" title="Soy Ağacı"><i data-lucide="git-branch" class="w-4 h-4"></i></a>`;
                }
            }
        ]
    });

    workshopTable.on("renderComplete", () => {
        if (window.lucide) window.lucide.createIcons();
    });

    const searchInput = document.getElementById("workshop-search-input");
    if (searchInput) {
        let timer;
        searchInput.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(() => workshopTable.replaceData(), 300);
        });
    }
});

function reloadWorkshopGrid() {
    if (workshopTable) workshopTable.replaceData();
}
</script>
</th:block>
</body>
</html>
