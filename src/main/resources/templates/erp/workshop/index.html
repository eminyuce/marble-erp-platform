<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Atölye &amp; Ebatlama İmalatı | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Atölye')}"></div>
            <h2 class="admin-page-title">Atölye</h2>
            <p class="erp-list-lead">Köprü kesme, pah/profil, projeye bağlı kesim planı ve ebatlama fireleri.</p>
        </div>
        <div class="erp-list-header-actions">
            <button type="button" onclick="downloadTableCsv(workshopTable, 'kesim_emirleri.csv')" class="erp-btn-secondary">
                <i data-lucide="download"></i>
                <span>CSV İndir</span>
            </button>
            <button type="button" hx-get="/workshop/create" hx-target="#modal-container" class="erp-btn-primary">
                <i data-lucide="scissors"></i>
                <span>Yeni ebatlama emri</span>
            </button>
        </div>
    </div>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Kesim iş emri no veya proje adı', 'workshop-search-input')}"></div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('workshop-table')}"></div>
</div>

<th:block layout:fragment="scripts">
<script>
let workshopTable;
document.addEventListener("DOMContentLoaded", () => {
    workshopTable = new Tabulator("#workshop-table", {
        layout: "fitColumns",
        pagination: true,
        paginationMode: "remote",
        paginationSize: 10,
        ajaxURL: "/workshop/api/data",
        ajaxConfig: { method: "GET", headers: { "Accept": "application/json" } },
        ajaxURLGenerator: function(url, config, params) {
            const searchVal = document.getElementById("workshop-search-input")?.value || "";
            return `${url}?page=${params.page}&size=${params.size}&search=${encodeURIComponent(searchVal)}`;
        },
        ajaxResponse: function(url, params, response) {
            return applyTabulatorTotal("workshop-table", response);
        },
        columns: [
            {
                title: "Kesim Emri No",
                field: "cutOrderNo",
                width: 170,
                formatter: function(cell) {
                    return `<span class="font-mono font-bold text-amber-900">${cell.getValue()}</span>`;
                }
            },
            { title: "Proje / Müşteri", field: "projectName", minWidth: 150 },
            { title: "Hedef Mahal", field: "locationName", minWidth: 130 },
            { title: "Makine", field: "machineName", width: 150 },
            { title: "Operatör", field: "operatorName", width: 130 },
            {
                title: "Üretilen Mamul",
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<strong>${row.itemCount} Adet</strong> (${Number(row.totalAreaM2).toFixed(2)} m²)`;
                }
            },
            {
                title: "Durum",
                field: "status",
                width: 110,
                formatter: function(cell) {
                    return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">● ${cell.getValue()}</span>`;
                }
            },
            {
                title: "İşlemler",
                width: 120,
                headerSort: false,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return gridActionsHtml([
                        { icon: 'git-branch', label: 'Soy Ağacı', href: '/genealogy?code=' + row.cutOrderNo }
                    ]);
                }
            }
        ]
    });

    attachTabulatorPagingAnimation(workshopTable);
    bindGridSearch(workshopTable, "workshop-search-input");
    workshopTable.on("renderComplete", () => {
        if (window.lucide) window.lucide.createIcons();
    });
});

function reloadWorkshopGrid() {
    if (workshopTable) workshopTable.replaceData();
}
</script>
</th:block>
</body>
</html>
