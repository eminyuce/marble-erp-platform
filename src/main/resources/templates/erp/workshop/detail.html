<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${order.cutOrderNo + ' | Özerler Mermer ERP'}">Kesim Emri Detay</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-5">
        <div>
            <div class="flex items-start sm:items-center gap-2 flex-wrap">
                <a th:href="@{/workshop}" class="p-2 -ml-2 rounded text-slate-400 hover:text-slate-600 hover:bg-slate-100"
                   aria-label="Atölyeye dön">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight min-w-0 break-words font-mono"
                    th:text="${order.cutOrderNo}">CUT-2026-001</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800"
                      th:text="${order.status}">COMPLETED</span>
            </div>
            <p class="text-sm text-slate-500 mt-1">
                <span th:text="${order.machineName}">Köprü-01</span>
                <span th:if="${order.operatorName != null}"> · <span th:text="'Operatör: ' + ${order.operatorName}">Operatör</span></span>
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <a th:href="@{'/workshop/' + ${order.id} + '/edit'}" class="erp-btn-secondary">
                <i data-lucide="edit-3"></i>
                <span>Düzenle</span>
            </a>
            <a th:href="@{/genealogy(code=${order.cutOrderNo})}" class="erp-btn-secondary">
                <i data-lucide="git-branch"></i>
                <span>Soy Ağacı</span>
            </a>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div class="border-b border-slate-100 pb-3">
            <h3 class="font-bold text-slate-900">Emir bilgisi</h3>
        </div>
        <dl class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
            <div>
                <dt class="text-xs font-semibold text-slate-500">Proje</dt>
                <dd>
                    <a th:if="${order.project != null}" th:href="@{'/projects/' + ${order.project.id}}"
                       class="font-semibold text-amber-900 hover:text-amber-700 underline"
                       th:text="${order.project.name}">Proje</a>
                    <span th:unless="${order.project != null}">—</span>
                </dd>
            </div>
            <div>
                <dt class="text-xs font-semibold text-slate-500">Hedef mahal</dt>
                <dd th:text="${order.location != null ? order.location.locationName : '—'}">Lobi</dd>
            </div>
            <div>
                <dt class="text-xs font-semibold text-slate-500">Planlanan başlangıç</dt>
                <dd th:text="${order.plannedStart != null ? #temporals.format(order.plannedStart, 'dd.MM.yyyy') : '—'}">—</dd>
            </div>
            <div th:if="${!#strings.isEmpty(order.notes)}">
                <dt class="text-xs font-semibold text-slate-500">Notlar</dt>
                <dd th:text="${order.notes}">Not</dd>
            </div>
        </dl>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
                <h3 class="font-bold text-slate-900">Üretilen mamuller</h3>
                <p class="text-xs text-slate-500">Bu kesim emrinden çıkan parçalar</p>
            </div>
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200"
                  th:text="${#lists.size(order.items) + ' parça'}">0 parça</span>
        </div>

        <div th:if="${order.items.isEmpty()}" class="text-center text-sm text-slate-400 py-6">
            <i data-lucide="package-open" class="w-8 h-8 mx-auto mb-2"></i>
            Bu emre bağlı mamul kaydı yok.
        </div>

        <div th:unless="${order.items.isEmpty()}" class="space-y-2">
            <div th:each="item : ${order.items}"
                 class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="min-w-0">
                    <strong class="font-mono text-sm font-bold text-slate-800" th:text="${item.itemCode}">ITM-001</strong>
                    <div class="text-[11px] text-slate-500">
                        <span th:if="${item.sourceSlab != null}" th:text="'Kaynak: ' + ${item.sourceSlab.slabCode}">Kaynak</span>
                        ·
                        <span th:text="${item.widthCm + ' × ' + item.lengthCm + ' × ' + item.thicknessCm + ' cm'}">60 × 120 × 2 cm</span>
                        ·
                        <span th:text="${#numbers.formatDecimal(item.areaM2, 1, 2) + ' m²'}">0.72 m²</span>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-2 py-0.5 rounded font-semibold bg-slate-100 text-slate-700"
                          th:text="${item.status}">READY</span>
                    <span th:if="${!#strings.isEmpty(item.edgeFinish)}" th:text="${item.edgeFinish}">PAHLI</span>
                    <span class="font-bold text-slate-900"
                          th:text="${#numbers.formatDecimal(item.unitCost, 1, 'POINT', 2, 'COMMA') + ' TL'}">0 TL</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <div th:replace="~{fragments/audit :: auditInfo(${order?.createdDate}, ${order?.updatedDate}, ${order?.addUserId}, ${order?.updateUserId})}"></div>
    </div>
</div>
</body>
</html>
