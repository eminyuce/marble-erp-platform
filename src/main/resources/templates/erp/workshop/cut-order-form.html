<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${((isEdit ?: false) ? 'Kesim Emri Düzenle' : 'Yeni Ebatlama Emri') + ' | Özerler Mermer ERP'}">
        Ebatlama Emri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Atölye', @{/workshop}, ${(isEdit ?: false) ? 'Düzenle' : 'Yeni kayıt'})}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        ${(isEdit ?: false) ? 'Kesim emrini düzenle' : 'Yeni atölye kesim ve ebatlama emri'},
        ${(isEdit ?: false) ? 'Makine, operatör, proje ve kenar bilgilerini güncelleyin. Kaynak plaka ve kesim ölçüleri değişmez.' : 'Ambardaki plakayı hedef ölçü ve projeye göre ebatlayın.'},
        ${(isEdit ?: false) ? 'Emir #' + record?.cutOrderNo : ''},
        @{/workshop})}"></div>

    <div class="erp-form-card">
        <form th:action="${(isEdit ?: false)} ? @{/workshop/{id}/edit(id=${record.id})} : @{/workshop/create}"
              method="post" class="erp-form">
            <div class="erp-form-body">
                <div th:if="${errorMessage}" class="erp-form-errors" role="alert" th:text="${errorMessage}">Hata</div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kaynak ve hedef', 'Kesilecek plaka ve mahal')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field erp-form-field--full" th:if="${!(isEdit ?: false)}">
                            <label class="erp-form-label" for="slabId">Kesilecek plaka (ambar) <span
                                    class="req">*</span></label>
                            <select id="slabId" name="slabId" required class="erp-form-select">
                                <option value="" disabled selected>Plaka seçin</option>
                                <option th:each="s : ${availableSlabs}" th:value="${s.id}"
                                        th:text="${s.slabCode + ' (' + (s.surfaceFinish != null ? s.surfaceFinish.label : '') + ', ' + (s.qualityGrade != null ? s.qualityGrade.label : '') + ', ' + s.surfaceAreaM2 + ' m², ' + s.costPerM2 + ' TL/m²)'}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="projectId">Hedef proje</label>
                            <select id="projectId" name="projectId" class="erp-form-select">
                                <option value=""
                                        th:selected="${record == null or record.project == null}">Proje seçilmedi</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"
                                        th:selected="${isEdit and record != null and record.project != null and record.project.id == p.id}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="targetLocationDesc">Hedef mahal / konum</label>
                            <input id="targetLocationDesc" type="text" name="targetLocationDesc"
                                   class="erp-form-input" placeholder="Lobi duvar kaplama A blok"
                                   th:value="${isEdit and record != null and !#lists.isEmpty(record.items) ? record.items[0].targetLocation : ''}">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section" th:if="${!(isEdit ?: false)}">
                    <div th:replace="~{fragments/form-page :: section('Kesim ölçüleri', 'Adet ve hedef en / boy')}"></div>
                    <div class="erp-form-grid--3">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="piecesCount">Adet <span class="req">*</span></label>
                            <input id="piecesCount" type="number" name="piecesCount" value="4" min="1" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="targetWidthCm">En (cm) <span class="req">*</span></label>
                            <input id="targetWidthCm" type="number" name="targetWidthCm" value="80" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="targetLengthCm">Boy (cm) <span
                                    class="req">*</span></label>
                            <input id="targetLengthCm" type="number" name="targetLengthCm" value="120" required
                                   class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Operasyon', 'Makine, operatör ve kenar işlemi')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="machineName">Makine (köprü kesme / CNC) <span
                                    class="req">*</span></label>
                            <input id="machineName" type="text" name="machineName" required
                                   class="erp-form-input" placeholder="Köprü Kesme - CNC 01"
                                   th:value="${isEdit and record != null ? record.machineName : ''}">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="operatorName">Operatör <span class="req">*</span></label>
                            <input id="operatorName" type="text" name="operatorName" required
                                   class="erp-form-input" placeholder="Operatör adı"
                                   th:value="${isEdit and record != null ? record.operatorName : ''}">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="edgeFinish">Kenar işlemi</label>
                            <input id="edgeFinish" type="text" name="edgeFinish" class="erp-form-input"
                                   placeholder="Pahlı cilalı"
                                   th:value="${isEdit and record != null and !#lists.isEmpty(record.items) ? record.items[0].edgeFinish : ''}">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="notes">Notlar</label>
                            <input id="notes" type="text" name="notes" class="erp-form-input"
                                   placeholder="Özel kesim notu"
                                   th:value="${isEdit and record != null ? record.notes : ''}">
                        </div>
                    </div>
                </section>

                <div th:if="${isEdit and record != null}"
                     th:replace="~{fragments/audit :: auditInfo(${record?.createdDate}, ${record?.updatedDate}, ${record?.addUserId}, ${record?.updateUserId})}"></div>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/workshop})}"></div>
        </form>
    </div>
</div>
</body>
</html>
