<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Etiket — ' + ${slab.slabCode}">Plaka Etiketi</title>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* ── Label Card ── */
        .label {
            width: 10cm;
            min-height: 7cm;
            background: #fff;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            padding: 8mm;
            display: flex;
            flex-direction: column;
            gap: 3mm;
        }

        /* ── Header ── */
        .label-header {
            text-align: center;
            border-bottom: 1.5px solid #1a1a1a;
            padding-bottom: 2mm;
        }

        .label-header .company {
            font-size: 11pt;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ── Body: two-column layout ── */
        .label-body {
            display: flex;
            gap: 4mm;
            flex: 1;
        }

        .label-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5mm;
        }

        .label-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1mm;
        }

        .label-qr img {
            width: 28mm;
            height: 28mm;
            image-rendering: pixelated;
        }

        .label-qr .qr-hint {
            font-size: 6pt;
            color: #666;
            text-align: center;
        }

        /* ── Slab Code (prominent) ── */
        .slab-code {
            font-size: 14pt;
            font-weight: 800;
            font-family: 'Consolas', 'Courier New', monospace;
            letter-spacing: 1px;
            color: #1a1a1a;
            border: 1.5px solid #1a1a1a;
            border-radius: 3px;
            padding: 1mm 2mm;
            text-align: center;
            background: #f9f9f3;
        }

        /* ── Detail rows ── */
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 7.5pt;
            line-height: 1.4;
            border-bottom: 0.5px dotted #ccc;
            padding-bottom: 0.5mm;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #555;
            font-weight: 600;
        }

        .detail-value {
            font-weight: 700;
            color: #1a1a1a;
            text-align: right;
        }

        /* ── Footer ── */
        .label-footer {
            border-top: 1px solid #ccc;
            padding-top: 1mm;
            text-align: center;
            font-size: 6pt;
            color: #888;
        }

        /* ── Print Overrides ── */
        @media print {
            @page {
                size: 10cm 7cm;
                margin: 0;
            }

            body {
                background: #fff;
                padding: 0;
                display: block;
            }

            .label {
                border: none;
                border-radius: 0;
                width: 100%;
                height: 100%;
                padding: 5mm;
            }

            .no-print {
                display: none !important;
            }
        }

        /* ── Screen-only print button ── */
        .print-actions {
            position: fixed;
            top: 12px;
            right: 12px;
        }

        .print-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .print-btn:hover {
            background: #333;
        }
    </style>
</head>
<body>

<!-- Screen-only print button -->
<div class="print-actions no-print">
    <button class="print-btn" onclick="window.print()">🖨 Yazdır</button>
</div>

<div class="label">
    <!-- Header -->
    <div class="label-header">
        <div class="company">ÖZERLER MERMER A.Ş.</div>
    </div>

    <!-- Slab Code -->
    <div class="slab-code" th:text="${slab.slabCode}">SLB-00001</div>

    <!-- Body -->
    <div class="label-body">
        <!-- Info Column -->
        <div class="label-info">
            <div class="detail-row">
                <span class="detail-label">Taş Türü</span>
                <span class="detail-value" th:text="${stoneType}">Burdur Bej</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Ebatlar</span>
                <span class="detail-value"
                      th:text="${slab.thicknessCm} + ' × ' + ${slab.widthCm} + ' × ' + ${slab.lengthCm} + ' cm'">
                    2 × 60 × 240 cm
                </span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Alan</span>
                <span class="detail-value"
                      th:text="${#numbers.formatDecimal(slab.surfaceAreaM2, 1, 2)} + ' m²'">1.44 m²</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Kalite</span>
                <span class="detail-value" th:text="${slab.qualityGrade}">A</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Yüzey</span>
                <span class="detail-value" th:text="${slab.surfaceFinish}">RAW</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Blok Kodu</span>
                <span class="detail-value" th:text="${blockCode}">BLK-001</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Ocak</span>
                <span class="detail-value" th:text="${quarryName}">Ana Ocak</span>
            </div>
        </div>

        <!-- QR Column -->
        <div class="label-qr">
            <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" alt="QR Code"/>
            <span class="qr-hint">Dijital Pasaport</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="label-footer">
        <span th:text="'Özerler Mermer A.Ş. — Plaka Pasaportu — ' + ${slab.slabCode}">Özerler Mermer A.Ş.</span>
    </div>
</div>

</body>
</html>
