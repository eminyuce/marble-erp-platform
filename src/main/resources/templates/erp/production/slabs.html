<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Plaka Ambarı | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Plaka Ambarı')}"></div>
            <h2 class="admin-page-title">Plaka ambarı</h2>
            <p class="erp-list-lead">Ham, cilalı ve honlu plakalar, birim m² maliyetleri ve barkod etiketleri.</p>
        </div>
    </div>

    <div th:replace="~{fragments/help-accordion :: help(items=${ {'Bu sayfada kesim sonucu oluşan ham, cilalı ve honlu mermer plakalarını görüntülersiniz.', 'Plaka kodu veya blok koduna göre arama yapabilirsiniz.', 'İşlemler menüsünden <strong>pasaport belgesi</strong> oluşturabilir, <strong>barkod yazdırabilir</strong> ve <strong>soy ağacını</strong> takip edebilirsiniz.', 'Birim m² maliyetleri, yüzey işlemi ve kalite derecesi bilgilerine erişebilirsiniz.', '<strong>CSV İndir</strong> butonu ile tablo verilerini dışa aktarabilirsiniz.'} })}"></div>

    <div class="erp-toolbar">
        <a th:href="@{/production}" class="erp-btn-secondary">
            <i data-lucide="arrow-left"></i>
            <span>Katrak emirleri</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Plaka kodu veya blok kodu', 'slab-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div x-data="{ exportOpen: false }" class="relative">
                <button @click="exportOpen = !exportOpen" type="button" class="erp-btn-secondary">
                    <i data-lucide="download"></i>
                    <span>Dışa Aktar</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div x-show="exportOpen" @click.outside="exportOpen = false" x-transition
                     class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50" style="display:none;">
                    <button @click="downloadTable(slabsTable, 'plakalar', 'csv'); exportOpen = false"
                            type="button" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                        <span><strong>CSV</strong> <span class="text-slate-400">(.csv)</span></span>
                    </button>
                    <button @click="downloadTable(slabsTable, 'plakalar', 'xlsx'); exportOpen = false"
                            type="button" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                        <span><strong>Excel</strong> <span class="text-slate-400">(.xlsx)</span></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('slabs-table')}"></div>
</div>

<th:block layout:fragment="scripts">
<script>
let slabsTable;
document.addEventListener("DOMContentLoaded", () => {
    slabsTable = new Tabulator("#slabs-table", {
        ...erpGridDefaults(),
        pagination: true,
        paginationMode: "remote",
        paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
        paginationSizeSelector: [5, 10, 25, 50],
        ajaxURL: "/production/api/slabs",
        ajaxConfig: { method: "GET", headers: { "Accept": "application/json" } },
        ajaxURLGenerator: function(url, config, params) {
            const searchVal = document.getElementById("slab-search-input")?.value || "";
            return `${url}?page=${params.page}&size=${params.size}&search=${encodeURIComponent(searchVal)}`;
        },
        ajaxResponse: function(url, params, response) {
            return applyTabulatorTotal("slabs-table", response);
        },
        columns: [
            erpResponsiveCollapseColumn(),
            {
                title: "Plaka Kodu",
                field: "slabCode",
                minWidth: 140,
                width: 170,
                responsive: 0,
                formatter: function(cell) {
                    return `<span class="font-mono font-bold text-amber-900">${cell.getValue()}</span>`;
                }
            },
            {
                title: "Ebatlar (cm)",
                minWidth: 150,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `${row.thicknessCm} cm • ${row.widthCm}x${row.lengthCm} cm`;
                }
            },
            {
                title: "Net Alan",
                field: "surfaceAreaM2",
                width: 120,
                formatter: function(cell) {
                    return `<strong>${Number(cell.getValue()).toFixed(2)} m²</strong>`;
                }
            },
            {
                title: "Yüzey",
                field: "surfaceFinish",
                width: 110,
                formatter: function(cell) {
                    return `<span class="px-2 py-0.5 rounded text-xs bg-slate-100 font-medium">${cell.getValue()}</span>`;
                }
            },
            {
                title: "Kalite",
                field: "qualityGrade",
                width: 90,
                formatter: function(cell) {
                    const val = cell.getValue();
                    const color = val === 'A' ? 'bg-emerald-100 text-emerald-800' : (val === 'B' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800');
                    return `<span class="px-2 py-0.5 rounded text-xs font-bold ${color}">${val}</span>`;
                }
            },
            {
                title: "Birim Maliyet (m²)",
                field: "costPerM2",
                width: 150,
                formatter: function(cell) {
                    return `<strong class="text-slate-800">${Number(cell.getValue()).toLocaleString('tr-TR')} TL</strong>`;
                }
            },
            {
                title: "Durum",
                field: "status",
                width: 130,
                formatter: function(cell) {
                    const val = cell.getValue();
                    return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold ${val === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">● ${val}</span>`;
                }
            },
            {
                title: "İşlemler",
                width: 120,
                headerSort: false,
                responsive: 0,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return gridActionsHtml([
                        { icon: 'qr-code', label: 'Pasaport', href: '/passport/' + row.slabCode, target: '_blank' },
                        { icon: 'printer', label: 'Barkod Yazdır', href: '/production/slabs/' + row.id + '/label', target: '_blank' },
                        { icon: 'git-branch', label: 'Soy Ağacı', href: '/genealogy?code=' + row.slabCode }
                    ]);
                }
            }
        ]
    });

    attachTabulatorPagingAnimation(slabsTable);
    bindGridSearch(slabsTable, "slab-search-input");
    slabsTable.on("renderComplete", () => {
        if (window.lucide) window.lucide.createIcons();
    });
});
</script>
</th:block>
</body>
</html>
