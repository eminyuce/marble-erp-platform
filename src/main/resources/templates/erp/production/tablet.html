<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Operatör Tableti | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="space-y-6 max-w-3xl mx-auto">
    <div>
        <h1 class="text-2xl font-black text-slate-900">Operatör tableti</h1>
        <p class="text-sm text-slate-500 mt-1">Yalnızca atanan iş, büyük dokunma alanları, başlat / bitir, giriş-çıkış-fire.</p>
    </div>

    <form method="get" th:action="@{/production/tablet}" class="flex gap-2">
        <input type="text" name="operatorName" th:value="${operatorName}" placeholder="Operatör adı"
               class="flex-1 px-4 py-3 text-base border border-slate-200 rounded-xl">
        <button type="submit" class="px-5 py-3 bg-slate-800 text-white font-semibold rounded-xl">Filtrele</button>
    </form>

    <form th:action="@{/production/tablet/plan}" method="post" class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
        <h2 class="font-bold">İş ata</h2>
        <select name="workOrderId" required class="w-full px-4 py-3 text-base border rounded-xl">
            <option value="" disabled selected>Fabrika iş emri</option>
            <option th:each="wo : ${workOrders}" th:value="${wo.id}" th:text="${wo.orderNo}"></option>
        </select>
        <select name="processType" required class="w-full px-4 py-3 text-base border rounded-xl">
            <option th:each="t : ${processTypes}" th:value="${t.name()}" th:text="${t.label}"></option>
        </select>
        <select name="machineId" class="w-full px-4 py-3 text-base border rounded-xl">
            <option value="">Makine</option>
            <option th:each="m : ${factoryMachines}" th:value="${m.id}" th:text="${m.name}"></option>
        </select>
        <input type="hidden" name="operatorName" th:value="${operatorName}">
        <button type="submit" class="w-full min-h-14 py-4 bg-[#2b6cb0] text-white text-lg font-bold rounded-2xl">Tablete ata</button>
    </form>

    <div th:each="op : ${operations}" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
        <div class="flex justify-between gap-2">
            <div>
                <div class="text-lg font-black" th:text="${op.processType != null ? op.processType.label : 'Operasyon'}">Kesim</div>
                <div class="text-sm text-slate-500" th:text="${op.workOrder != null ? op.workOrder.orderNo : ''}">FWO</div>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-semibold bg-slate-100"
                  th:text="${op.status != null ? op.status.label : ''}">Planlandı</span>
        </div>
        <form th:action="@{'/production/tablet/' + ${op.id} + '/start'}" method="post">
            <input type="hidden" name="operatorName" th:value="${operatorName}">
            <button type="submit" class="w-full min-h-16 py-4 bg-emerald-700 text-white text-xl font-black rounded-2xl">Başlat</button>
        </form>
        <form th:action="@{'/production/tablet/' + ${op.id} + '/finish'}" method="post" class="space-y-3">
            <input type="number" step="0.01" name="inputQuantity" required placeholder="Giriş" class="w-full px-4 py-4 text-lg border rounded-xl">
            <input type="number" step="0.01" name="outputQuantity" required placeholder="Çıkış" class="w-full px-4 py-4 text-lg border rounded-xl">
            <input type="number" step="0.01" name="wasteQuantity" required placeholder="Fire" class="w-full px-4 py-4 text-lg border rounded-xl">
            <select name="wasteUnit" class="w-full px-4 py-4 text-lg border rounded-xl">
                <option value="SQUARE_METER">m²</option>
                <option value="KG">kg</option>
                <option value="TON">ton</option>
            </select>
            <select name="chamferStatus" class="w-full px-4 py-4 text-lg border rounded-xl">
                <option value="NOT_APPLICABLE">Pah uygulanmaz</option>
                <option value="CHAMFERED">Pahlı</option>
                <option value="UNCHAMFERED">Pahsız</option>
            </select>
            <button type="submit" class="w-full min-h-16 py-4 bg-slate-900 text-white text-xl font-black rounded-2xl">Bitir</button>
        </form>
    </div>
    <div th:if="${#lists.isEmpty(operations)}" class="text-center text-slate-400 py-10">Atanmış operasyon yok.</div>
</div>
</body>
</html>
