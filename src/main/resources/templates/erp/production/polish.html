<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Plaka / Bant Silim | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-6">
    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Silim / ebatlama')}"></div>
            <h2 class="admin-page-title">Silim ve ebatlama</h2>
            <p class="erp-list-lead">Plaka Silim, Bant Silim (Pahlı/Pahsız) ve Köprü Kesme ile Ebatlama. Aynı birimde çıkış + fire ≤ giriş.</p>
        </div>
        <a th:href="@{/production}" class="erp-btn-secondary">
            <i data-lucide="arrow-left"></i>
            <span>Fabrika</span>
        </a>
    </div>

    <form th:action="@{/production/polish}" method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <select name="workOrderId" required class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
                <option value="" disabled selected>Fabrika iş emri</option>
                <option th:each="wo : ${workOrders}" th:value="${wo.id}"
                        th:text="${wo.orderNo + ' — ' + (wo.blockCode != null ? wo.blockCode : '')}"></option>
            </select>
            <select name="processType" required class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
                <option th:each="t : ${processTypes}" th:value="${t.name()}" th:text="${t.label}"></option>
            </select>
            <select name="machineId" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
                <option value="">Makine</option>
                <option th:each="m : ${factoryMachines}" th:value="${m.id}" th:text="${m.name}"></option>
            </select>
            <input type="text" name="operatorName" required placeholder="Operatör" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
            <input type="number" step="0.01" name="inputM2" required placeholder="Giriş m²" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
            <input type="number" step="0.01" name="outputM2" required placeholder="Çıkış m²" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
            <input type="number" step="0.01" name="wasteM2" required placeholder="Fire m²" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
            <select name="chamferStatus" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg">
                <option th:each="c : ${chamferStatuses}" th:value="${c.name()}" th:text="${c.label}"></option>
            </select>
            <input type="text" name="notes" placeholder="Not" class="px-3 py-2.5 text-sm border border-slate-200 rounded-lg sm:col-span-2">
        </div>
        <button type="submit" class="min-h-11 px-4 py-2.5 bg-[#2b6cb0] text-white text-sm font-semibold rounded-lg">Operasyonu kaydet</button>
    </form>
</div>
</body>
</html>
