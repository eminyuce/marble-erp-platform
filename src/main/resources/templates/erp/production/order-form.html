<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${(isEdit ?: false) ? 'Fabrika İş Emri Düzenle | Özerler Mermer ERP' : 'Yeni ST / Katrak Kesim | Özerler Mermer ERP'}">
        Fabrika Kesim | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Fabrika', @{/production}, ${(isEdit ?: false) ? 'Düzenle' : 'Yeni kayıt'})}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        ${(isEdit ?: false) ? 'Fabrika iş emrini düzenle' : 'ST veya Katrak kesim'},
        ${(isEdit ?: false) ? 'Makine, operatör ve tüketim bilgilerini güncelleyin.' : 'Giriş tonajı, çıkış m² ve fireyi ayrı girin. ST bant, Katrak plaka üretir.'},
        ${(isEdit ?: false) ? 'Emir #' + record?.orderNo : ''},
        @{/production})}"></div>

    <div class="erp-form-card">
        <form th:action="${(isEdit ?: false)} ? @{/production/orders/{id}/edit(id=${record.id})} : @{/production/create}"
              method="post" class="erp-form">
            <div class="erp-form-body">
                <section class="erp-form-section" th:if="${!(isEdit ?: false)}">
                    <div th:replace="~{fragments/form-page :: section('Kaynak', 'Kesilecek blok, süreç ve makine')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="blockId">Kesilecek kaynak blok <span class="req">*</span></label>
                            <select id="blockId" name="blockId" required class="erp-form-select">
                                <option value="" disabled selected>Blok seçin</option>
                                <option th:each="b : ${availableBlocks}" th:value="${b.id}"
                                        th:attr="data-tonnage=${b.actualTonnage != null and b.actualTonnage > 0 ? b.actualTonnage : b.approximateTonnage}"
                                        th:text="${b.blockCode + ' (' + b.stoneType + ', ' + (b.actualTonnage != null and b.actualTonnage > 0 ? b.actualTonnage : b.approximateTonnage) + ' ton)'}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="processType">Kesim türü <span class="req">*</span></label>
                            <select id="processType" name="processType" required class="erp-form-select">
                                <option th:each="t : ${cuttingTypes}" th:value="${t.name()}" th:text="${t.label}"></option>
                            </select>
                            <div id="process-flow-badge" class="mt-1 p-2 rounded-lg text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-200">
                                Katrak → Plaka Cila akışına gider.
                            </div>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="machineId">Kayıtlı makine</label>
                            <select id="machineId" name="machineId" class="erp-form-select">
                                <option value="">Serbest makine adı</option>
                                <option th:each="m : ${factoryMachines}" th:value="${m.id}" th:text="${m.name + ' (' + (m.machineType != null ? m.machineType.label : '') + ')'}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="machineName">Makine adı <span class="req">*</span></label>
                            <input id="machineName" type="text" name="machineName"
                                   th:value="${record != null ? record.machineName : 'Katrak-01'}"
                                   required class="erp-form-input" placeholder="Katrak-01 veya ST-01">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section" th:if="${isEdit ?: false}">
                    <div th:replace="~{fragments/form-page :: section('Operasyon', 'Makine ve operatör')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="machineNameEdit">Makine adı <span class="req">*</span></label>
                            <input id="machineNameEdit" type="text" name="machineName"
                                   th:value="${record != null ? record.machineName : ''}"
                                   required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="operatorNameEdit">Operatör <span class="req">*</span></label>
                            <input id="operatorNameEdit" type="text" name="operatorName"
                                   th:value="${record != null ? record.operatorName : ''}"
                                   required class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Tüketim', 'Süre, enerji, lama ve kesim gideri')}"></div>
                    <div class="erp-form-grid--4">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="durationHours">Kesim süresi (sa) <span class="req">*</span></label>
                            <input id="durationHours" type="number" step="0.5" name="durationHours"
                                   th:value="${record != null ? record.durationHours : 8.5}" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="electricityKwh">Elektrik (kWh) <span class="req">*</span></label>
                            <input id="electricityKwh" type="number" step="1" name="electricityKwh"
                                   th:value="${record != null ? record.electricityKwh : 420}" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="bladeWearMm">Lama aşınma (mm) <span class="req">*</span></label>
                            <input id="bladeWearMm" type="number" step="0.1" name="bladeWearMm"
                                   th:value="${record != null ? record.bladeWearMm : 1.2}" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field" th:if="${!(isEdit ?: false)}">
                            <label class="erp-form-label" for="directCuttingExpense">Kesim gideri (TL) <span class="req">*</span></label>
                            <input id="directCuttingExpense" type="number" step="1" name="directCuttingExpense"
                                   value="18500" required class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section" th:if="${!(isEdit ?: false)}">
                    <div th:replace="~{fragments/form-page :: section('Giriş / Çıkış / Otomatik Fire Hesabı', 'Giren blok tonajı karşılığı m² ve çıkan sağlam plaka üzerinden anlık fire hesabı')}"></div>
                    <div class="erp-form-grid--4">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="inputQuantity">Giriş tonajı (ton) <span class="req">*</span></label>
                            <input id="inputQuantity" type="number" step="0.001" name="inputQuantity" class="erp-form-input font-bold" placeholder="Blok seçildiğinde otomatik gelir" oninput="calcYield()">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="outputQuantity">Çıkan Sağlam (m²) <span class="req">*</span></label>
                            <input id="outputQuantity" type="number" step="0.01" name="outputQuantity" class="erp-form-input font-bold" placeholder="Üretilen net m²" oninput="calcYield()">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="wasteQuantity">Hesaplanan Fire (m²)</label>
                            <input id="wasteQuantity" type="number" step="0.01" name="wasteQuantity" class="erp-form-input bg-slate-50 font-mono" readonly>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="wasteUnit">Fire birimi</label>
                            <select id="wasteUnit" name="wasteUnit" class="erp-form-select">
                                <option th:each="u : ${wasteUnits}" th:value="${u.name()}" th:text="${u.label}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Canlı Fire & Verim Gösterge Kartı -->
                    <div id="live-cutting-yield-card" class="mt-4 p-4 rounded-xl border border-amber-200 bg-amber-50/70 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">⚡</span>
                            <div>
                                <div class="text-xs font-bold uppercase tracking-wider text-amber-900">Otomatik Fire ve Verim Analizi</div>
                                <p class="text-xs text-amber-700">Fire = Giren Tonaj Karşılığı m² - Çıkan m² (Standart 2cm plaka için ~18.5 m²/ton)</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="bg-white px-3 py-2 rounded-lg border border-amber-200 text-center">
                                <span class="text-[11px] text-slate-500 block">Teorik Brüt Alan</span>
                                <strong id="cutting-theoretical-m2" class="text-slate-800 text-sm font-bold">— m²</strong>
                            </div>
                            <div class="bg-white px-3 py-2 rounded-lg border border-amber-200 text-center">
                                <span class="text-[11px] text-slate-500 block">Net Fire</span>
                                <strong id="cutting-fire-m2" class="text-rose-700 text-sm font-bold">— m²</strong>
                            </div>
                            <div class="bg-amber-500 text-white px-4 py-2 rounded-lg text-center shadow-xs">
                                <span class="text-[11px] text-amber-100 block">Fire Oranı</span>
                                <strong id="cutting-fire-pct" class="text-lg font-black">% —</strong>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section" th:if="${!(isEdit ?: false)}">
                    <div th:replace="~{fragments/form-page :: section('Plaka / bant çıkışı', 'Seleksiyon adetleri ve ölçüler')}"></div>
                    <div class="erp-form-grid--3">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeExtra">Extra adet (K=1.30)</label>
                            <input id="slabCountGradeExtra" type="number" name="slabCountGradeExtra" value="0" min="0" class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeA">A kalite adet (K=1.15) <span class="req">*</span></label>
                            <input id="slabCountGradeA" type="number" name="slabCountGradeA" value="30" min="0" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeB">B kalite adet (K=1.00) <span class="req">*</span></label>
                            <input id="slabCountGradeB" type="number" name="slabCountGradeB" value="15" min="0" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeC">C kalite adet (K=0.65) <span class="req">*</span></label>
                            <input id="slabCountGradeC" type="number" name="slabCountGradeC" value="5" min="0" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="thicknessCm">Kalınlık (cm) <span class="req">*</span></label>
                            <input id="thicknessCm" type="number" step="0.5" name="thicknessCm" value="2.0" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabWidthCm">En (cm) <span class="req">*</span></label>
                            <input id="slabWidthCm" type="number" name="slabWidthCm" value="175" required class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabLengthCm">Boy (cm) <span class="req">*</span></label>
                            <input id="slabLengthCm" type="number" name="slabLengthCm" value="285" required class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Fire ve operasyon', 'Fire kaydı, operatör ve vardiya')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field" th:if="${!(isEdit ?: false)}">
                            <label class="erp-form-label" for="scrapReason">Fire neden kodu</label>
                            <select id="scrapReason" name="scrapReason" class="erp-form-select">
                                <option th:each="r : ${scrapReasons}" th:value="${r.name()}"
                                        th:text="${r.code + ' - ' + r.title}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field" th:if="${!(isEdit ?: false)}">
                            <label class="erp-form-label" for="scrapWeightKg">Fire miktarı (kg)</label>
                            <input id="scrapWeightKg" type="number" step="0.1" name="scrapWeightKg" value="2100" class="erp-form-input">
                        </div>
                        <div class="erp-form-field" th:if="${!(isEdit ?: false)}">
                            <label class="erp-form-label" for="operatorName">Operatör adı <span class="req">*</span></label>
                            <input id="operatorName" type="text" name="operatorName"
                                   th:value="${record != null ? record.operatorName : ''}" required
                                   class="erp-form-input" placeholder="Operatör adı">
                        </div>
                    </div>
                    <div class="erp-form-field erp-notes-band">
                        <label class="erp-form-label" for="notes">Vardiya / notlar</label>
                        <input id="notes" type="text" name="notes"
                               th:value="${record != null ? record.notes : ''}"
                               class="erp-form-input" placeholder="Vardiya notu">
                    </div>
                </section>

                <th:block th:if="${isEdit and record != null}">
                    <div th:replace="~{fragments/audit :: auditInfo(${record?.createdDate}, ${record?.updatedDate}, ${record?.addUserId}, ${record?.updateUserId})}"></div>
                </th:block>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/production})}"></div>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    (function () {
        const blockSelect = document.getElementById('blockId');
        const inputQuantity = document.getElementById('inputQuantity');
        const outputQuantity = document.getElementById('outputQuantity');
        const wasteQuantity = document.getElementById('wasteQuantity');
        const processTypeSelect = document.getElementById('processType');
        const processBadge = document.getElementById('process-flow-badge');
        const thicknessInput = document.getElementById('thicknessCm');

        const theoreticalM2El = document.getElementById('cutting-theoretical-m2');
        const fireM2El = document.getElementById('cutting-fire-m2');
        const firePctEl = document.getElementById('cutting-fire-pct');

        function updateProcessBadge() {
            if (!processTypeSelect || !processBadge) return;
            const val = processTypeSelect.value;
            if (val.includes('ST')) {
                processBadge.textContent = 'ST Kesim → Dar Bant Cila akışına gider (Pahlı/Pahsız).';
                processBadge.className = 'mt-1 p-2 rounded-lg text-xs font-semibold bg-blue-50 text-blue-900 border border-blue-200';
            } else {
                processBadge.textContent = 'Katrak (80 Lama) → Plaka Cila akışına gider (Büyük Plaka).';
                processBadge.className = 'mt-1 p-2 rounded-lg text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-200';
            }
        }

        if (processTypeSelect) {
            processTypeSelect.addEventListener('change', updateProcessBadge);
            updateProcessBadge();
        }

        if (blockSelect) {
            blockSelect.addEventListener('change', function () {
                const opt = blockSelect.options[blockSelect.selectedIndex];
                if (opt) {
                    const tonnage = opt.getAttribute('data-tonnage');
                    if (tonnage && inputQuantity && (!inputQuantity.value || parseFloat(inputQuantity.value) <= 0)) {
                        inputQuantity.value = parseFloat(tonnage).toFixed(3);
                        calcYield();
                    }
                }
            });
        }

        window.calcYield = function () {
            const inTon = parseFloat(inputQuantity ? inputQuantity.value : 0) || 0;
            const outM2 = parseFloat(outputQuantity ? outputQuantity.value : 0) || 0;
            const thickCm = parseFloat(thicknessInput ? thicknessInput.value : 2.0) || 2.0;
            const density = 2.70; // ton / m3

            if (inTon > 0) {
                // Hacim (m3) = inTon / density. Kalınlık (m) = thickCm / 100
                const theoreticalGrossM2 = inTon / (density * (thickCm / 100));
                if (theoreticalM2El) {
                    theoreticalM2El.textContent = theoreticalGrossM2.toFixed(1) + ' m²';
                }

                if (outM2 > 0) {
                    const fire = Math.max(0, theoreticalGrossM2 - outM2);
                    const firePct = (fire / theoreticalGrossM2) * 100;

                    if (wasteQuantity) wasteQuantity.value = fire.toFixed(2);
                    if (fireM2El) fireM2El.textContent = fire.toFixed(1) + ' m²';
                    if (firePctEl) {
                        firePctEl.textContent = '%' + firePct.toFixed(1);
                        if (firePct > 20) {
                            firePctEl.parentElement.className = 'bg-rose-600 text-white px-4 py-2 rounded-lg text-center shadow-xs';
                        } else {
                            firePctEl.parentElement.className = 'bg-amber-500 text-white px-4 py-2 rounded-lg text-center shadow-xs';
                        }
                    }
                }
            }
        };

        if (thicknessInput) thicknessInput.addEventListener('input', window.calcYield);
        calcYield();
    })();
</script>
</th:block>
</body>
</html>
