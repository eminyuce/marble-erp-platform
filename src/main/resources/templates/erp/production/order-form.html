<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="orderModalContent" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <div class="flex items-center gap-2">
                <i data-lucide="scissors" class="w-5 h-5 text-amber-700"></i>
                <h3 class="text-base font-bold text-slate-800">Katrak Dilimleme İş Emri Başlat</h3>
            </div>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form action="/production/create" method="post" hx-post="/production/create" hx-target="#modal-container"
              class="p-6 overflow-y-auto space-y-4">

            <div th:if="${errorMessage}" class="p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs" th:text="${errorMessage}">
                Hata
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Kesilecek Kaynak Blok</label>
                    <select name="blockId" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                        <option th:each="b : ${availableBlocks}" th:value="${b.id}"
                                th:text="${b.blockCode + ' (' + b.stoneType + ', ' + b.actualWeightKg + ' kg)'}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Makine / Katrak Seçimi</label>
                    <input type="text" name="machineName" value="Katrak-01 (80 Lamalı)" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <!-- Operational consumption parameters -->
            <div class="grid grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Kesim Süresi (sa)</label>
                    <input type="number" step="0.5" name="durationHours" value="8.5" required
                           class="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Elektrik (kWh)</label>
                    <input type="number" step="1" name="electricityKwh" value="420" required
                           class="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Lama Aşınma (mm)</label>
                    <input type="number" step="0.1" name="bladeWearMm" value="1.2" required
                           class="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Kesim Gideri (TL)</label>
                    <input type="number" step="1" name="directCuttingExpense" value="18500" required
                           class="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded bg-white">
                </div>
            </div>

            <!-- Grade counts for Grade Multiplier calculation -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-700">Üretilen Plaka Seleksiyon Dağılımı (Grade Multiplier)</label>
                <div class="grid grid-cols-3 gap-3">
                    <div class="p-3 bg-emerald-50 rounded-lg border border-emerald-200">
                        <label class="block text-[11px] font-bold text-emerald-900 mb-1">A Kalite (K=1.15)</label>
                        <input type="number" name="slabCountGradeA" value="30" min="0" required
                               class="w-full px-2 py-1 text-xs border border-emerald-300 rounded bg-white text-center font-bold">
                    </div>
                    <div class="p-3 bg-blue-50 rounded-lg border border-blue-200">
                        <label class="block text-[11px] font-bold text-blue-900 mb-1">B Kalite (K=1.00)</label>
                        <input type="number" name="slabCountGradeB" value="15" min="0" required
                               class="w-full px-2 py-1 text-xs border border-blue-300 rounded bg-white text-center font-bold">
                    </div>
                    <div class="p-3 bg-amber-50 rounded-lg border border-amber-200">
                        <label class="block text-[11px] font-bold text-amber-900 mb-1">C Kalite (K=0.65)</label>
                        <input type="number" name="slabCountGradeC" value="5" min="0" required
                               class="w-full px-2 py-1 text-xs border border-amber-300 rounded bg-white text-center font-bold">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Plaka Kalınlığı (cm)</label>
                    <input type="number" step="0.5" name="thicknessCm" value="2.0" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Plaka En (cm)</label>
                    <input type="number" name="slabWidthCm" value="175" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Plaka Boy (cm)</label>
                    <input type="number" name="slabLengthCm" value="285" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <!-- Mandatory 10-Reason Scrap Logging (BRD Section 3.2) -->
            <div class="p-3.5 bg-rose-50/70 border border-rose-200 rounded-xl space-y-3">
                <div class="flex items-center gap-1.5 text-xs font-bold text-rose-900">
                    <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-600"></i>
                    <span>Zorunlu Fire &amp; Zayiat Girişi (10 Neden Kodlu)</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Fire Neden Kodu</label>
                        <select name="scrapReason" class="w-full px-2.5 py-1.5 text-xs border border-rose-200 rounded-lg bg-white">
                            <option th:each="r : ${scrapReasons}" th:value="${r.name()}"
                                    th:text="${r.code + ' - ' + r.title}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-1">Fire Miktarı (kg / çamur)</label>
                        <input type="number" step="0.1" name="scrapWeightKg" value="2100"
                               class="w-full px-2.5 py-1.5 text-xs border border-rose-200 rounded-lg bg-white">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Operatör Adı</label>
                    <input type="text" name="operatorName" value="Ahmet Kaya" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Vardiya / Notlar</label>
                    <input type="text" name="notes" value="Gündüz vardiyası, 80 lama standart indirme"
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-lg">
                    İptal
                </button>
                <button type="submit" class="px-5 py-2 bg-[#2b6cb0] hover:bg-[#1e4e8c] text-white text-xs font-semibold rounded-lg shadow-sm">
                    Kesimi Tamamla &amp; Plakaları Üret
                </button>
            </div>
        </form>
    </div>

    <script>
        if (window.lucide) window.lucide.createIcons();
    </script>
</div>

<div th:fragment="orderModalSuccess" class="hidden">
    <script>
        closeModal();
        reloadProductionGrid();
    </script>
</div>
</html>
