<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Yeni Kesim Emri | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Katrak Kesim', @{/production}, 'Yeni kayıt')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Katrak dilimleme iş emri',
        'Kaynak bloğu, makine tüketimini, plaka seleksiyonunu ve fire kaydını girerek kesimi başlatın.',
        '',
        @{/production})}"></div>

    <div class="erp-form-card">
        <form th:action="@{/production/create}" method="post" class="erp-form">
            <div class="erp-form-body">
                <div th:if="${errorMessage}" class="erp-form-errors" role="alert" th:text="${errorMessage}">Hata</div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kaynak', 'Kesilecek blok ve makine')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="blockId">Kesilecek kaynak blok <span class="req">*</span></label>
                            <select id="blockId" name="blockId" required class="erp-form-select">
                                <option value="" disabled selected>Blok seçin</option>
                                <option th:each="b : ${availableBlocks}" th:value="${b.id}"
                                        th:text="${b.blockCode + ' (' + b.stoneType + ', ' + b.actualWeightKg + ' kg)'}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="machineName">Makine / katrak <span
                                    class="req">*</span></label>
                            <input id="machineName" type="text" name="machineName" value="Katrak-01 (80 Lamalı)"
                                   required
                                   class="erp-form-input" placeholder="Katrak-01">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Tüketim', 'Süre, enerji, lama ve kesim gideri')}"></div>
                    <div class="erp-form-grid--4">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="durationHours">Kesim süresi (sa) <span
                                    class="req">*</span></label>
                            <input id="durationHours" type="number" step="0.5" name="durationHours" value="8.5" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="electricityKwh">Elektrik (kWh) <span class="req">*</span></label>
                            <input id="electricityKwh" type="number" step="1" name="electricityKwh" value="420" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="bladeWearMm">Lama aşınma (mm) <span class="req">*</span></label>
                            <input id="bladeWearMm" type="number" step="0.1" name="bladeWearMm" value="1.2" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="directCuttingExpense">Kesim gideri (TL) <span
                                    class="req">*</span></label>
                            <input id="directCuttingExpense" type="number" step="1" name="directCuttingExpense"
                                   value="18500" required class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Plaka çıkışı', 'Seleksiyon adetleri ve plaka ölçüleri')}"></div>
                    <div class="erp-form-grid--3">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeA">A kalite adet (K=1.15) <span
                                    class="req">*</span></label>
                            <input id="slabCountGradeA" type="number" name="slabCountGradeA" value="30" min="0" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeB">B kalite adet (K=1.00) <span
                                    class="req">*</span></label>
                            <input id="slabCountGradeB" type="number" name="slabCountGradeB" value="15" min="0" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabCountGradeC">C kalite adet (K=0.65) <span
                                    class="req">*</span></label>
                            <input id="slabCountGradeC" type="number" name="slabCountGradeC" value="5" min="0" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="thicknessCm">Kalınlık (cm) <span
                                    class="req">*</span></label>
                            <input id="thicknessCm" type="number" step="0.5" name="thicknessCm" value="2.0" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabWidthCm">En (cm) <span class="req">*</span></label>
                            <input id="slabWidthCm" type="number" name="slabWidthCm" value="175" required
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="slabLengthCm">Boy (cm) <span class="req">*</span></label>
                            <input id="slabLengthCm" type="number" name="slabLengthCm" value="285" required
                                   class="erp-form-input">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Fire ve operasyon', 'Zorunlu fire kaydı, operatör ve vardiya')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="scrapReason">Fire neden kodu</label>
                            <select id="scrapReason" name="scrapReason" class="erp-form-select">
                                <option th:each="r : ${scrapReasons}" th:value="${r.name()}"
                                        th:text="${r.code + ' - ' + r.title}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="scrapWeightKg">Fire miktarı (kg)</label>
                            <input id="scrapWeightKg" type="number" step="0.1" name="scrapWeightKg" value="2100"
                                   class="erp-form-input">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="operatorName">Operatör adı <span
                                    class="req">*</span></label>
                            <input id="operatorName" type="text" name="operatorName" value="Ahmet Kaya" required
                                   class="erp-form-input" placeholder="Operatör adı">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="notes">Vardiya / notlar</label>
                            <input id="notes" type="text" name="notes"
                                   value="Gündüz vardiyası, 80 lama standart indirme"
                                   class="erp-form-input" placeholder="Vardiya notu">
                        </div>
                    </div>
                </section>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/production})}"></div>
        </form>
    </div>
</div>
</body>
</html>
