<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Fabrika &amp; Plaka Üretimi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Katrak Kesim')}"></div>
            <h2 class="admin-page-title">Katrak kesim</h2>
            <p class="erp-list-lead">Katrak dilimleme, yüzey işlemleri, kalite katsayılı maliyet ve 10 kodlu fire kaydı.</p>
        </div>
        <div class="erp-list-header-actions">
            <button type="button" onclick="downloadTableCsv(productionTable, 'uretim_emirleri.csv')" class="erp-btn-secondary">
                <i data-lucide="download"></i>
                <span>CSV İndir</span>
            </button>
            <a th:href="@{/production/slabs}" class="erp-btn-secondary">
                <i data-lucide="layers"></i>
                <span>Plaka Ambarı</span>
            </a>
            <button type="button" hx-get="/production/create" hx-target="#modal-container" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni kesim emri</span>
            </button>
        </div>
    </div>

    <aside class="erp-callout" role="note">
        <i data-lucide="sparkles"></i>
        <p><strong>Kalite çarpanı:</strong> A kalite K=1.15, B kalite K=1.00, C kalite K=0.65 ile eşdeğer alan üzerinden birim maliyet dağıtılır.</p>
    </aside>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('İş emri no, makine veya blok kodu', 'search-input')}"></div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('production-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/production-grid.js}"></script>
</th:block>
</body>
</html>
