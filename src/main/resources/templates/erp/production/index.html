<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Fabrika &amp; Plaka Üretimi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Katrak Kesim')}"></div>
            <h2 class="admin-page-title">Katrak kesim</h2>
            <p class="erp-list-lead">Katrak dilimleme, yüzey işlemleri, kalite katsayılı maliyet ve 10 kodlu fire
                kaydı.</p>
        </div>
    </div>

    <aside class="erp-callout" role="note">
        <i data-lucide="sparkles"></i>
        <p><strong>Kalite çarpanı:</strong> A kalite K=1.15, B kalite K=1.00, C kalite K=0.65 ile eşdeğer alan üzerinden
            birim maliyet dağıtılır.</p>
    </aside>

    <div class="erp-toolbar">
        <a th:href="@{/production/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni kesim emri</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('İş emri no, makine veya blok kodu', 'search-input')}"></div>
        <div class="erp-toolbar-actions">
            <a th:href="@{/production/slabs}" class="erp-btn-secondary">
                <i data-lucide="layers"></i>
                <span>Plaka Ambarı</span>
            </a>
            <div x-data="{ exportOpen: false }" class="relative">
                <button @click="exportOpen = !exportOpen" type="button" class="erp-btn-secondary">
                    <i data-lucide="download"></i>
                    <span>Dışa Aktar</span>
                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                </button>
                <div x-show="exportOpen" @click.outside="exportOpen = false" x-transition
                     class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50"
                     style="display:none;">
                    <button @click="downloadTable(productionTable, 'uretim_emirleri', 'csv'); exportOpen = false"
                            type="button"
                            class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                        <span><strong>CSV</strong> <span class="text-slate-400">(.csv)</span></span>
                    </button>
                    <button @click="downloadTable(productionTable, 'uretim_emirleri', 'xlsx'); exportOpen = false"
                            type="button"
                            class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
                        <span><strong>Excel</strong> <span class="text-slate-400">(.xlsx)</span></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('production-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/production-grid.js}"></script>
</th:block>
</body>
</html>
