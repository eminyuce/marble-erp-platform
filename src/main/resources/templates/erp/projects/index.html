<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Şantiyeler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     x-data="{
        statusFilter: '',
        setStatusFilter(st) {
            this.statusFilter = st;
            if (typeof reloadProjectsGrid === 'function') reloadProjectsGrid();
        },
        gridExtraQuery() {
            return this.statusFilter ? '&status=' + encodeURIComponent(this.statusFilter) : '';
        }
     }"
     x-init="window.projectsPageState = $data">

    <!-- Header Section -->
    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Şantiyeler')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="building-2" class="w-7 h-7 text-cyan-600 inline-block"></i>
                <span>Şantiyeler &amp; Mahal Planlama</span>
            </h2>
            <p class="erp-list-lead">
                Mermer taahhüt projelerinin mahal bazlı metraj ağacı, taş siparişleri, montaj ilerlemesi ve şantiye net kârlılık takibi.
                <span th:replace="~{fragments/erp-ops :: tip('', 'Proje içine girerek oda ve mahal bazında döşenecek mermerleri planlayabilirsiniz.')}"></span>
            </p>
        </div>
    </div>

    <!-- KPI Summary Cards (Blocks Standard) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" th:if="${summary != null}">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === '' ? 'erp-summary-card--active' : ''"
                @click="setStatusFilter('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Toplam Şantiye</div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.totalProjects}">0</span> proje
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'IN_PROGRESS' ? 'erp-summary-card--active ring-2 ring-cyan-500' : ''"
                @click="setStatusFilter('IN_PROGRESS')">
            <div class="text-[11px] uppercase tracking-wide text-cyan-600 font-semibold flex items-center gap-1">
                <i data-lucide="hard-hat" class="w-3.5 h-3.5"></i> Devam Eden Montaj
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.activeProjects}">0</span> aktif
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'COMPLETED' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="setStatusFilter('COMPLETED')">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Tamamlanan Proje
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${summary.completedProjects}">0</span> bitti
            </div>
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-4">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Toplam Sözleşme Bedeli</div>
            <div class="text-lg font-black text-cyan-950 mt-1 font-mono"
                 th:text="${summary.totalContractValue != null ? #numbers.formatDecimal(summary.totalContractValue, 1, 'POINT', 2, 'COMMA') + ' ₺' : '0,00 ₺'}">0,00 ₺</div>
        </div>
    </div>

    <!-- Operational Filter Chips -->
    <div class="erp-yard-filters">
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('')">Tüm Şantiyeler</button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'IN_PROGRESS' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('IN_PROGRESS')">
            <i data-lucide="play" class="w-3.5 h-3.5 inline mr-1"></i>
            Devam Edenler
        </button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'COMPLETED' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('COMPLETED')">
            <i data-lucide="check" class="w-3.5 h-3.5 inline mr-1"></i>
            Tamamlananlar
        </button>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <a th:href="@{/projects/create}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni Şantiye</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('Şantiye kodu, adı veya müşteri...', 'project-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('projects-table', 'projeler')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('projects-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let projectsTable;
        document.addEventListener("DOMContentLoaded", () => {
            projectsTable = new Tabulator("#projects-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50, 100],
                ajaxURL: "/projects/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "project-search-input", function () {
                        return window.projectsPageState ? window.projectsPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("projects-table", response);
                },
                placeholder: "Kriterlere uygun şantiye kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Şantiye Kodu",
                        field: "projectCode",
                        width: 160,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/projects/${row.id}" class="font-mono font-bold text-amber-900 hover:text-amber-700 underline">${gridText(cell.getValue())}</a>`;
                        }
                    },
                    {
                        title: "Şantiye Adı",
                        field: "name",
                        minWidth: 200,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                        <a href="/projects/${row.id}" class="font-bold text-slate-900 hover:text-amber-700 underline">${gridText(row.name)}</a>
                        <div class="text-xs text-slate-500">${gridText(row.customerName)}</div>
                    </div>`;
                        }
                    },
                    {
                        title: "Sözleşme Bedeli",
                        field: "contractValue",
                        width: 150,
                        formatter: function (cell) {
                            return `<strong>${gridMoney(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Gerçekleşen Maliyet",
                        field: "actualCost",
                        width: 160,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            const isOver = row.costVariance > 0;
                            return `<div>
                        <span class="font-bold ${isOver ? 'text-rose-700' : 'text-slate-800'}">${gridMoney(cell.getValue())}</span>
                        <div class="text-xs text-slate-500">Tahmini: ${gridMoney(row.estimatedCost)}</div>
                    </div>`;
                        }
                    },
                    {
                        title: "Montaj İlerlemesi",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            const planned = row.totalPlannedAreaM2 || 0;
                            const installed = row.totalInstalledAreaM2 || 0;
                            const pct = planned > 0 ? ((installed / planned) * 100).toFixed(1) : 0;
                            return `<div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>${installed} / ${planned} m²</span>
                            <span>%${pct}</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5">
                            <div class="bg-emerald-600 h-1.5 rounded-full" style="width: ${pct}%"></div>
                        </div>
                    </div>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">● ${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 120,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return gridActionsHtml([
                                {icon: 'eye', label: 'Detay', href: '/projects/' + row.id},
                                {icon: 'edit-3', label: 'Düzenle', href: '/projects/' + row.id + '/edit'},
                                {icon: 'map-pin', label: 'Mahaller', href: '/projects/' + row.id}
                            ]);
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(projectsTable);
            bindGridSearch(projectsTable, "project-search-input");
            projectsTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadProjectsGrid() {
            if (projectsTable) projectsTable.setData();
        }
        window.reloadProjectsGrid = reloadProjectsGrid;
    </script>
</th:block>
</body>
</html>
