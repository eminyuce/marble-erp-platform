<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Proje &amp; Şantiye Yönetimi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Şantiyeler')}"></div>
            <h2 class="admin-page-title">Şantiyeler</h2>
            <p class="erp-list-lead">Mahal metraj ağacı (WBS), fiili sarfiyatlar, montaj puantajı ve bütçe sapması.</p>
        </div>
        <div class="erp-list-header-actions">
            <button type="button" onclick="downloadTableCsv(projectsTable, 'projeler.csv')" class="erp-btn-secondary">
                <i data-lucide="download"></i>
                <span>CSV İndir</span>
            </button>
            <button type="button" hx-get="/projects/create" hx-target="#modal-container" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni proje oluştur</span>
            </button>
        </div>
    </div>

    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Proje kodu, adı veya müşteri', 'project-search-input')}"></div>
    </div>

    <div th:replace="~{fragments/list-chrome :: gridShell('projects-table')}"></div>
</div>

<th:block layout:fragment="scripts">
<script>
let projectsTable;
document.addEventListener("DOMContentLoaded", () => {
    projectsTable = new Tabulator("#projects-table", {
        layout: "fitColumns",
        pagination: true,
        paginationMode: "remote",
        paginationSize: 10,
        ajaxURL: "/projects/api/data",
        ajaxConfig: { method: "GET", headers: { "Accept": "application/json" } },
        ajaxURLGenerator: function(url, config, params) {
            const searchVal = document.getElementById("project-search-input")?.value || "";
            return `${url}?page=${params.page}&size=${params.size}&search=${encodeURIComponent(searchVal)}`;
        },
        ajaxResponse: function(url, params, response) {
            return applyTabulatorTotal("projects-table", response);
        },
        columns: [
            {
                title: "Proje Kodu",
                field: "projectCode",
                width: 160,
                formatter: function(cell) {
                    return `<span class="font-mono font-bold text-amber-900">${cell.getValue()}</span>`;
                }
            },
            {
                title: "Proje Adı",
                field: "name",
                minWidth: 200,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<div>
                        <a href="/projects/${row.id}" class="font-bold text-slate-900 hover:text-amber-700 underline">${row.name}</a>
                        <div class="text-xs text-slate-500">${row.customerName}</div>
                    </div>`;
                }
            },
            {
                title: "Sözleşme Bedeli",
                field: "contractValue",
                width: 150,
                formatter: function(cell) {
                    return `<strong>${Number(cell.getValue()).toLocaleString('tr-TR')} TL</strong>`;
                }
            },
            {
                title: "Gerçekleşen Maliyet",
                field: "actualCost",
                width: 160,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    const isOver = row.costVariance > 0;
                    return `<div>
                        <span class="font-bold ${isOver ? 'text-rose-700' : 'text-slate-800'}">${Number(cell.getValue()).toLocaleString('tr-TR')} TL</span>
                        <div class="text-xs text-slate-500">Tahmini: ${Number(row.estimatedCost).toLocaleString('tr-TR')} TL</div>
                    </div>`;
                }
            },
            {
                title: "Montaj İlerlemesi",
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    const planned = row.totalPlannedAreaM2 || 0;
                    const installed = row.totalInstalledAreaM2 || 0;
                    const pct = planned > 0 ? ((installed / planned) * 100).toFixed(1) : 0;
                    return `<div>
                        <div class="flex justify-between text-xs font-semibold mb-1">
                            <span>${installed} / ${planned} m²</span>
                            <span>%${pct}</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5">
                            <div class="bg-emerald-600 h-1.5 rounded-full" style="width: ${pct}%"></div>
                        </div>
                    </div>`;
                }
            },
            {
                title: "Durum",
                field: "statusLabel",
                width: 120,
                formatter: function(cell) {
                    return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">● ${cell.getValue()}</span>`;
                }
            },
            {
                title: "Detay",
                width: 100,
                headerSort: false,
                formatter: function(cell) {
                    const row = cell.getRow().getData();
                    return `<a href="/projects/${row.id}" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded">Mahaller &rarr;</a>`;
                }
            }
        ]
    });

    attachTabulatorPagingAnimation(projectsTable);
    bindGridSearch(projectsTable, "project-search-input");
    projectsTable.on("renderComplete", () => {
        if (window.lucide) window.lucide.createIcons();
    });
});

function reloadProjectsGrid() {
    if (projectsTable) projectsTable.replaceData();
}
</script>
</th:block>
</body>
</html>
