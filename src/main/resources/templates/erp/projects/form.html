<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="projectModalContent" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 class="text-base font-bold text-slate-800">Yeni Şantiye / Proje Oluştur</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form action="/projects/create" method="post" hx-post="/projects/create" hx-target="#modal-container"
              class="p-6 overflow-y-auto space-y-4">

            <div th:if="${errorMessage}" class="p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs" th:text="${errorMessage}">
                Hata
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Proje Kodu</label>
                    <input type="text" name="projectCode" placeholder="PROJ-2026-0043" required
                           class="w-full px-3 py-2 text-xs font-mono border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Müşteri / İşveren</label>
                    <input type="text" name="customerName" placeholder="ABC İnşaat A.Ş." required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Proje Adı</label>
                <input type="text" name="name" placeholder="X Residence Doğal Taş İmalatı" required
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Sözleşme Bedeli (TL)</label>
                    <input type="number" step="0.01" name="contractValue" placeholder="12400000.00" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Tahmini Bütçe (TL)</label>
                    <input type="number" step="0.01" name="estimatedCost" placeholder="7800000.00" required
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Başlangıç Tarihi</label>
                    <input type="date" name="startDate"
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Teslim Tarihi</label>
                    <input type="date" name="deliveryDate"
                           class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Proje Notları</label>
                <textarea name="notes" rows="3" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg"
                          placeholder="Şantiye koordinatları, taşeron ekibi ve mahal metraj detayları..."></textarea>
            </div>

            <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-lg">
                    İptal
                </button>
                <button type="submit" class="px-5 py-2 bg-[#2b6cb0] hover:bg-[#1e4e8c] text-white text-xs font-semibold rounded-lg shadow-sm">
                    Projeyi Kaydet
                </button>
            </div>
        </form>
    </div>
</div>

<div th:fragment="projectModalSuccess" class="hidden">
    <script>
        closeModal();
        reloadProjectsGrid();
    </script>
</div>
</html>
