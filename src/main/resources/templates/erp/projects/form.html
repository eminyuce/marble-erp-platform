<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${(isEdit ?: false) ? 'Şantiye Düzenle | Özerler Mermer ERP' : 'Yeni Şantiye | Özerler Mermer ERP'}">Yeni Şantiye | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Şantiyeler', @{/projects}, ${(isEdit ?: false) ? 'Düzenle' : 'Yeni kayıt'})}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        ${(isEdit ?: false) ? 'Şantiyeyi düzenle' : 'Yeni şantiye'},
        'Sözleşme, bütçe ve teslim bilgileriyle şantiye kaydı oluşturun veya güncelleyin.',
        ${(isEdit ?: false) ? record?.projectCode : ''},
        @{/projects})}"></div>

    <div class="erp-form-card">
        <form th:action="${(isEdit ?: false)} ? @{/projects/{id}/edit(id=${record.id})} : @{/projects/create}" method="post" class="erp-form">
            <div class="erp-form-body">
                <div th:if="${errorMessage}" class="erp-form-errors" role="alert" th:text="${errorMessage}">Hata</div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kimlik', 'Şantiye kodu, adı ve işveren')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="projectCode">Şantiye kodu <span
                                    class="req">*</span></label>
                            <input id="projectCode" type="text" name="projectCode" required
                                   th:value="${record != null ? record.projectCode : ''}"
                                   class="erp-form-input" style="font-family:var(--font-mono);"
                                   placeholder="PROJ-2026-0043">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="customerName">Müşteri / işveren <span
                                    class="req">*</span></label>
                            <input id="customerName" type="text" name="customerName" required class="erp-form-input"
                                   th:value="${record != null ? record.customerName : ''}"
                                   placeholder="ABC İnşaat A.Ş.">
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="name">Şantiye adı <span class="req">*</span></label>
                            <input id="name" type="text" name="name" required class="erp-form-input"
                                   th:value="${record != null ? record.name : ''}"
                                   placeholder="X Residence doğal taş imalatı">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Bütçe', 'Sözleşme bedeli ve tahmini maliyet')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="contractValue">Sözleşme bedeli (TL) <span
                                    class="req">*</span></label>
                            <input id="contractValue" type="number" step="0.01" name="contractValue" required
                                   th:value="${record != null ? record.contractValue : ''}"
                                   class="erp-form-input"
                                   placeholder="12400000.00">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="estimatedCost">Tahmini bütçe (TL) <span
                                    class="req">*</span></label>
                            <input id="estimatedCost" type="number" step="0.01" name="estimatedCost" required
                                   th:value="${record != null ? record.estimatedCost : ''}"
                                   class="erp-form-input"
                                   placeholder="7800000.00">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Tarihler ve notlar', 'Planlanan başlangıç / teslim ve serbest metin')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="startDate">Başlangıç tarihi</label>
                            <input id="startDate" type="date" name="startDate" class="erp-form-input"
                                   th:value="${record != null ? record.startDate : ''}">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="deliveryDate">Teslim tarihi</label>
                            <input id="deliveryDate" type="date" name="deliveryDate" class="erp-form-input"
                                   th:value="${record != null ? record.deliveryDate : ''}">
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="project-notes-hidden">Şantiye notları</label>
                            <div id="project-notes-editor" data-html-notes data-hidden-id="project-notes-hidden"></div>
                            <input type="hidden" id="project-notes-hidden" name="notes"
                                   th:value="${record != null ? record.notes : ''}">
                        </div>
                    </div>
                </section>

                <th:block th:if="${isEdit and record != null}">
                    <div th:replace="~{fragments/audit :: auditInfo(${record?.createdDate}, ${record?.updatedDate}, ${record?.addUserId}, ${record?.updateUserId})}"></div>
                </th:block>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/projects})}"></div>
        </form>
    </div>
</div>
</body>
</html>
