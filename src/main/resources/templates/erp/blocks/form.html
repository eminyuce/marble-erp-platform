<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${((isEdit ?: false) ? 'Blok Düzenle' : 'Yeni Blok Kaydı') + ' | Özerler Mermer ERP'}">Blok</title>
    <link rel="stylesheet" th:href="@{/vendor/filepond/filepond.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/filepond/filepond-plugin-image-preview.min.css}">
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Ocak', @{/blocks}, ${(isEdit ?: false) ? 'Düzenle' : 'Yeni kayıt'})}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        ${(isEdit ?: false) ? 'Blok bilgilerini düzenle' : 'Yeni ham blok giriş kartı'},
        ${(isEdit ?: false) ? 'Ocak çıkışını, 3 eksenli ölçüleri, tartım ve kalite bilgilerini güncelleyin.' : 'Ocak çıkışını, 3 eksenli ölçüleri, kantar tartımını ve kalite bilgilerini kaydedin.'},
        ${(isEdit ?: false) ? 'Blok #' + block?.blockCode : ''},
        @{/blocks})}"></div>

    <div class="erp-form-card">
        <form id="block-form" th:action="${(isEdit ?: false)} ? @{/blocks/{id}/edit(id=${block.id})} : @{/blocks/create}" method="post"
              class="erp-form">
            <div class="erp-form-body">
                <div th:if="${errorMessage}" class="erp-form-errors" role="alert" th:text="${errorMessage}">Hata</div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kimlik', 'Ocak sahası ve blok kodu')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="quarryId">Ocak sahası <span class="req">*</span></label>
                            <select id="quarryId" name="quarryId" required class="erp-form-select">
                                <option value="" disabled th:selected="${!(isEdit ?: false)}">Ocak seçin</option>
                                <option th:each="q : ${quarries}" th:value="${q.id}"
                                        th:selected="${isEdit and block != null and block.quarry != null and block.quarry.id == q.id}"
                                        th:text="${q.name + ' (' + q.location + ')'}"></option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="blockCode">Blok kodu <span class="req">*</span></label>
                            <input id="blockCode" type="text" name="blockCode" required
                                   th:value="${isEdit and block != null ? block.blockCode : ''}"
                                   th:attr="data-exclude-id=${isEdit and block != null ? block.id : ''}"
                                   class="erp-form-input" style="font-family:var(--font-mono);"
                                   placeholder="BLK-2026-00128" autocomplete="off">
                            <p id="block-code-hint" class="erp-form-hint" role="status"></p>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Ölçü ve tartım', 'Santimetre cinsinden 3 eksen ve kantar kilosu')}"></div>
                    <div class="erp-form-grid--3">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="widthCm">En (cm) <span class="req">*</span></label>
                            <input id="widthCm" type="number" name="widthCm" required
                                   th:value="${isEdit and block != null ? block.widthCm : ''}"
                                   class="erp-form-input" placeholder="180">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="lengthCm">Boy (cm) <span class="req">*</span></label>
                            <input id="lengthCm" type="number" name="lengthCm" required
                                   th:value="${isEdit and block != null ? block.lengthCm : ''}"
                                   class="erp-form-input" placeholder="290">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="heightCm">Yükseklik (cm) <span
                                    class="req">*</span></label>
                            <input id="heightCm" type="number" name="heightCm" required
                                   th:value="${isEdit and block != null ? block.heightCm : ''}"
                                   class="erp-form-input" placeholder="150">
                        </div>
                    </div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="actualWeightKg">Kantar tartımı (kg) <span
                                    class="req">*</span></label>
                            <input id="actualWeightKg" type="number" step="0.01" name="actualWeightKg" required
                                   th:value="${isEdit and block != null ? block.actualWeightKg : ''}"
                                   class="erp-form-input" placeholder="20850.00">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="extractionCost">Ocak çıkarma maliyeti (TL) <span
                                    class="req">*</span></label>
                            <input id="extractionCost" type="number" step="0.01" name="extractionCost" required
                                   th:value="${isEdit and block != null ? block.extractionCost : ''}"
                                   class="erp-form-input" placeholder="42000.00">
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Kalite', 'Taş cinsi ve kalite sınıfı')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="stoneType">Taş cinsi ve seleksiyon <span
                                    class="req">*</span></label>
                            <input id="stoneType" type="text" name="stoneType" required
                                   th:value="${isEdit and block != null ? block.stoneType : ''}"
                                   class="erp-form-input" placeholder="Örn: Muğla Beyaz Kristal">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="qualityGrade">Kalite sınıfı <span class="req">*</span></label>
                            <select id="qualityGrade" name="qualityGrade" required class="erp-form-select">
                                <option value="" disabled th:selected="${!(isEdit ?: false)}">Kalite seçin</option>
                                <option th:each="g : ${qualityGrades}" th:value="${g.name()}"
                                        th:selected="${isEdit and block != null and block.qualityGrade == g}"
                                        th:text="${g.label}"></option>
                            </select>
                        </div>
                    </div>
                    <input type="hidden" name="crackLevel"
                           th:value="${isEdit and block != null ? block.crackLevel : 0}">
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Görseller ve notlar', 'Dört cephe fotoğrafı ve jeolojik tanım')}"></div>
                    <div class="erp-form-field">
                        <label class="erp-form-label" for="block-filepond">Blok 4 cephe fotoğrafları</label>
                        <input type="file" id="block-filepond" name="file" class="filepond">
                        <input type="hidden" id="photo-urls-input" name="photoUrls"
                               th:value="${isEdit and block != null ? block.photoUrls : ''}">
                    </div>
                    <div class="erp-form-field">
                        <label class="erp-form-label">Jeolojik ayna notları</label>
                        <div id="dual-editor-container"></div>
                        <input type="hidden" id="notes-hidden-input" name="notes"
                               th:value="${isEdit and block != null ? block.notes : ''}">
                    </div>
                </section>

                <th:block th:if="${isEdit and block != null}">
                    <div th:replace="~{fragments/audit :: auditInfo(${block?.createdDate}, ${block?.updatedDate}, ${block?.addUserId}, ${block?.updateUserId})}"></div>
                </th:block>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/blocks})}"></div>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/vendor/filepond/filepond-plugin-image-preview.min.js}"></script>
    <script th:src="@{/vendor/filepond/filepond.min.js}"></script>
    <script th:src="@{/js/filepond-setup.js(v=${assetVersion})}"></script>
    <script>
        initFilePond('#block-filepond', '#photo-urls-input');
        initDualEditor('dual-editor-container', 'notes-hidden-input');

        (function () {
            const input = document.getElementById('blockCode');
            const hint = document.getElementById('block-code-hint');
            const form = document.getElementById('block-form');
            if (!input || !hint || !form) return;

            let timer = null;

            function setHint(available, message) {
                hint.textContent = message || '';
                hint.dataset.available = available ? 'true' : 'false';
                hint.classList.toggle('text-rose-700', !available && !!message);
                hint.classList.toggle('text-emerald-700', available && !!message);
            }

            function checkCode() {
                const code = (input.value || '').trim();
                if (!code) {
                    setHint(true, '');
                    return;
                }
                const excludeId = input.dataset.excludeId || '';
                const url = '/blocks/api/block-code-available?code=' + encodeURIComponent(code)
                    + (excludeId ? '&excludeId=' + encodeURIComponent(excludeId) : '');
                fetch(url, {headers: {'Accept': 'application/json'}})
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        if (!data) return;
                        setHint(!!data.available, data.message || '');
                    })
                    .catch(function () { setHint(true, ''); });
            }

            input.addEventListener('input', function () {
                hint.dataset.available = 'true';
                clearTimeout(timer);
                timer = setTimeout(checkCode, 300);
            });
            input.addEventListener('blur', checkCode);
            form.addEventListener('submit', function (event) {
                if (hint.dataset.available === 'false') {
                    event.preventDefault();
                    input.focus();
                }
            });
        })();
    </script>
</th:block>
</body>
</html>
