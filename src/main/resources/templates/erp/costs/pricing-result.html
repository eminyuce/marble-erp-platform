<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="pricingResultFragment" class="space-y-3 bg-white p-4 rounded-xl border border-slate-200">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <span class="text-xs font-bold text-slate-700">Simülasyon Çıktısı</span>
        <span th:if="${sim.marginAlert}"
              class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800 animate-pulse">
            ⚠️ Marj Limiti Altında (&lt;%22)
        </span>
        <span th:unless="${sim.marginAlert}"
              class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">
            ✓ Uygun Marj
        </span>
    </div>

    <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="p-2.5 bg-slate-50 rounded-lg">
            <div class="text-[10px] text-slate-400 uppercase font-semibold">Önerilen Liste Fiyatı</div>
            <div class="text-base font-black text-slate-900"
                 th:text="${#numbers.formatDecimal(sim.suggestedBasePrice, 1, 'POINT', 2, 'COMMA')} + ' TL/m²'">1.950,00
                TL
            </div>
            <div class="text-[10px] text-slate-500" th:text="'Hedef Marj: %' + ${sim.targetMarginPct}">Hedef: %30</div>
        </div>

        <div class="p-2.5 bg-slate-50 rounded-lg">
            <div class="text-[10px] text-slate-400 uppercase font-semibold">İskontolu Net Fiyat</div>
            <div class="text-base font-black text-amber-700"
                 th:text="${#numbers.formatDecimal(sim.netSellingPrice, 1, 'POINT', 2, 'COMMA')} + ' TL/m²'">1.852,50 TL
            </div>
            <div class="text-[10px] text-slate-500" th:text="'İskonto: %' + ${sim.appliedDiscountPct}">İskonto: %5</div>
        </div>
    </div>

    <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs flex justify-between items-center">
        <div>
            <div class="font-semibold text-slate-800">Gerçekleşecek Brüt Kâr</div>
            <div class="text-[10px] text-slate-500">Maliyet: <span th:text="${sim.unitCost}">1365</span> TL/m²</div>
        </div>
        <div class="text-right">
            <div class="font-black text-emerald-700"
                 th:text="'+' + ${#numbers.formatDecimal(sim.grossProfitPerM2, 1, 'POINT', 2, 'COMMA')} + ' TL/m²'">
                +487,50 TL
            </div>
            <div class="text-[11px] font-bold text-slate-700" th:text="'Net Marj: %' + ${sim.resultingMarginPct}">
                %26.3
            </div>
        </div>
    </div>
</div>
</html>
