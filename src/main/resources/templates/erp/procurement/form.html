<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="procurementModalContent" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 class="text-base font-bold text-slate-800">Yeni Satın Alma Siparişi</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form action="/procurement/create" method="post" hx-post="/procurement/create" hx-target="#modal-container"
              class="p-6 overflow-y-auto space-y-4">

            <div th:if="${errorMessage}" class="p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-lg text-xs" th:text="${errorMessage}">
                Hata
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Sipariş No</label>
                <input type="text" name="poNumber" th:value="${generatedPoNumber}" required
                       class="w-full px-3 py-2 text-xs font-mono border border-slate-200 rounded-lg">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Tedarikçi</label>
                <select name="supplierId" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                    <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.companyName + ' (' + s.supplierType.label + ')'}">Tedarikçi</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">İlgili Proje (isteğe bağlı)</label>
                <select name="projectId" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
                    <option value="">— Proje seçilmedi —</option>
                    <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.projectCode + ' — ' + p.name}">Proje</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Beklenen Teslimat Tarihi</label>
                <input type="date" name="expectedDelivery"
                       class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notlar</label>
                <textarea name="notes" rows="3" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg"
                          placeholder="Sipariş detayları, teslimat adresi..."></textarea>
            </div>

            <div class="pt-4 border-t border-slate-200 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-700 hover:bg-slate-100 text-xs font-semibold rounded-lg">
                    İptal
                </button>
                <button type="submit" class="px-5 py-2 bg-[#2b6cb0] hover:bg-[#1e4e8c] text-white text-xs font-semibold rounded-lg shadow-sm">
                    Siparişi Oluştur
                </button>
            </div>
        </form>
    </div>
</div>

<div th:fragment="procurementModalSuccess" class="hidden">
    <script>
        closeModal();
        reloadProcurementGrid();
    </script>
</div>
</html>
