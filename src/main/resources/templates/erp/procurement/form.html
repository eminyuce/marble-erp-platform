<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Yeni Satın Alma Siparişi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">

    <div th:replace="~{fragments/form-page :: breadcrumb('Satın Alma', @{/procurement}, 'Yeni kayıt')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Yeni satın alma siparişi',
        'Tedarikçi, proje ve teslimat bilgileriyle yeni bir satın alma kaydı oluşturun.',
        '',
        @{/procurement})}"></div>

    <div class="erp-form-card">
        <form th:action="@{/procurement/create}" method="post" class="erp-form">
            <div class="erp-form-body">
                <div th:if="${errorMessage}" class="erp-form-errors" role="alert" th:text="${errorMessage}">Hata</div>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Sipariş', 'Numara, tedarikçi ve ilgili proje')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="poNumber">Sipariş no <span class="req">*</span></label>
                            <input id="poNumber" type="text" name="poNumber" th:value="${generatedPoNumber}" required
                                   class="erp-form-input" style="font-family:var(--font-mono);"
                                   placeholder="SIP-2026-00001">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="supplierId">Tedarikçi <span class="req">*</span></label>
                            <select id="supplierId" name="supplierId" required class="erp-form-select">
                                <option value="" disabled selected>Tedarikçi seçin</option>
                                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.companyName + ' (' + s.supplierType.label + ')'}">Tedarikçi</option>
                            </select>
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="projectId">İlgili proje</label>
                            <select id="projectId" name="projectId" class="erp-form-select">
                                <option value="">Proje seçilmedi</option>
                                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.projectCode + ' — ' + p.name}">Proje</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Teslimat', 'Beklenen tarih ve serbest not')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="expectedDelivery">Beklenen teslimat tarihi</label>
                            <input id="expectedDelivery" type="date" name="expectedDelivery" class="erp-form-input">
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="notes">Notlar</label>
                            <textarea id="notes" name="notes" class="erp-form-textarea"
                                      placeholder="Sipariş detayları, teslimat adresi..."></textarea>
                        </div>
                    </div>
                </section>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/procurement})}"></div>
        </form>
    </div>
</div>
</body>
</html>
