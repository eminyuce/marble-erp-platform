<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Yeni Satın Alma Siparişi | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page">
    <script>
        function procurementForm() {
            return {
                unit: '',
                centerId: '',
                centers: [],
                loading: false,
                init() {
                    const pre = document.getElementById('businessUnit');
                    if (pre && pre.value) {
                        this.unit = pre.value;
                        this.loadCenters();
                    }
                },
                async loadCenters() {
                    this.centerId = '';
                    this.centers = [];
                    if (!this.unit) return;
                    this.loading = true;
                    try {
                        const res = await fetch('/procurement/api/cost-centers?businessUnit=' + encodeURIComponent(this.unit));
                        if (res.ok) this.centers = await res.json();
                    } finally {
                        this.loading = false;
                        if (window.lucide) window.lucide.createIcons();
                    }
                }
            };
        }
    </script>

    <div th:replace="~{fragments/form-page :: breadcrumb('Satın Alma', @{/procurement}, 'Yeni kayıt')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Yeni satın alma siparişi',
        'Her satın alma kalemi onaylandığında seçtiğiniz masraf merkezine gider olarak yazılır.',
        '',
        @{/procurement})}"></div>

    <aside class="erp-callout mb-4" role="note">
        <i data-lucide="pie-chart"></i>
        <p>
            <strong>Masraf merkezi zorunludur.</strong> Ocak, fabrika, atölye veya şantiye (proje) giderlerini
            doğru birime yönlendirmek için maliyet birimini seçin, ardından ilgili masraf merkezini belirleyin.
        </p>
    </aside>

    <div class="erp-form-card">
        <form th:action="@{/procurement/create}" method="post" class="erp-form">
            <div class="erp-form-body">
                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Sipariş', 'Numara, tedarikçi ve maliyet birimi')}"></div>
                    <div class="erp-form-grid" x-data="procurementForm()" x-init="init()">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="poNumber">Sipariş no <span class="req">*</span></label>
                            <input id="poNumber" type="text" name="poNumber" th:value="${record != null ? record.poNumber : generatedPoNumber}" required
                                   class="erp-form-input" style="font-family:var(--font-mono);"
                                   placeholder="SIP-2026-00001">
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="supplierId">Tedarikçi <span class="req">*</span></label>
                            <select id="supplierId" name="supplierId" required class="erp-form-select">
                                <option value="" disabled th:selected="${record == null}">Tedarikçi seçin</option>
                                <option th:each="s : ${suppliers}" th:value="${s.id}"
                                        th:selected="${record != null and record.supplier != null and record.supplier.id == s.id}"
                                        th:text="${s.companyName + ' (' + s.supplierType.label + ')'}">Tedarikçi
                                </option>
                            </select>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="businessUnit">
                                Maliyet birimi <span class="req">*</span>
                                <span th:replace="~{fragments/erp-ops :: tip('', 'Giderin hangi iş birimine ait olduğunu belirler: Ocak, Fabrika, Atölye veya Şantiye.')}"></span>
                            </label>
                            <select id="businessUnit" name="businessUnit" required class="erp-form-select" x-model="unit" @change="loadCenters()">
                                <option value="" disabled selected>Birim seçin</option>
                                <option th:each="u : ${businessUnits}" th:value="${u.name()}" th:text="${u.label}">Birim</option>
                            </select>
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="costCenterId">
                                Masraf merkezi <span class="req">*</span>
                                <span th:replace="~{fragments/erp-ops :: tip('', 'Onay sonrası gider bu masraf merkezine yazılır. Birim değişince liste güncellenir.')}"></span>
                            </label>
                            <select id="costCenterId" name="costCenterId" required class="erp-form-select" x-model="centerId" :disabled="!unit || loading">
                                <option value="" disabled selected x-show="!centerId">Masraf merkezi seçin</option>
                                <template x-for="c in centers" :key="c.id">
                                    <option :value="c.id" x-text="c.code + ' — ' + c.name"></option>
                                </template>
                            </select>
                            <p class="erp-form-hint" x-show="loading">Masraf merkezleri yükleniyor…</p>
                            <p class="erp-form-hint" x-show="unit && !loading && centers.length === 0">Bu birim için tanımlı masraf merkezi yok.</p>
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="projectId">
                                İlgili şantiye
                                <span class="req" x-show="unit === 'SITE'">*</span>
                            </label>
                            <select id="projectId" name="projectId" class="erp-form-select"
                                    :required="unit === 'SITE'">
                                <option value="" th:selected="${record == null or record.project == null}">Proje seçilmedi</option>
                                <option th:each="p : ${projects}" th:value="${p.id}"
                                        th:selected="${record != null and record.project != null and record.project.id == p.id}"
                                        th:text="${p.projectCode + ' — ' + p.name}">Proje
                                </option>
                            </select>
                            <p class="erp-form-hint" x-show="unit === 'SITE'">Şantiye gideri için proje zorunludur.</p>
                        </div>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Teslimat', 'Beklenen tarih ve serbest not')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="expectedDelivery">Beklenen teslimat tarihi</label>
                            <input id="expectedDelivery" type="date" name="expectedDelivery" class="erp-form-input"
                                   th:value="${record != null ? record.expectedDelivery : ''}">
                        </div>
                        <div class="erp-form-field erp-form-field--full">
                            <label class="erp-form-label" for="notes">Notlar</label>
                            <textarea id="notes" name="notes" class="erp-form-textarea"
                                      th:text="${record != null ? record.notes : ''}"
                                      placeholder="Sipariş detayları, teslimat adresi..."></textarea>
                        </div>
                    </div>
                </section>

                <th:block th:if="${isEdit and record != null}">
                    <div th:replace="~{fragments/audit :: auditInfo(${record?.createdDate}, ${record?.updatedDate}, ${record?.addUserId}, ${record?.updateUserId})}"></div>
                </th:block>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/procurement})}"></div>
        </form>
    </div>
</div>
</body>
</html>
