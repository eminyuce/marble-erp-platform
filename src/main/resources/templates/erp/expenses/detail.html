<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="'Gider Kaydı #' + ${expense.id} + ' | Özerler Mermer ERP'"></title>
</head>
<body>
<div layout:fragment="content" class="erp-detail-page space-y-6">

    <div th:replace="~{fragments/list-chrome :: breadcrumb('Giderler ve Satın Alma')}"></div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
        <div>
            <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-slate-100 text-slate-700 font-mono"
                      th:text="'#' + ${expense.id}">#1</span>
                <span class="px-2.5 py-0.5 text-xs font-bold rounded-full"
                      th:classappend="${expense.businessUnit != null ? (expense.businessUnit.name() == 'QUARRY' ? 'bg-amber-100 text-amber-800' : (expense.businessUnit.name() == 'FACTORY' ? 'bg-blue-100 text-blue-800' : (expense.businessUnit.name() == 'WORKSHOP' ? 'bg-rose-100 text-rose-800' : 'bg-cyan-100 text-cyan-800'))) : 'bg-slate-100 text-slate-800'}"
                      th:text="${expense.businessUnitLabel}">Fabrika</span>
                <span th:if="${!expense.canEdit}"
                      class="px-2.5 py-0.5 text-xs font-bold rounded-full bg-rose-100 text-rose-800">Dönem Kapalı</span>
            </div>
            <h2 class="admin-page-title mt-2 mb-1" th:text="${expense.costCenterName}">Masraf Merkezi</h2>
            <p class="text-xs text-slate-500 font-mono" th:text="${expense.costCenterCode}">MM-001</p>
        </div>

        <div class="flex items-center gap-2">
            <a th:href="@{/expenses}" class="erp-btn-secondary">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Listeye Dön</span>
            </a>
            <a th:if="${expense.canEdit}" th:href="@{'/expenses/' + ${expense.id} + '/edit'}" class="erp-btn-primary">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
                <span>Düzenle</span>
            </a>
        </div>
    </div>

    <!-- Details Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Harcama ve Belge Bilgileri</h3>

        <dl class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div>
                <dt class="text-xs font-semibold text-slate-500">Tutar</dt>
                <dd class="text-2xl font-black text-slate-900 font-mono mt-1"
                    th:text="${#numbers.formatDecimal(expense.amount, 1, 'POINT', 2, 'COMMA')} + ' ' + ${expense.currency}">0,00 TL</dd>
            </div>

            <div>
                <dt class="text-xs font-semibold text-slate-500">Gider Türü</dt>
                <dd class="text-sm font-bold text-slate-800 mt-1" th:text="${expense.expenseTypeLabel}">Gider Türü</dd>
            </div>

            <div>
                <dt class="text-xs font-semibold text-slate-500">Kayıt Tarihi</dt>
                <dd class="text-sm font-bold text-slate-800 font-mono mt-1" th:text="${expense.entryDate}">2026-09-16</dd>
            </div>

            <div>
                <dt class="text-xs font-semibold text-slate-500">Maliyet Dönemi</dt>
                <dd class="text-sm font-bold text-slate-800 font-mono mt-1" th:text="${expense.expensePeriod}">2026-09</dd>
            </div>

            <div>
                <dt class="text-xs font-semibold text-slate-500">Fatura / Fiş No</dt>
                <dd class="text-sm font-bold text-slate-800 font-mono mt-1"
                    th:text="${expense.documentNo != null and !expense.documentNo.isBlank() ? expense.documentNo : '—'}">—</dd>
            </div>

            <div>
                <dt class="text-xs font-semibold text-slate-500">Fatura Tarihi</dt>
                <dd class="text-sm font-bold text-slate-800 font-mono mt-1"
                    th:text="${expense.invoiceDate != null ? expense.invoiceDate : '—'}">—</dd>
            </div>

            <div th:if="${expense.targetName != null}">
                <dt class="text-xs font-semibold text-slate-500">İlgili Birim / Hedef</dt>
                <dd class="text-sm font-bold text-slate-800 mt-1" th:text="${expense.targetName}">Ocak / Şantiye Adı</dd>
            </div>
        </dl>

        <div th:if="${expense.description != null and !expense.description.isBlank()}" class="pt-4 border-t border-slate-100">
            <h4 class="text-xs font-semibold text-slate-500 mb-1">Açıklama</h4>
            <p class="text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200 leading-relaxed"
               th:text="${expense.description}">Açıklama metni</p>
        </div>
    </div>
</div>
</body>
</html>
