<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Tahsilat Modülü | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     th:data-initial-method="${selectedMethod}"
     x-data="{
        methodFilter: $el.dataset.initialMethod || '',
        setMethodFilter(m) {
            this.methodFilter = m;
            if (typeof reloadCollectionsGrid === 'function') reloadCollectionsGrid();
        },
        gridExtraQuery() {
            return this.methodFilter ? '&method=' + encodeURIComponent(this.methodFilter) : '';
        }
     }"
     x-init="window.collectionsPageState = $data">

    <!-- Header Section -->
    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Tahsilat')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="wallet" class="w-7 h-7 text-teal-600 inline-block"></i>
                <span>Tahsilat Modülü — Kasa &amp; Banka Hareketleri</span>
            </h2>
            <p class="erp-list-lead">
                Nakit, Havale/EFT ve Çek tahsilatlarının kaydı, müşteri cari bakiye ve fatura kapamaları.
                <span th:replace="~{fragments/erp-ops :: tip('', 'Tahsilat kaydı girildiğinde ilgili faturanın ve müşterinin cari bakiyesi anında güncellenir.')}"></span>
            </p>
        </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="methodFilter === '' ? 'erp-summary-card--active ring-2 ring-slate-900' : ''"
                @click="setMethodFilter('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm Tahsilatlar</div>
            <div class="text-lg font-black text-teal-700 mt-1 font-mono"
                 th:text="${monthlyTotal != null ? #numbers.formatDecimal(monthlyTotal, 1, 'POINT', 2, 'COMMA') + ' ₺' : '0,00 ₺'}">0,00 ₺</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="methodFilter === 'CASH' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="setMethodFilter('CASH')">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="banknote" class="w-3.5 h-3.5"></i> Nakit Kasa
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Elden Tahsilat</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="methodFilter === 'BANK_TRANSFER' ? 'erp-summary-card--active ring-2 ring-blue-500' : ''"
                @click="setMethodFilter('BANK_TRANSFER')">
            <div class="text-[11px] uppercase tracking-wide text-blue-600 font-semibold flex items-center gap-1">
                <i data-lucide="building" class="w-3.5 h-3.5"></i> Banka Havale / EFT
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Hesaba Giriş</div>
        </button>

        <a th:href="@{/collections/checks}" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300 block">
            <div class="text-[11px] uppercase tracking-wide text-purple-600 font-semibold flex items-center gap-1">
                <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i> Çek Portföyü
            </div>
            <div class="text-lg font-black text-amber-600 mt-1">
                <span th:text="${approachingChecksCount != null ? approachingChecksCount : 0}">0</span> yaklaşan çek
            </div>
        </a>
    </div>

    <!-- Operational Filter Chips -->
    <div class="erp-yard-filters">
        <button type="button" class="erp-yard-chip"
                :class="methodFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setMethodFilter('')">Tüm Yöntemler</button>
        <button type="button" class="erp-yard-chip"
                :class="methodFilter === 'CASH' ? 'erp-yard-chip--active' : ''"
                @click="setMethodFilter('CASH')">
            <i data-lucide="banknote" class="w-3.5 h-3.5 inline mr-1 text-emerald-600"></i>
            Nakit
        </button>
        <button type="button" class="erp-yard-chip"
                :class="methodFilter === 'BANK_TRANSFER' ? 'erp-yard-chip--active' : ''"
                @click="setMethodFilter('BANK_TRANSFER')">
            <i data-lucide="building" class="w-3.5 h-3.5 inline mr-1 text-blue-600"></i>
            Havale / EFT
        </button>
        <button type="button" class="erp-yard-chip"
                :class="methodFilter === 'CHECK' ? 'erp-yard-chip--active' : ''"
                @click="setMethodFilter('CHECK')">
            <i data-lucide="calendar" class="w-3.5 h-3.5 inline mr-1 text-purple-600"></i>
            Çek
        </button>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <div class="flex items-center gap-2">
            <a th:href="@{/collections/create}" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni Tahsilat Girişi</span>
            </a>
            <a th:href="@{/collections/checks}" class="erp-btn-secondary">
                <i data-lucide="calendar-check"></i>
                <span>Çek Portföyü</span>
            </a>
        </div>
        <div th:replace="~{fragments/list-chrome :: search('Makbuz no, müşteri veya banka...', 'collection-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('collections-table', 'tahsilatlar')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('collections-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let collectionsTable;
        document.addEventListener("DOMContentLoaded", () => {
            collectionsTable = new Tabulator("#collections-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50, 100],
                ajaxURL: "/collections/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "collection-search-input", function () {
                        return window.collectionsPageState ? window.collectionsPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("collections-table", response);
                },
                placeholder: "Kriterlere uygun tahsilat kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Makbuz / Belge No",
                        field: "collectionNo",
                        width: 170,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-bold text-teal-800 flex items-center gap-1.5">
                                <i data-lucide="receipt" class="w-3.5 h-3.5 text-teal-600 inline"></i>
                                <span>${gridText(cell.getValue())}</span>
                            </span>`;
                        }
                    },
                    {
                        title: "Tarih",
                        field: "collectionDate",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="text-slate-600 font-medium">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Müşteri / Cari",
                        field: "customerName",
                        minWidth: 200,
                        formatter: function (cell) {
                            return `<strong class="text-slate-900">${gridText(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Yöntem",
                        field: "methodLabel",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            let cls = "bg-slate-100 text-slate-800";
                            if (row.method === "CASH") cls = "bg-emerald-100 text-emerald-800";
                            else if (row.method === "BANK_TRANSFER") cls = "bg-blue-100 text-blue-800";
                            else if (row.method === "CHECK") cls = "bg-purple-100 text-purple-800";
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${cls}">
                                ${gridText(cell.getValue())}
                            </span>`;
                        }
                    },
                    {
                        title: "Banka / Kasa",
                        field: "bankName",
                        width: 150,
                        formatter: function (cell) {
                            return `<span class="text-slate-600">${gridText(cell.getValue()) || '—'}</span>`;
                        }
                    },
                    {
                        title: "İlişkili Fatura",
                        field: "invoiceNo",
                        width: 140,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            if (row.invoiceId) {
                                return `<a href="/invoices/${row.invoiceId}" class="font-mono font-bold text-blue-600 hover:underline">${gridText(row.invoiceNo)}</a>`;
                            }
                            return `<span class="text-slate-400">—</span>`;
                        }
                    },
                    {
                        title: "Tahsilat Tutarı",
                        field: "amount",
                        width: 160,
                        formatter: function (cell) {
                            return `<strong class="font-mono text-emerald-700 text-sm">${gridMoney(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Açıklama",
                        field: "notes",
                        minWidth: 150,
                        formatter: function (cell) {
                            return `<span class="text-slate-500 text-xs">${gridText(cell.getValue()) || '—'}</span>`;
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(collectionsTable);
            bindGridSearch(collectionsTable, "collection-search-input");
            collectionsTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadCollectionsGrid() {
            if (collectionsTable) collectionsTable.setData();
        }
        window.reloadCollectionsGrid = reloadCollectionsGrid;
    </script>
</th:block>
</body>
</html>
