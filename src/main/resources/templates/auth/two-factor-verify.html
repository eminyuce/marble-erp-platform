<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{auth/two-factor-fragments :: head('Doğrulama kodu')}"></head>
<body class="admin-login-page">
<div class="admin-login">
    <div class="admin-login__shell">
        <aside th:replace="~{auth/two-factor-fragments :: guide('verify')}"></aside>
        <section class="admin-login__panel">
            <h2 class="admin-login__panel-title">Doğrulama kodu</h2>
            <p class="admin-login__panel-sub">Google Authenticator uygulamasındaki 6 haneli kodu girin.</p>

            <div class="admin-login__alert admin-login__alert--error" th:if="${errorMessage}" role="alert" id="tfaError">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <div th:text="${errorMessage}">Hata</div>
            </div>

            <form th:action="@{/auth/2fa/verify}" method="post" class="admin-login__form" id="twoFactorVerifyForm">
                <div class="mb-3">
                    <label for="code" class="form-label">6 haneli kod veya yedek kod</label>
                    <input type="text" id="code" name="code" required autofocus maxlength="9"
                           inputmode="text" autocomplete="one-time-code" autocapitalize="characters"
                           spellcheck="false" placeholder="123456" class="erp-form-input tfa-code-input"
                           aria-describedby="codeHelp">
                    <p id="codeHelp" class="text-xs text-slate-500 mt-1">Telefonunuz yanınızda değilse 8 karakterli
                        yedek kodlardan birini yazabilirsiniz. Her yedek kod bir kez çalışır.</p>
                </div>
                <button type="submit" class="admin-login__submit">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    Doğrula ve Giriş Yap
                </button>
            </form>
            <form th:action="@{/logout}" method="post" class="mt-3 text-center">
                <button type="submit" class="text-xs text-slate-500 underline cursor-pointer">Vazgeç ve giriş ekranına dön</button>
            </form>
        </section>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
