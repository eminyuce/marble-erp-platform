<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Erişim Engellendi | Özerler Mermer ERP</title>
    <link rel="preload" th:href="@{/fonts/inter-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/fonts/inter-latin-ext-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/lucide.min.js}"></script>
</head>
<body class="admin-login-page">
<div class="admin-login">
    <div class="admin-login__shell" style="grid-template-columns: 1fr; max-width: 520px; margin: 0 auto;">
        <section class="admin-login__panel text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-red-50 text-red-600">
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
            <h1 class="admin-login__panel-title">Yetkisiz Erişim (403)</h1>
            <p class="admin-login__panel-sub">Bu sayfayı görüntülemek için gerekli rol ve izinlere sahip değilsiniz.</p>
            <div class="flex items-center justify-center gap-3 mt-6">
                <a th:href="@{/admin/dashboard}" class="admin-login__submit" style="width: auto; padding: 0 18px; text-decoration: none;">Ana Sayfaya Dön</a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 bg-white">Farklı Hesapla Giriş Yap</button>
                </form>
            </div>
        </section>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
