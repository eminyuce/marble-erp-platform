<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Engellendi | Özerler Mermer ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <div class="w-16 h-16 bg-rose-500/10 border border-rose-500/30 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="shield-alert" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Yetkisiz Erişim (403)</h1>
        <p class="text-sm text-slate-400 mb-6">Bu sayfayı veya modülü görüntülemek için gerekli rol ve izinlere sahip değilsiniz. Lütfen sistem yöneticinize danışınız.</p>
        <div class="flex items-center justify-center gap-3">
            <a th:href="@{/}" class="px-4 py-2 bg-amber-700 hover:bg-amber-600 text-white rounded-lg text-sm font-semibold transition">
                Ana Sayfaya Dön
            </a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-semibold transition">
                    Farklı Hesapla Giriş Yap
                </button>
            </form>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
