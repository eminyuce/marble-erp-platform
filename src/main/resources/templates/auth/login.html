<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Özerler Mermer ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-700 text-white rounded-2xl shadow-lg mb-4">
                <i data-lucide="gem" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">ÖZERLER MERMER ERP</h1>
            <p class="text-slate-400 text-sm mt-1">Ocaktan Şantiyeye Uçtan Uca Doğal Taş Karar Destek Platformu</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/90 backdrop-blur border border-slate-700/80 rounded-2xl p-8 shadow-2xl">
            <!-- Messages -->
            <div th:if="${errorMessage}" class="mb-5 p-3.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span th:text="${errorMessage}">Geçersiz kullanıcı adı veya şifre.</span>
            </div>
            <div th:if="${successMessage}" class="mb-5 p-3.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
                <span th:text="${successMessage}">Çıkış yapıldı.</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">E-Posta veya Kullanıcı Adı</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="username" name="username" required autofocus
                               value="admin@example.com"
                               class="w-full pl-9 pr-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
                               placeholder="kullanici@ozerler.com">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-semibold text-slate-300">Şifre</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                               value="changeit"
                               class="w-full pl-9 pr-3 py-2 bg-slate-900/80 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="remember-me" class="rounded bg-slate-900 border-slate-700 text-amber-600 focus:ring-amber-500 w-4 h-4">
                        <span class="text-xs text-slate-400">Beni Hatırla (14 gün)</span>
                    </label>
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white text-sm font-semibold rounded-lg shadow-md hover:shadow-lg transition cursor-pointer flex items-center justify-center gap-2 mt-2">
                    <span>Sisteme Giriş Yap</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Seed Credential Hint -->
            <div class="mt-6 pt-5 border-t border-slate-700/60 text-xs text-slate-400 space-y-1 bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                <div class="font-semibold text-amber-400 flex items-center gap-1.5">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i>
                    <span>Varsayılan Yönetici Girişi:</span>
                </div>
                <div>E-Posta: <code class="text-slate-200 font-mono">admin@example.com</code></div>
                <div>Şifre: <code class="text-slate-200 font-mono">changeit</code></div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
