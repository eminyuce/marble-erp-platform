<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Inline yardım balonu: title + görünür metin -->
<span th:fragment="tip(text, tooltip)"
      class="erp-tip"
      th:attr="title=${tooltip}, aria-label=${tooltip}">
    <i data-lucide="help-circle" aria-hidden="true"></i>
    <span class="sr-only" th:text="${tooltip}">Yardım</span>
</span>

<!-- Ocak blok yaşam döngüsü şeması -->
<div th:fragment="quarryWorkflow" class="erp-workflow" role="img" aria-label="Blok yaşam döngüsü: Üretim Sahası, Stok Sahası, Fabrika veya Satış">
    <div class="erp-workflow-step erp-workflow-step--active">
        <span class="erp-workflow-icon"><i data-lucide="pickaxe"></i></span>
        <div>
            <strong>Üretim Sahası</strong>
            <p>Yeni çıkarılan blok burada kayıt altına alınır.</p>
        </div>
    </div>
    <div class="erp-workflow-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></div>
    <div class="erp-workflow-step">
        <span class="erp-workflow-icon"><i data-lucide="warehouse"></i></span>
        <div>
            <strong>Stok Sahası</strong>
            <p>Sevkiyata hazır bloklar bu sahada bekler.</p>
        </div>
    </div>
    <div class="erp-workflow-arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></div>
    <div class="erp-workflow-branch">
        <div class="erp-workflow-step">
            <span class="erp-workflow-icon"><i data-lucide="factory"></i></span>
            <div>
                <strong>Fabrika</strong>
                <p>Nakliye maliyeti fabrika hesabına yazılır.</p>
            </div>
        </div>
        <span class="erp-workflow-or">veya</span>
        <div class="erp-workflow-step">
            <span class="erp-workflow-icon"><i data-lucide="handshake"></i></span>
            <div>
                <strong>Satış</strong>
                <p>Müşteri bilgisi satış kaydında tutulur.</p>
            </div>
        </div>
    </div>
</div>

<!-- Modül alt sekmeleri -->
<nav th:fragment="moduleTabs(tabsJson, activeId)"
     class="erp-module-tabs"
     role="tablist"
     th:attr="data-tabs=${tabsJson}, data-active=${activeId}">
</nav>

</html>
