<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="shell(grid)" class="erp-data-grid" x-data="erpDataGrid($el)" x-init="init()"
     th:id="${grid.tableId}"
     th:attr="data-page=${grid.number},data-pages=${grid.totalPages},data-frozen=${grid.frozenCount}">
    <div class="erp-data-grid__viewport">
        <table class="erp-data-grid__table">
            <thead>
            <tr>
                <th th:class="${'erp-data-grid__op' + (grid.frozenCount > 0 ? ' is-frozen' : '') + (grid.frozenCount == 1 ? ' is-frozen-last' : '')}">İşlemler</th>
                <th th:each="column, stat : ${grid.columns}"
                    th:class="${(stat.count < grid.frozenCount ? 'is-frozen' : '') + (stat.count == grid.frozenCount - 1 ? ' is-frozen-last' : '')}"
                    th:style="${'min-width:' + column.minWidth + 'px'}">
                    <span class="erp-data-grid__head">
                        <a th:if="${column.sortable}" th:href="${gridLinks.sort(column.key)}" class="erp-data-grid__sort">
                            <span th:text="${column.label}">Kolon</span>
                            <span class="erp-data-grid__sort-mark" th:text="${gridLinks.indicator(column.key)}">↕</span>
                        </a>
                        <span th:unless="${column.sortable}" th:text="${column.label}">Kolon</span>
                        <details th:if="${column.filtered}" class="erp-data-grid__filter">
                            <summary aria-label="Filtre">▾</summary>
                            <div class="erp-data-grid__filter-menu">
                                <a th:each="choice : ${column.filters}"
                                   th:href="${gridLinks.with(column.filterParam, choice.value)}"
                                   th:text="${choice.label}">Tümü</a>
                            </div>
                        </details>
                        <div th:if="${column.headerFilter}" class="erp-data-grid__colfilter"
                             th:classappend="${gridLinks.filtered(column.key)} ? ' is-active'">
                            <button type="button" class="erp-data-grid__colfilter-btn"
                                    aria-haspopup="dialog" aria-expanded="false"
                                    th:attr="aria-label=${'Sütun filtresi: ' + column.label},
                                             data-filter-key=${column.key},
                                             data-filter-operator=${gridLinks.operator(column.key)},
                                             data-filter-value=${gridLinks.value(column.key)},
                                             data-values-url=${gridLinks.filterValues(grid.tableId, column.key)}"
                                    onclick="toggleGridColumnFilter(event, this)">
                                <i data-lucide="filter" class="w-3.5 h-3.5" aria-hidden="true"></i>
                                <span class="sr-only" th:text="${column.label}">Filtre</span>
                            </button>
                            <template class="erp-data-grid__colfilter-tpl">
                                <form method="get" th:action="${gridLinks.path}"
                                      class="erp-data-grid__colfilter-form" role="dialog"
                                      th:attr="aria-label=${column.label + ' filtresi'}">
                                    <th:block th:each="kept : ${gridLinks.hiddenParameters(column.key)}">
                                        <input type="hidden" th:name="${kept.name}" th:value="${kept.value}">
                                    </th:block>
                                    <input type="hidden" name="page" value="1">
                                    <label class="erp-data-grid__colfilter-label">Operatör
                                        <select th:name="${'co.' + column.key}">
                                            <option value="contains"
                                                    th:selected="${gridLinks.operator(column.key) == 'contains'}">İçerir</option>
                                            <option value="equals"
                                                    th:selected="${gridLinks.operator(column.key) == 'equals'}">Eşittir</option>
                                            <option value="starts"
                                                    th:selected="${gridLinks.operator(column.key) == 'starts'}">İle Başlar</option>
                                            <option value="not_contains"
                                                    th:selected="${gridLinks.operator(column.key) == 'not_contains'}">İçermez</option>
                                        </select>
                                    </label>
                                    <label class="erp-data-grid__colfilter-label">Değer
                                        <input type="search" th:name="${'cf.' + column.key}"
                                               th:value="${gridLinks.value(column.key)}"
                                               autocomplete="off">
                                    </label>
                                    <div class="erp-data-grid__colfilter-values" role="listbox"
                                         aria-label="Değerler" tabindex="0"></div>
                                    <div class="erp-data-grid__colfilter-actions">
                                        <button type="submit">Uygula</button>
                                        <a th:href="${gridLinks.clearFilter(column.key)}">Temizle</a>
                                    </div>
                                </form>
                            </template>
                        </div>
                    </span>
                </th>
            </tr>
            </thead>
            <tbody @click="selectRow($event)">
            <tr th:if="${grid.rows.isEmpty()}">
                <td class="erp-data-grid__empty" th:attr="colspan=${grid.columns.size() + 1}">Kayıt bulunamadı.</td>
            </tr>
            <tr th:each="row : ${grid.rows}">
                <td th:class="${'erp-data-grid__op' + (grid.frozenCount > 0 ? ' is-frozen' : '') + (grid.frozenCount == 1 ? ' is-frozen-last' : '')}">
                    <div class="grid-actions" th:if="${row.actionable}">
                        <button type="button" class="grid-actions-btn"
                                onclick="toggleGridActions(event, this)"
                                aria-haspopup="menu" aria-expanded="false" aria-label="İşlemler">
                            <i data-lucide="settings" class="w-3.5 h-3.5" aria-hidden="true"></i>
                            <span>İşlemler</span>
                            <i data-lucide="chevron-down" class="w-3 h-3" aria-hidden="true"></i>
                        </button>
                        <template class="grid-actions-tpl">
                            <th:block th:each="action : ${row.actions}">
                                <hr th:if="${action.divider}" class="grid-actions-divider">
                                <a th:if="${action.link}" th:href="${action.href}"
                                   class="grid-actions-item" role="menuitem"
                                   th:classappend="${action.danger} ? ' grid-actions-item--danger'"
                                   th:attr="target=${action.target}">
                                    <i th:attr="data-lucide=${action.icon}" class="w-4 h-4" aria-hidden="true"></i>
                                    <span th:text="${action.label}">İşlem</span>
                                </a>
                                <button th:if="${action.deletable}" type="button" role="menuitem"
                                        class="grid-actions-item grid-actions-item--danger"
                                        th:attr="data-delete-id=${action.deleteId},data-delete-name=${action.deleteName}"
                                        onclick="erpGridDelete(this)">
                                    <i data-lucide="trash-2" class="w-4 h-4" aria-hidden="true"></i>
                                    <span th:text="${action.label}">Sil</span>
                                </button>
                                <button th:if="${action.command}" type="button" role="menuitem"
                                        class="grid-actions-item"
                                        th:classappend="${action.danger} ? ' grid-actions-item--danger'"
                                        th:attr="data-grid-onclick=${action.onclick}"
                                        onclick="invokeGridAction(event, this)">
                                    <i th:attr="data-lucide=${action.icon}" class="w-4 h-4" aria-hidden="true"></i>
                                    <span th:text="${action.label}">İşlem</span>
                                </button>
                            </th:block>
                        </template>
                    </div>
                </td>
                <td th:each="cell, stat : ${row.cells}"
                    th:class="${(stat.count < grid.frozenCount ? 'is-frozen' : '') + (stat.count == grid.frozenCount - 1 ? ' is-frozen-last' : '')}">
                    <span th:if="${cell.empty}" class="erp-data-grid__dash">–</span>
                    <span th:if="${!cell.empty and cell.badge}" class="erp-data-grid__badge" th:text="${cell.text}" th:title="${cell.text}">Onaylı</span>
                    <span th:if="${!cell.empty and cell.chip}" class="erp-data-grid__chip" th:text="${cell.text}" th:title="${cell.text}">#1</span>
                    <span th:if="${!cell.empty and !cell.badge and !cell.chip}" class="erp-data-grid__clip">
                        <a th:if="${cell.linked}" th:href="${cell.href}" class="erp-data-grid__link" th:text="${cell.text}" th:title="${cell.text}">Değer</a>
                        <span th:unless="${cell.linked}" class="erp-data-grid__text" th:text="${cell.text}" th:title="${cell.text}">Değer</span>
                        <a th:if="${cell.subLinked}" th:href="${cell.subHref}" class="erp-data-grid__sub" th:text="${cell.subtext}" th:title="${cell.subtext}">Alt</a>
                        <span th:if="${cell.hasSubtext and !cell.subLinked}" class="erp-data-grid__sub" th:text="${cell.subtext}" th:title="${cell.subtext}">Alt</span>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <footer class="erp-data-grid__footer">
        <div class="erp-data-grid__total">Toplam <strong th:text="${grid.total}">0</strong>
            <a th:if="${gridLinks.hasColumnFilters()}" th:href="${gridLinks.clearFilters()}"
               class="erp-data-grid__clear-filters">Filtreleri temizle</a>
        </div>
        <label class="erp-data-grid__size">
            <select @change="setSize($event)">
                <option value="20" th:selected="${grid.size == 20}">20/sayfa</option>
                <option value="50" th:selected="${grid.size == 50}">50/sayfa</option>
                <option value="100" th:selected="${grid.size == 100}">100/sayfa</option>
            </select>
        </label>
        <nav class="erp-data-grid__pages" aria-label="Sayfalar">
            <a th:href="${gridLinks.page(grid.number - 1)}" th:classappend="${grid.first} ? ' is-disabled'" aria-label="Önceki">&lt;</a>
            <th:block th:each="marker : ${grid.markers}">
                <span th:if="${marker.ellipsis}" class="erp-data-grid__ellipsis">…</span>
                <a th:unless="${marker.ellipsis}"
                   th:href="${gridLinks.page(marker.number)}"
                   th:text="${marker.number}"
                   th:classappend="${marker.current} ? ' is-current'">1</a>
            </th:block>
            <a th:href="${gridLinks.page(grid.number + 1)}" th:classappend="${grid.last} ? ' is-disabled'" aria-label="Sonraki">&gt;</a>
        </nav>
        <form class="erp-data-grid__go" @submit.prevent="go()">
            <label>Git
                <input type="number" min="1" th:max="${grid.totalPages}" x-model="goPage" @keydown.enter.prevent="go()">
            </label>
            <button type="submit">Git</button>
        </form>
    </footer>
</div>
</body>
</html>
