<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="identity(block)" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-800 flex items-center justify-center font-bold text-xl">
                🧱
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h3 class="text-lg font-bold text-slate-900 font-mono" th:text="${block.blockCode}">BLK-2026-00125</h3>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800"
                          th:text="${block.status != null ? block.status.label : 'Üretildi'}">Durum</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5"
                   th:text="${(block.quarry != null ? block.quarry.name : 'Ocak') + ' · ' + (block.stoneType != null ? block.stoneType : 'Doğal Mermer')}">Ocak ve Taş Cinsi</p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <span th:if="${block.currentLocation != null}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-50 text-sky-800 border border-sky-200">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-600"></i>
                <span th:text="'Mevcut saha: ' + ${block.currentLocation.name}">Depolama Sahası</span>
            </span>
            <span th:if="${block.qualityGrade != null}" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-800 border border-slate-200"
                  th:text="'Kalite: ' + ${block.qualityGrade.label}">Kalite Sınıfı</span>
        </div>
    </div>

    <dl class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-4 text-sm">
        <div class="bg-slate-50/70 p-3 rounded-xl border border-slate-100">
            <dt class="text-xs font-semibold text-slate-500">Ebatlar (En×Boy×Yük)</dt>
            <dd class="font-bold text-slate-800 mt-1" th:text="${block.widthCm + ' × ' + block.lengthCm + ' × ' + block.heightCm + ' cm'}">—</dd>
        </div>
        <div class="bg-slate-50/70 p-3 rounded-xl border border-slate-100">
            <dt class="text-xs font-semibold text-slate-500">Hacim</dt>
            <dd class="font-bold text-slate-800 mt-1" th:text="${block.volumeM3 + ' m³'}">—</dd>
        </div>
        <div class="bg-slate-50/70 p-3 rounded-xl border border-slate-100">
            <dt class="text-xs font-semibold text-slate-500">Yaklaşık / Fiili Tonaj</dt>
            <dd class="font-bold text-slate-800 mt-1"
                th:text="${(block.actualWeightKg != null and block.actualWeightKg > 0) ? (block.approximateTonnage + ' / ' + block.actualTonnage + ' t') : (block.approximateTonnage + ' t')}">—</dd>
        </div>
        <div class="bg-slate-50/70 p-3 rounded-xl border border-slate-100">
            <dt class="text-xs font-semibold text-slate-500">Yaklaşık Tonaj</dt>
            <dd class="font-bold text-slate-800 mt-1" th:text="${block.approximateTonnage + ' ton'}">—</dd>
        </div>
        <div class="col-span-2 sm:col-span-4 lg:col-span-1 bg-slate-50/70 p-3 rounded-xl border border-slate-100">
            <dt class="text-xs font-semibold text-slate-500">Renk / Seleksiyon</dt>
            <dd class="font-medium text-slate-700 mt-1 truncate" th:text="${!#strings.isEmpty(block.colorTone) ? block.colorTone : 'Standart'}">—</dd>
        </div>
    </dl>
</div>

</html>
