<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="breadcrumb(current)" class="admin-breadcrumb" aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a th:href="@{/admin/dashboard}">
                <i data-lucide="home"></i>
                <span>Yönetim Ana Sayfa</span>
            </a>
        </li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${current}">Sayfa</li>
    </ol>
</nav>

<nav th:fragment="breadcrumbTrail(parent, parentHref, current)" class="admin-breadcrumb" aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a th:href="@{/admin/dashboard}">
                <i data-lucide="home"></i>
                <span>Yönetim Ana Sayfa</span>
            </a>
        </li>
        <li class="breadcrumb-item">
            <a th:href="@{${parentHref}}" th:text="${parent}">Üst sayfa</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${current}">Sayfa</li>
    </ol>
</nav>

<form th:fragment="search(placeholder, inputId)" class="erp-search-form" role="search" onsubmit="return false;">
    <div class="erp-search-field">
        <span class="erp-search-icon" aria-hidden="true">
            <i data-lucide="search"></i>
        </span>
        <label class="sr-only" th:for="${inputId}">Ara</label>
        <input type="search"
               class="erp-search-input"
               th:id="${inputId}"
               th:placeholder="${placeholder}"
               autocomplete="off"
               spellcheck="false">
        <div class="erp-search-actions">
            <button type="submit" class="erp-btn-primary erp-search-btn" title="Ara" aria-label="Ara">
                <i data-lucide="search" aria-hidden="true"></i>
                <span class="sr-only">Arama</span>
            </button>
        </div>
    </div>
</form>

<div th:fragment="exportDropdown(tableId, entityName)"
     class="relative"
     x-data="{ exportOpen: false }"
     th:attr="data-export-table=${tableId}, data-export-entity=${entityName}">
    <button @click="exportOpen = !exportOpen" type="button" class="erp-btn-secondary">
        <i data-lucide="download"></i>
        <span>Dışa Aktar</span>
        <i data-lucide="chevron-down" class="w-3 h-3"></i>
    </button>
    <div x-show="exportOpen" @click.outside="exportOpen = false" x-transition
         class="absolute right-0 mt-1 w-52 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50"
         style="display:none;">
        <button @click="downloadTable($root.dataset.exportTable, $root.dataset.exportEntity, 'csv'); exportOpen = false"
                type="button"
                class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
            <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
            <span><strong>CSV</strong> <span class="text-slate-400">(.csv)</span></span>
        </button>
        <button @click="downloadTable($root.dataset.exportTable, $root.dataset.exportEntity, 'xlsx'); exportOpen = false"
                type="button"
                class="w-full px-3 py-2 text-left text-xs hover:bg-slate-50 flex items-center gap-2.5 cursor-pointer">
            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i>
            <span><strong>Excel</strong> <span class="text-slate-400">(.xlsx)</span></span>
        </button>
    </div>
</div>

<div th:fragment="gridShell(tableId)" class="erp-grid-shell">
    <div class="erp-grid-count">
        <div class="erp-grid-count-inner">
            <span class="erp-grid-count-badge" th:attr="data-grid-total=${tableId}">0</span>
            <span class="erp-grid-count-label">Toplam Kayıt</span>
        </div>
    </div>
    <div th:id="${tableId}"></div>
</div>

</html>
