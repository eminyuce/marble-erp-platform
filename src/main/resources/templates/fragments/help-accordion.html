<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable help accordion fragment — collapsed by default.
     Usage: <div th:replace="~{fragments/help-accordion :: help(items=${ {'Line 1','Line 2'} })}"></div> -->
<div th:fragment="help(items)" x-data="{ helpOpen: false }" class="mb-4">
    <button @click="helpOpen = !helpOpen"
            class="w-full flex items-center gap-2 px-4 py-3 bg-sky-50 hover:bg-sky-100 border border-sky-200 rounded-xl text-left transition cursor-pointer"
            :class="{ 'rounded-b-none border-b-0': helpOpen }">
        <i data-lucide="circle-help" class="w-5 h-5 text-sky-600 flex-shrink-0"></i>
        <span class="text-sm font-bold text-sky-800">Nasıl kullanılır?</span>
        <small class="text-xs text-sky-600">(açmak / kapatmak için tıklayın)</small>
        <i data-lucide="chevron-down" class="w-4 h-4 text-sky-500 ml-auto transition-transform duration-200" :class="{ 'rotate-180': helpOpen }"></i>
    </button>
    <div x-show="helpOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
         class="px-5 py-4 bg-white border border-sky-200 border-t-0 rounded-b-xl text-xs text-slate-700 leading-relaxed space-y-1.5">
        <ul class="list-disc list-inside space-y-1">
            <li th:each="item : ${items}" th:utext="${item}"></li>
        </ul>
    </div>
</div>

</body>
</html>
