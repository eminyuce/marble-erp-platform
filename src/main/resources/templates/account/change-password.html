<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Şifre Değiştir | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-form-page" x-data="changePasswordForm()">

    <div th:replace="~{fragments/help-accordion :: help(items=${ {'Bu sayfadan şifrenizi değiştirebilirsiniz.', 'Önce mevcut şifrenizi, ardından yeni şifrenizi ve onayını girin.', 'Yeni şifre en az <strong>6 karakter</strong> olmalı; <strong>büyük harf</strong>, <strong>küçük harf</strong> ve <strong>sayı</strong> içermelidir.', 'Şifrenizi değiştirdikten sonra bir sonraki girişte yeni şifrenizi kullanmanız gerekecektir.'} })}"></div>

    <div th:replace="~{fragments/form-page :: breadcrumb('Hesabım', @{/admin/dashboard}, 'Şifre değiştir')}"></div>
    <div th:replace="~{fragments/form-page :: heading(
        'Şifre değiştir',
        'Mevcut şifrenizi doğrulayıp yeni bir şifre belirleyin.',
        ${userEmail},
        @{/admin/dashboard})}"></div>

    <div class="erp-form-card">
        <form id="changePasswordForm" th:action="@{/account/change-password}" method="post"
              th:object="${passwordForm}" class="erp-form">

            <div class="erp-form-body">
                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Mevcut şifre', 'Kimliğinizi doğrulamak için')}"></div>
                    <div class="erp-form-field">
                        <label class="erp-form-label" for="currentPassword">Şimdiki şifre <span
                                class="req">*</span></label>
                        <div class="relative">
                            <input :type="showCurrent ? 'text' : 'password'" th:field="*{currentPassword}"
                                   id="currentPassword"
                                   placeholder="Mevcut şifreniz"
                                   class="erp-form-input pr-10"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                            <button type="button" @click="showCurrent = !showCurrent"
                                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i x-show="!showCurrent" data-lucide="eye" class="w-4 h-4"></i>
                                <i x-show="showCurrent" data-lucide="eye-off" class="w-4 h-4" style="display:none;"></i>
                            </button>
                        </div>
                        <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"
                           class="erp-form-field-error"></p>
                    </div>
                </section>

                <section class="erp-form-section">
                    <div th:replace="~{fragments/form-page :: section('Yeni şifre', 'En az 6 karakter; büyük harf, küçük harf ve sayı')}"></div>
                    <div class="erp-form-grid">
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="newPassword">Yeni şifre <span
                                    class="req">*</span></label>
                            <div class="relative">
                                <input :type="showNew ? 'text' : 'password'" th:field="*{newPassword}" id="newPassword"
                                       placeholder="Yeni şifreniz"
                                       class="erp-form-input pr-10"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                                <button type="button" @click="showNew = !showNew"
                                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                                    <i x-show="!showNew" data-lucide="eye" class="w-4 h-4"></i>
                                    <i x-show="showNew" data-lucide="eye-off" class="w-4 h-4" style="display:none;"></i>
                                </button>
                            </div>
                            <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
                               class="erp-form-field-error"></p>
                        </div>
                        <div class="erp-form-field">
                            <label class="erp-form-label" for="confirmPassword">Yeni şifreyi onayla <span
                                    class="req">*</span></label>
                            <div class="relative">
                                <input :type="showConfirm ? 'text' : 'password'" th:field="*{confirmPassword}"
                                       id="confirmPassword"
                                       placeholder="Yeni şifrenizi tekrar girin"
                                       class="erp-form-input pr-10"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                                <button type="button" @click="showConfirm = !showConfirm"
                                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                                    <i x-show="!showConfirm" data-lucide="eye" class="w-4 h-4"></i>
                                    <i x-show="showConfirm" data-lucide="eye-off" class="w-4 h-4"
                                       style="display:none;"></i>
                                </button>
                            </div>
                            <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                               class="erp-form-field-error"></p>
                        </div>
                    </div>
                </section>
            </div>

            <div th:replace="~{fragments/form-page :: actions(@{/admin/dashboard})}"></div>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function changePasswordForm() {
            return {
                showCurrent: false,
                showNew: false,
                showConfirm: false
            };
        }
    </script>
</th:block>
</body>
</html>
