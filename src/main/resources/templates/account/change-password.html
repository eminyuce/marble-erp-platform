<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Şifre Değiştir | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page">

    <div th:replace="~{fragments/help-accordion :: help(items=${ {'Bu sayfadan şifrenizi değiştirebilirsiniz.', 'Önce mevcut şifrenizi, ardından yeni şifrenizi ve onayını girin.', 'Yeni şifre en az <strong>6 karakter</strong> olmalı; <strong>büyük harf</strong>, <strong>küçük harf</strong> ve <strong>sayı</strong> içermelidir.', 'Şifrenizi değiştirdikten sonra bir sonraki girişte yeni şifrenizi kullanmanız gerekecektir.'} })}"></div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="lock" class="w-5 h-5 text-slate-500"></i>
                Şifre Değiştirme Formu
            </h2>
            <button type="submit" form="changePasswordForm" class="erp-btn-primary">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Şifre değiştir</span>
            </button>
        </div>

        <!-- Form -->
        <form id="changePasswordForm" th:action="@{/account/change-password}" method="post"
              th:object="${passwordForm}" class="px-6 py-6 space-y-5" x-data="changePasswordForm()">

            <!-- Email (read-only) -->
            <div class="grid grid-cols-1 sm:grid-cols-4 items-center gap-2">
                <label class="text-sm font-semibold text-slate-700 sm:col-span-1">E-posta</label>
                <div class="sm:col-span-3">
                    <div class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 font-medium" th:text="${userEmail}">user@example.com</div>
                </div>
            </div>

            <!-- Current Password -->
            <div class="grid grid-cols-1 sm:grid-cols-4 items-start gap-2">
                <label for="currentPassword" class="text-sm font-semibold text-slate-700 sm:col-span-1 pt-2">
                    Şimdiki Şifre <span class="text-rose-500">*</span>
                </label>
                <div class="sm:col-span-3">
                    <div class="relative">
                        <input :type="showCurrent ? 'text' : 'password'" th:field="*{currentPassword}" id="currentPassword"
                               placeholder="Mevcut Şifreniz"
                               class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 transition pr-10"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-white'">
                        <button type="button" @click="showCurrent = !showCurrent"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                            <i x-show="!showCurrent" data-lucide="eye" class="w-4 h-4"></i>
                            <i x-show="showCurrent" data-lucide="eye-off" class="w-4 h-4" style="display:none;"></i>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-1 text-xs text-rose-600 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                    </p>
                </div>
            </div>

            <!-- New Password -->
            <div class="grid grid-cols-1 sm:grid-cols-4 items-start gap-2">
                <label for="newPassword" class="text-sm font-semibold text-slate-700 sm:col-span-1 pt-2">
                    Yeni Şifre <span class="text-rose-500">*</span>
                </label>
                <div class="sm:col-span-3">
                    <div class="relative">
                        <input :type="showNew ? 'text' : 'password'" th:field="*{newPassword}" id="newPassword"
                               placeholder="Yeni Şifreniz"
                               class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 transition pr-10"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-white'">
                        <button type="button" @click="showNew = !showNew"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                            <i x-show="!showNew" data-lucide="eye" class="w-4 h-4"></i>
                            <i x-show="showNew" data-lucide="eye-off" class="w-4 h-4" style="display:none;"></i>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 text-xs text-rose-600 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                    </p>
                    <p th:unless="${#fields.hasErrors('newPassword')}" class="mt-1 text-xs text-slate-400 flex items-center gap-1">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                        Şifre en az 6 karakterden oluşmalı; büyük harf, küçük harf ve sayı içermelidir.
                    </p>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="grid grid-cols-1 sm:grid-cols-4 items-start gap-2">
                <label for="confirmPassword" class="text-sm font-semibold text-slate-700 sm:col-span-1 pt-2">
                    Yeni şifreyi onayla <span class="text-rose-500">*</span>
                </label>
                <div class="sm:col-span-3">
                    <div class="relative">
                        <input :type="showConfirm ? 'text' : 'password'" th:field="*{confirmPassword}" id="confirmPassword"
                               placeholder="Yeni Şifrenizi Tekrar Girin"
                               class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 transition pr-10"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-white'">
                        <button type="button" @click="showConfirm = !showConfirm"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 cursor-pointer">
                            <i x-show="!showConfirm" data-lucide="eye" class="w-4 h-4"></i>
                            <i x-show="showConfirm" data-lucide="eye-off" class="w-4 h-4" style="display:none;"></i>
                        </button>
                    </div>
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-xs text-rose-600 flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                    </p>
                </div>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
function changePasswordForm() {
    return {
        showCurrent: false,
        showNew: false,
        showConfirm: false
    };
}
</script>
</th:block>
</body>
</html>
