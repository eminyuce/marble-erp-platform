<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Atölye — Ebatlı Stok Sahası | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     th:data-initial-customer-id="${selectedCustomerId != null ? selectedCustomerId : ''}"
     th:data-initial-general-stock="${generalStockOnly ? 'true' : ''}"
     th:data-initial-customer-only="${customerOnly ? 'true' : ''}"
     x-data="{
        selectedCustomerId: $el.dataset.initialCustomerId || '',
        generalStockFilter: $el.dataset.initialGeneralStock || '',
        customerOnlyFilter: $el.dataset.initialCustomerOnly || '',
        resetFilters() {
            this.selectedCustomerId = '';
            this.generalStockFilter = '';
            this.customerOnlyFilter = '';
            if (typeof reloadWorkshopSizedGrid === 'function') reloadWorkshopSizedGrid();
        },
        setGeneralStock(val) {
            this.generalStockFilter = val;
            if (val === 'true') {
                this.customerOnlyFilter = '';
                this.selectedCustomerId = '';
            }
            if (typeof reloadWorkshopSizedGrid === 'function') reloadWorkshopSizedGrid();
        },
        setCustomerOnly(val) {
            this.customerOnlyFilter = val;
            if (val === 'true') {
                this.generalStockFilter = '';
            }
            if (typeof reloadWorkshopSizedGrid === 'function') reloadWorkshopSizedGrid();
        },
        onCustomerChange(val) {
            this.selectedCustomerId = val;
            if (val) {
                this.generalStockFilter = '';
                this.customerOnlyFilter = '';
            }
            if (typeof reloadWorkshopSizedGrid === 'function') reloadWorkshopSizedGrid();
        },
        gridExtraQuery() {
            let q = '';
            if (this.selectedCustomerId) q += '&customerId=' + encodeURIComponent(this.selectedCustomerId);
            if (this.generalStockFilter === 'true') q += '&generalStockOnly=true';
            if (this.customerOnlyFilter === 'true') q += '&customerOnly=true';
            return q;
        }
     }"
     x-init="window.workshopSizedPageState = $data">

    <!-- Header & Breadcrumb -->
    <div class="erp-list-header flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Operasyon', '/operations/workshop', 'Atölye — Ebatlı Stok Sahası')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-7 h-7 text-emerald-600 inline-block"></i>
                <span>Atölye — Ebatlı Stok Sahası</span>
            </h2>
            <p class="erp-list-lead">
                Atölye ve fabrika ebatlama işlemleri sonucunda üretilen ebatlı ürünlerin m², adet, müşteri ve stok takibi.
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <a th:href="@{/work-orders/create(department='WORKSHOP')}" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni Atölye Siparişi</span>
            </a>
        </div>
    </div>

    <!-- Sub-Navigation Bar for Workshop -->
    <div class="flex items-center gap-2 border-b border-slate-200 pb-3 overflow-x-auto">
        <a th:href="@{/operations/workshop}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="hammer" class="w-4 h-4 text-purple-600"></i>
            <span>Siparişler &amp; İş Emirleri</span>
        </a>
        <a th:href="@{/operations/workshop/slabs}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i>
            <span>Plaka Stok Sahası</span>
        </a>
        <a th:href="@{/operations/workshop/sized}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-emerald-600 text-white shadow-xs">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>Ebatlı Stok Sahası</span>
        </a>
        <a th:href="@{/operations/workshop/pallets}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="package" class="w-4 h-4 text-amber-600"></i>
            <span>Paletler &amp; Sevkiyat</span>
        </a>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="generalStockFilter === '' && customerOnlyFilter === '' && selectedCustomerId === '' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="resetFilters()">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm Ebatlı Ürünler</div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${totalItemsCount != null ? totalItemsCount : 0}">0</span> kalem
            </div>
            <div class="text-xs text-slate-500 mt-0.5" th:text="${totalStockM2 != null ? #numbers.formatDecimal(totalStockM2, 1, 'POINT', 2, 'COMMA') + ' m²' : '0 m²'}">0 m²</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="generalStockFilter === 'true' ? 'erp-summary-card--active ring-2 ring-blue-500' : ''"
                @click="setGeneralStock('true')">
            <div class="text-[11px] uppercase tracking-wide text-blue-600 font-semibold flex items-center gap-1">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i> Genel Stok (Serbest)
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Müşterisiz</div>
            <div class="text-xs text-slate-500 mt-0.5">Projeye bağlanmamış stok</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="customerOnlyFilter === 'true' || selectedCustomerId !== '' ? 'erp-summary-card--active ring-2 ring-indigo-500' : ''"
                @click="setCustomerOnly('true')">
            <div class="text-[11px] uppercase tracking-wide text-indigo-600 font-semibold flex items-center gap-1">
                <i data-lucide="user-check" class="w-3.5 h-3.5"></i> Proje / Müşteri Bağlantılı
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Rezerve Ürünler</div>
            <div class="text-xs text-slate-500 mt-0.5">Sipariş / şantiye için ayrılmış</div>
        </button>
    </div>

    <!-- Operational Filter Chips & Customer Select -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="erp-yard-filters">
            <button type="button" class="erp-yard-chip"
                    :class="generalStockFilter === '' && customerOnlyFilter === '' && selectedCustomerId === '' ? 'erp-yard-chip--active' : ''"
                    @click="resetFilters()">Tüm Ürünler</button>
            <button type="button" class="erp-yard-chip"
                    :class="generalStockFilter === 'true' ? 'erp-yard-chip--active' : ''"
                    @click="setGeneralStock('true')">
                <i data-lucide="globe" class="w-3.5 h-3.5 inline mr-1"></i>
                Genel Stok
            </button>
            <button type="button" class="erp-yard-chip"
                    :class="customerOnlyFilter === 'true' ? 'erp-yard-chip--active' : ''"
                    @click="setCustomerOnly('true')">
                <i data-lucide="user-check" class="w-3.5 h-3.5 inline mr-1"></i>
                Müşteri / Proje Rezerve
            </button>
        </div>

        <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-slate-600 flex items-center gap-1 whitespace-nowrap">
                <i data-lucide="filter" class="w-3.5 h-3.5 text-emerald-600"></i>
                <span>Cari / Müşteri:</span>
            </label>
            <select class="px-3 py-1.5 bg-white border border-slate-300 rounded-xl text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                    x-model="selectedCustomerId"
                    @change="onCustomerChange($event.target.value)">
                <option value="">Tüm Müşteriler</option>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.companyName}"></option>
            </select>
        </div>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Stok kodu, taş türü, ebat veya müşteri...', 'workshop-sized-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('workshop-sized-table', 'atolye-ebatli-stogu')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('workshop-sized-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let workshopSizedTable;
        document.addEventListener("DOMContentLoaded", () => {
            workshopSizedTable = new Tabulator("#workshop-sized-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [10, 25, 50, 100],
                ajaxURL: "/operations/workshop/sized/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "workshop-sized-search-input", function () {
                        return window.workshopSizedPageState ? window.workshopSizedPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("workshop-sized-table", response);
                },
                placeholder: "Kriterlere uygun ebatlı ürün kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Stok Kodu",
                        field: "itemCode",
                        width: 140,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-black text-emerald-700">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Kaynak Blok",
                        field: "sourceBlockCode",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Taş Türü & Tanım",
                        field: "description",
                        minWidth: 180,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-bold text-slate-900">${gridText(row.description || row.stoneType)}</div>
                                <div class="text-[11px] text-slate-500">${gridText(row.stoneType)} · ${gridText(row.surfaceFinish)}</div>
                            </div>`;
                        }
                    },
                    {
                        title: "Kalınlık",
                        field: "thicknessCm",
                        width: 90,
                        headerHozAlign: "center",
                        hozAlign: "center",
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-700">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Ölçü",
                        field: "dimensions",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="text-slate-600">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Miktar (M²)",
                        field: "quantity",
                        width: 120,
                        headerHozAlign: "right",
                        hozAlign: "right",
                        formatter: function (cell) {
                            const val = cell.getValue();
                            if (val == null) return `—`;
                            const num = Number(val).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                            return `<span class="font-black text-emerald-700 bg-emerald-50/70 px-2 py-0.5 rounded">${num} m²</span>`;
                        }
                    },
                    {
                        title: "Adet",
                        field: "pieceCount",
                        width: 80,
                        headerHozAlign: "center",
                        hozAlign: "center",
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-800">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Müşteri",
                        field: "customerName",
                        minWidth: 160,
                        formatter: function (cell) {
                            const val = cell.getValue();
                            if (val) {
                                return `<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-blue-100 text-blue-800 border border-blue-200 inline-flex items-center gap-1">
                                    <i data-lucide="user-check" class="w-3 h-3 text-blue-600"></i>
                                    <span>${gridText(val)}</span>
                                </span>`;
                            }
                            return `<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-slate-100 text-slate-700 border border-slate-200 inline-flex items-center gap-1">
                                <i data-lucide="globe" class="w-3 h-3 text-slate-400"></i>
                                <span>Genel Stok</span>
                            </span>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 110,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800">${gridText(cell.getValue())}</span>`;
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(workshopSizedTable);
            bindGridSearch(workshopSizedTable, "workshop-sized-search-input");
            workshopSizedTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadWorkshopSizedGrid() {
            if (workshopSizedTable) workshopSizedTable.setData();
        }
        window.reloadWorkshopSizedGrid = reloadWorkshopSizedGrid;
    </script>
</th:block>
</body>
</html>
