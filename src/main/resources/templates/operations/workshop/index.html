<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>3. Atölye — Operasyon & Siparişler | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     x-data="{
        statusFilter: '[[${selectedStatus != null ? selectedStatus.name() : ''}]]',
        setStatusFilter(st) {
            this.statusFilter = st;
            if (typeof reloadWorkshopOrdersGrid === 'function') reloadWorkshopOrdersGrid();
        },
        gridExtraQuery() {
            return this.statusFilter ? '&status=' + encodeURIComponent(this.statusFilter) : '';
        }
     }"
     x-init="window.workshopOrdersPageState = $data">

    <!-- Header & Breadcrumb -->
    <div class="erp-list-header flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Operasyon', '/operations/workshop', '3. Atölye — Operasyon & Siparişler')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="hammer" class="w-7 h-7 text-purple-600 inline-block"></i>
                <span>Atölye — Operasyon, Siparişler ve İşleme</span>
            </h2>
            <p class="erp-list-lead">
                Atölye üretim siparişleri, özel ebatlama, pah, profil ve yüzey işlemleri. Fabrika plaka veya ebatlı stoğundan hammadde çekerek iş emirlerine bağlayabilirsiniz.
                <span th:replace="~{fragments/erp-ops :: tip('', 'Yeni iş emri oluşturmak için sağdaki butonu kullanabilirsiniz.')}"></span>
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <a th:href="@{/work-orders/create(department='WORKSHOP')}" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni Atölye İş Emri</span>
            </a>
        </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === '' ? 'erp-summary-card--active ring-2 ring-purple-500' : ''"
                @click="setStatusFilter('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm İş Emirleri</div>
            <div class="text-lg font-black text-slate-900 mt-1">Atölye Siparişleri</div>
            <div class="text-xs text-slate-500 mt-0.5">Tüm durumlar</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'NEW' ? 'erp-summary-card--active ring-2 ring-amber-500' : ''"
                @click="setStatusFilter('NEW')">
            <div class="text-[11px] uppercase tracking-wide text-amber-600 font-semibold flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> Yeni Siparişler
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Beklemede</div>
            <div class="text-xs text-slate-500 mt-0.5">İşleme girmeyi bekleyen</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'IN_PRODUCTION' ? 'erp-summary-card--active ring-2 ring-blue-500' : ''"
                @click="setStatusFilter('IN_PRODUCTION')">
            <div class="text-[11px] uppercase tracking-wide text-blue-600 font-semibold flex items-center gap-1">
                <i data-lucide="play" class="w-3.5 h-3.5"></i> İşleniyor
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Atölyede İşlemde</div>
            <div class="text-xs text-slate-500 mt-0.5">Pah / profil / ebatlama</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'COMPLETED' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="setStatusFilter('COMPLETED')">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Tamamlananlar
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Montaj / Sevk</div>
            <div class="text-xs text-slate-500 mt-0.5">Üretimi bitmiş işler</div>
        </button>
    </div>

    <!-- Operational Filter Chips -->
    <div class="erp-yard-filters">
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('')">Tüm Siparişler</button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'NEW' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('NEW')">
            <i data-lucide="clock" class="w-3.5 h-3.5 inline mr-1"></i>
            Yeni
        </button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'IN_PRODUCTION' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('IN_PRODUCTION')">
            <i data-lucide="play" class="w-3.5 h-3.5 inline mr-1"></i>
            İşleniyor
        </button>
        <button type="button" class="erp-yard-chip"
                :class="statusFilter === 'COMPLETED' ? 'erp-yard-chip--active' : ''"
                @click="setStatusFilter('COMPLETED')">
            <i data-lucide="check" class="w-3.5 h-3.5 inline mr-1"></i>
            Tamamlanan
        </button>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <a th:href="@{/work-orders/create(department='WORKSHOP')}" class="erp-btn-primary">
            <i data-lucide="plus"></i>
            <span>Yeni Atölye İş Emri</span>
        </a>
        <div th:replace="~{fragments/list-chrome :: search('İş emri no, müşteri, taş veya sorumlu usta...', 'workshop-orders-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('workshop-orders-table', 'atolye-is-emirleri')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('workshop-orders-table')}"></div>

</div>

<th:block layout:fragment="scripts">
    <script>
        let workshopOrdersTable;
        document.addEventListener("DOMContentLoaded", () => {
            workshopOrdersTable = new Tabulator("#workshop-orders-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [10, 25, 50, 100],
                ajaxURL: "/work-orders/api/data?department=WORKSHOP",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "workshop-orders-search-input", function () {
                        return window.workshopOrdersPageState ? window.workshopOrdersPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("workshop-orders-table", response);
                },
                placeholder: "Atölyeye ait aktif sipariş / iş emri bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "İş Emri No",
                        field: "orderNo",
                        width: 150,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/work-orders/${row.id}" class="font-mono font-bold text-purple-600 hover:text-purple-800 underline">${gridText(cell.getValue())}</a>`;
                        }
                    },
                    {
                        title: "Müşteri / Proje",
                        field: "customerName",
                        minWidth: 160,
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Taş Cinsi",
                        field: "stoneType",
                        width: 140,
                        formatter: function (cell) {
                            return `<span class="font-semibold text-slate-800">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Miktar",
                        field: "quantity",
                        width: 120,
                        headerHozAlign: "right",
                        hozAlign: "right",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            const val = cell.getValue();
                            const num = Number(val || 0).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                            return `<span class="font-black text-slate-900">${num} ${gridText(row.unit || 'm²')}</span>`;
                        }
                    },
                    {
                        title: "Sorumlu Usta",
                        field: "responsiblePerson",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="text-slate-600">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Sipariş Tarihi",
                        field: "orderDate",
                        width: 110,
                        formatter: function (cell) {
                            return `<span class="text-slate-500 whitespace-nowrap">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Termin Tarihi",
                        field: "targetDeliveryDate",
                        width: 110,
                        formatter: function (cell) {
                            return `<span class="font-semibold text-slate-700 whitespace-nowrap">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "status",
                        width: 130,
                        formatter: function (cell) {
                            const val = cell.getValue();
                            const row = cell.getRow().getData();
                            let badgeClass = "bg-amber-100 text-amber-800";
                            if (val === 'IN_PRODUCTION') badgeClass = "bg-blue-100 text-blue-800";
                            else if (val === 'COMPLETED') badgeClass = "bg-emerald-100 text-emerald-800";
                            return `<span class="px-2.5 py-1 text-[11px] font-bold rounded-full ${badgeClass}">${gridText(row.statusLabel || val)}</span>`;
                        }
                    },
                    {
                        title: "İşlem",
                        width: 90,
                        headerSort: false,
                        responsive: 0,
                        headerHozAlign: "center",
                        hozAlign: "center",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/work-orders/${row.id}" class="p-1.5 text-slate-500 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition inline-flex items-center gap-1 font-bold text-xs">
                                <span>Detay</span>
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </a>`;
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(workshopOrdersTable);
            bindGridSearch(workshopOrdersTable, "workshop-orders-search-input");
            workshopOrdersTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadWorkshopOrdersGrid() {
            if (workshopOrdersTable) workshopOrdersTable.setData();
        }
        window.reloadWorkshopOrdersGrid = reloadWorkshopOrdersGrid;
    </script>
</th:block>
</body>
</html>
