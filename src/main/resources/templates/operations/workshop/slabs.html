<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Atölye — Plaka Stok Sahası | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     th:data-initial-status="${selectedStatus != null ? selectedStatus.name() : ''}"
     th:data-initial-customer-id="${selectedCustomerId != null ? selectedCustomerId : ''}"
     th:data-initial-general-stock="${generalStockOnly ? 'true' : ''}"
     x-data="{
        statusFilter: $el.dataset.initialStatus || '',
        selectedCustomerId: $el.dataset.initialCustomerId || '',
        generalStockFilter: $el.dataset.initialGeneralStock || '',
        setStatusFilter(val) {
            this.statusFilter = val;
            if (typeof reloadWorkshopSlabsGrid === 'function') reloadWorkshopSlabsGrid();
        },
        setGeneralStock(val) {
            this.generalStockFilter = val;
            if (typeof reloadWorkshopSlabsGrid === 'function') reloadWorkshopSlabsGrid();
        },
        onCustomerChange(val) {
            this.selectedCustomerId = val;
            if (val) this.generalStockFilter = '';
            if (typeof reloadWorkshopSlabsGrid === 'function') reloadWorkshopSlabsGrid();
        },
        gridExtraQuery() {
            let q = '';
            if (this.statusFilter) q += '&status=' + encodeURIComponent(this.statusFilter);
            if (this.selectedCustomerId) q += '&customerId=' + encodeURIComponent(this.selectedCustomerId);
            if (this.generalStockFilter === 'true') q += '&generalStockOnly=true';
            return q;
        }
     }"
     x-init="window.workshopSlabsPageState = $data">

    <!-- Header & Breadcrumb -->
    <div class="erp-list-header flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumbTrail('Operasyon', '/operations/workshop', 'Atölye — Plaka Stok Sahası')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="layers" class="w-7 h-7 text-indigo-600 inline-block"></i>
                <span>Atölye — Plaka Stok Sahası</span>
            </h2>
            <p class="erp-list-lead">
                Atölyede işlenmeye hazır veya fabrikadan temin edilen plaka stoğu, m² envanteri ve müşteri rezervasyonları.
            </p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <a th:href="@{/work-orders/create(department='WORKSHOP')}" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni Atölye Siparişi</span>
            </a>
        </div>
    </div>

    <!-- Sub-Navigation Bar for Workshop -->
    <div class="flex items-center gap-2 border-b border-slate-200 pb-3 overflow-x-auto">
        <a th:href="@{/operations/workshop}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="hammer" class="w-4 h-4 text-purple-600"></i>
            <span>Siparişler &amp; İş Emirleri</span>
        </a>
        <a th:href="@{/operations/workshop/slabs}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-indigo-600 text-white shadow-xs">
            <i data-lucide="layers" class="w-4 h-4"></i>
            <span>Plaka Stok Sahası</span>
        </a>
        <a th:href="@{/operations/workshop/sized}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="layout-grid" class="w-4 h-4 text-emerald-600"></i>
            <span>Ebatlı Stok Sahası</span>
        </a>
        <a th:href="@{/operations/workshop/pallets}"
           class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition bg-slate-100 text-slate-700 hover:bg-slate-200">
            <i data-lucide="package" class="w-4 h-4 text-amber-600"></i>
            <span>Paletler &amp; Sevkiyat</span>
        </a>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === '' && generalStockFilter === '' ? 'erp-summary-card--active ring-2 ring-indigo-500' : ''"
                @click="setStatusFilter(''); setGeneralStock('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm Plakalar</div>
            <div class="text-lg font-black text-slate-900 mt-1">Plaka Envanteri</div>
            <div class="text-xs text-slate-500 mt-0.5">Mevcut plaka stoğu</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'AVAILABLE' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="setStatusFilter('AVAILABLE')">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Hazır Plakalar
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">
                <span th:text="${totalAvailableCount != null ? totalAvailableCount : 0}">0</span> plaka
            </div>
            <div class="text-xs text-slate-500 mt-0.5" th:text="${totalAvailableM2 != null ? #numbers.formatDecimal(totalAvailableM2, 1, 'POINT', 2, 'COMMA') + ' m²' : '0 m²'}">0 m²</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="statusFilter === 'RESERVED' ? 'erp-summary-card--active ring-2 ring-amber-500' : ''"
                @click="setStatusFilter('RESERVED')">
            <div class="text-[11px] uppercase tracking-wide text-amber-600 font-semibold flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> Rezerve Plakalar
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Müşteriye Ayrılmış</div>
            <div class="text-xs text-slate-500 mt-0.5">Sipariş bağlantılı</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="generalStockFilter === 'true' ? 'erp-summary-card--active ring-2 ring-cyan-500' : ''"
                @click="selectedCustomerId = ''; setGeneralStock('true')">
            <div class="text-[11px] uppercase tracking-wide text-cyan-600 font-semibold flex items-center gap-1">
                <i data-lucide="globe" class="w-3.5 h-3.5"></i> Genel Stok
            </div>
            <div class="text-lg font-black text-slate-900 mt-1">Müşterisiz</div>
            <div class="text-xs text-slate-500 mt-0.5">Serbest plaka stoğu</div>
        </button>
    </div>

    <!-- Operational Filter Chips & Customer Select -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="erp-yard-filters">
            <button type="button" class="erp-yard-chip"
                    :class="statusFilter === '' && generalStockFilter === '' ? 'erp-yard-chip--active' : ''"
                    @click="setStatusFilter(''); setGeneralStock('')">Tüm Plakalar</button>
            <button type="button" class="erp-yard-chip"
                    :class="statusFilter === 'AVAILABLE' ? 'erp-yard-chip--active' : ''"
                    @click="setStatusFilter('AVAILABLE')">
                <i data-lucide="check" class="w-3.5 h-3.5 inline mr-1"></i>
                Hazır
            </button>
            <button type="button" class="erp-yard-chip"
                    :class="statusFilter === 'RESERVED' ? 'erp-yard-chip--active' : ''"
                    @click="setStatusFilter('RESERVED')">
                <i data-lucide="bookmark" class="w-3.5 h-3.5 inline mr-1"></i>
                Rezerve
            </button>
            <button type="button" class="erp-yard-chip"
                    :class="generalStockFilter === 'true' ? 'erp-yard-chip--active' : ''"
                    @click="selectedCustomerId = ''; setGeneralStock('true')">
                <i data-lucide="globe" class="w-3.5 h-3.5 inline mr-1"></i>
                Genel Stok
            </button>
        </div>

        <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-slate-600 flex items-center gap-1 whitespace-nowrap">
                <i data-lucide="filter" class="w-3.5 h-3.5 text-indigo-600"></i>
                <span>Cari / Müşteri:</span>
            </label>
            <select class="px-3 py-1.5 bg-white border border-slate-300 rounded-xl text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    x-model="selectedCustomerId"
                    @change="onCustomerChange($event.target.value)">
                <option value="">Tüm Müşteriler</option>
                <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.companyName}"></option>
            </select>
        </div>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <div th:replace="~{fragments/list-chrome :: search('Plaka no, blok, taş türü veya müşteri...', 'workshop-slab-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('workshop-slabs-table', 'atolye-plaka-stogu')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('workshop-slabs-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let workshopSlabsTable;
        document.addEventListener("DOMContentLoaded", () => {
            workshopSlabsTable = new Tabulator("#workshop-slabs-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [10, 25, 50, 100],
                ajaxURL: "/operations/workshop/slabs/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "workshop-slab-search-input", function () {
                        return window.workshopSlabsPageState ? window.workshopSlabsPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("workshop-slabs-table", response);
                },
                placeholder: "Kriterlere uygun plaka kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Plaka No",
                        field: "slabCode",
                        width: 140,
                        responsive: 0,
                        formatter: function (cell) {
                            return `<span class="font-mono font-black text-indigo-600">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Kaynak Blok",
                        field: "sourceBlockCode",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-900">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Taş Türü",
                        field: "stoneType",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="font-semibold text-slate-800">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Kalite / Yüzey",
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<div class="text-xs">
                                <span class="font-bold text-slate-900">${gridText(row.qualityGrade)}</span>
                                <span class="text-slate-400">/</span>
                                <span class="text-slate-600">${gridText(row.surfaceFinish)}</span>
                            </div>`;
                        }
                    },
                    {
                        title: "Kalınlık",
                        field: "thicknessCm",
                        width: 90,
                        headerHozAlign: "center",
                        hozAlign: "center",
                        formatter: function (cell) {
                            return `<span class="font-bold text-slate-700">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Ölçü (En×Boy)",
                        field: "dimensions",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="text-slate-600">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "M²",
                        field: "surfaceAreaM2",
                        width: 110,
                        headerHozAlign: "right",
                        hozAlign: "right",
                        formatter: function (cell) {
                            const val = cell.getValue();
                            if (val == null) return "—";
                            return `<span class="font-black text-emerald-700">${Number(val).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} m²</span>`;
                        }
                    },
                    {
                        title: "Müşteri Durumu",
                        field: "customerName",
                        minWidth: 160,
                        formatter: function (cell) {
                            const val = cell.getValue();
                            if (val) {
                                return `<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-blue-100 text-blue-800 border border-blue-200 inline-flex items-center gap-1">
                                    <i data-lucide="user-check" class="w-3 h-3 text-blue-600"></i>
                                    <span>${gridText(val)}</span>
                                </span>`;
                            }
                            return `<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-slate-100 text-slate-700 border border-slate-200 inline-flex items-center gap-1">
                                <i data-lucide="globe" class="w-3 h-3 text-slate-400"></i>
                                <span>Genel Stok</span>
                            </span>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 110,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            if (row.status === "AVAILABLE") {
                                return `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800">Hazır</span>`;
                            } else if (row.status === "RESERVED") {
                                return `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-100 text-amber-800">Rezerve</span>`;
                            }
                            return `<span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-slate-100 text-slate-700">${gridText(cell.getValue())}</span>`;
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(workshopSlabsTable);
            bindGridSearch(workshopSlabsTable, "workshop-slab-search-input");
            workshopSlabsTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadWorkshopSlabsGrid() {
            if (workshopSlabsTable) workshopSlabsTable.setData();
        }
        window.reloadWorkshopSlabsGrid = reloadWorkshopSlabsGrid;
    </script>
</th:block>
</body>
</html>
