<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Faturalar — Alış &amp; Satış | Özerler Mermer ERP</title>
</head>
<body>
<div layout:fragment="content" class="erp-list-page space-y-5"
     th:data-initial-type="${selectedType}"
     th:data-initial-dept="${selectedDepartment}"
     th:data-initial-status="${selectedStatus}"
     x-data="{
        typeFilter: $el.dataset.initialType || '',
        deptFilter: $el.dataset.initialDept || '',
        statusFilter: $el.dataset.initialStatus || '',
        setTypeFilter(t) {
            this.typeFilter = t;
            if (typeof reloadInvoicesGrid === 'function') reloadInvoicesGrid();
        },
        setDeptFilter(d) {
            this.deptFilter = d;
            if (typeof reloadInvoicesGrid === 'function') reloadInvoicesGrid();
        },
        gridExtraQuery() {
            let q = '';
            if (this.typeFilter) q += '&type=' + encodeURIComponent(this.typeFilter);
            if (this.deptFilter) q += '&department=' + encodeURIComponent(this.deptFilter);
            if (this.statusFilter) q += '&status=' + encodeURIComponent(this.statusFilter);
            return q;
        }
     }"
     x-init="window.invoicesPageState = $data">

    <!-- Header Section -->
    <div class="erp-list-header">
        <div class="erp-list-header-main">
            <div th:replace="~{fragments/list-chrome :: breadcrumb('Fatura Modülü')}"></div>
            <h2 class="admin-page-title flex items-center gap-2">
                <i data-lucide="receipt" class="w-7 h-7 text-emerald-600 inline-block"></i>
                <span>Fatura Modülü — Alış &amp; Satış Faturaları</span>
            </h2>
            <p class="erp-list-lead">
                Ocak, Fabrika, Atölye ve Şantiye departmanlarına ait alış ve satış faturaları, cari hesaplar ve tutar takibi.
                <span th:replace="~{fragments/erp-ops :: tip('', 'Ocaktan fabrikaya veya müşteriye gönderilen ürünler ile fabrika/atölye üretimleri doğrudan fatura ile bağlanabilir.')}"></span>
            </p>
        </div>
    </div>

    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="typeFilter === '' ? 'erp-summary-card--active ring-2 ring-slate-900' : ''"
                @click="setTypeFilter('')">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold">Tüm Faturalar</div>
            <div class="text-lg font-black text-slate-900 mt-1 flex items-center gap-1.5">
                <i data-lucide="receipt" class="w-4 h-4 text-slate-500"></i>
                <span>Genel Liste</span>
            </div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="typeFilter === 'SALES' ? 'erp-summary-card--active ring-2 ring-emerald-500' : ''"
                @click="setTypeFilter('SALES')">
            <div class="text-[11px] uppercase tracking-wide text-emerald-600 font-semibold flex items-center gap-1">
                <i data-lucide="badge-dollar-sign" class="w-3.5 h-3.5"></i> Bu Ay Satış (Ciro)
            </div>
            <div class="text-lg font-black text-emerald-700 mt-1 font-mono"
                 th:text="${monthlySales != null ? #numbers.formatDecimal(monthlySales, 1, 'POINT', 2, 'COMMA') + ' ₺' : '0,00 ₺'}">0,00 ₺</div>
        </button>

        <button type="button" class="erp-summary-card bg-white rounded-xl border border-slate-200 p-4 text-left cursor-pointer transition-all hover:border-slate-300"
                :class="typeFilter === 'PURCHASE' ? 'erp-summary-card--active ring-2 ring-blue-500' : ''"
                @click="setTypeFilter('PURCHASE')">
            <div class="text-[11px] uppercase tracking-wide text-blue-600 font-semibold flex items-center gap-1">
                <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> Bu Ay Alış (Maliyet)
            </div>
            <div class="text-lg font-black text-blue-700 mt-1 font-mono"
                 th:text="${monthlyPurchase != null ? #numbers.formatDecimal(monthlyPurchase, 1, 'POINT', 2, 'COMMA') + ' ₺' : '0,00 ₺'}">0,00 ₺</div>
        </button>

        <div class="bg-white rounded-xl border border-slate-200 p-4">
            <div class="text-[11px] uppercase tracking-wide text-slate-500 font-semibold flex items-center gap-1">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-teal-600"></i> Fatura Standartı
            </div>
            <div class="text-sm font-black text-slate-800 mt-1">E-Fatura / Arşiv Uyumlu</div>
            <div class="text-[11px] text-slate-500 mt-0.5">Departman bazlı net tutar</div>
        </div>
    </div>

    <!-- Operational Filter Chips -->
    <div class="erp-yard-filters">
        <button type="button" class="erp-yard-chip"
                :class="typeFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setTypeFilter('')">Tüm Faturalar</button>
        <button type="button" class="erp-yard-chip"
                :class="typeFilter === 'SALES' ? 'erp-yard-chip--active' : ''"
                @click="setTypeFilter('SALES')">
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 inline mr-1 text-emerald-600"></i>
            Satış Faturaları
        </button>
        <button type="button" class="erp-yard-chip"
                :class="typeFilter === 'PURCHASE' ? 'erp-yard-chip--active' : ''"
                @click="setTypeFilter('PURCHASE')">
            <i data-lucide="arrow-down-left" class="w-3.5 h-3.5 inline mr-1 text-blue-600"></i>
            Alış Faturaları
        </button>
        <span class="border-l border-slate-300 h-5 my-auto mx-1"></span>
        <button type="button" class="erp-yard-chip"
                :class="deptFilter === '' ? 'erp-yard-chip--active' : ''"
                @click="setDeptFilter('')">Tüm Departmanlar</button>
        <button type="button" class="erp-yard-chip"
                :class="deptFilter === 'QUARRY' ? 'erp-yard-chip--active' : ''"
                @click="setDeptFilter('QUARRY')">Ocak</button>
        <button type="button" class="erp-yard-chip"
                :class="deptFilter === 'FACTORY' ? 'erp-yard-chip--active' : ''"
                @click="setDeptFilter('FACTORY')">Fabrika</button>
        <button type="button" class="erp-yard-chip"
                :class="deptFilter === 'WORKSHOP' ? 'erp-yard-chip--active' : ''"
                @click="setDeptFilter('WORKSHOP')">Atölye</button>
        <button type="button" class="erp-yard-chip"
                :class="deptFilter === 'SITE' ? 'erp-yard-chip--active' : ''"
                @click="setDeptFilter('SITE')">Şantiye</button>
    </div>

    <!-- Standard ERP Toolbar -->
    <div class="erp-toolbar">
        <div class="flex items-center gap-2">
            <a th:href="@{/invoices/create(type='SALES')}" class="erp-btn-primary">
                <i data-lucide="plus"></i>
                <span>Yeni Satış Faturası</span>
            </a>
            <a th:href="@{/invoices/create(type='PURCHASE')}" class="erp-btn-secondary">
                <i data-lucide="shopping-bag"></i>
                <span>Yeni Alış Faturası</span>
            </a>
        </div>
        <div th:replace="~{fragments/list-chrome :: search('Fatura no, cari unvanı veya departman...', 'invoice-search-input')}"></div>
        <div class="erp-toolbar-actions">
            <div th:replace="~{fragments/list-chrome :: exportDropdown('invoices-table', 'faturalar')}"></div>
        </div>
    </div>

    <!-- DataGrid Shell -->
    <div th:replace="~{fragments/list-chrome :: gridShell('invoices-table')}"></div>
</div>

<th:block layout:fragment="scripts">
    <script>
        let invoicesTable;
        document.addEventListener("DOMContentLoaded", () => {
            invoicesTable = new Tabulator("#invoices-table", {
                ...erpGridDefaults(),
                pagination: true,
                paginationMode: "remote",
                paginationSize: window.ERP_GRID_PAGE_SIZE || 25,
                paginationSizeSelector: [5, 10, 25, 50, 100],
                ajaxURL: "/invoices/api/data",
                ajaxConfig: {method: "GET", headers: {"Accept": "application/json"}},
                ajaxURLGenerator: function (url, config, params) {
                    return erpGridAjaxUrl(url, params, "invoice-search-input", function () {
                        return window.invoicesPageState ? window.invoicesPageState.gridExtraQuery() : "";
                    });
                },
                ajaxResponse: function (url, params, response) {
                    return erpGridAjaxResponse("invoices-table", response);
                },
                placeholder: "Kriterlere uygun fatura kaydı bulunamadı.",
                columns: [
                    erpResponsiveCollapseColumn(),
                    erpIndexColumn(),
                    {
                        title: "Fatura No",
                        field: "invoiceNumber",
                        width: 170,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return `<a href="/invoices/${row.id}" class="font-mono font-bold text-blue-700 hover:text-blue-900 underline flex items-center gap-1.5">
                                <i data-lucide="receipt" class="w-3.5 h-3.5 text-blue-600 inline"></i>
                                <span>${gridText(cell.getValue())}</span>
                            </a>`;
                        }
                    },
                    {
                        title: "Tarih",
                        field: "invoiceDate",
                        width: 120,
                        formatter: function (cell) {
                            return `<span class="text-slate-600 font-medium">${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "Tür",
                        field: "invoiceTypeLabel",
                        width: 130,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            const isSales = row.invoiceType === "SALES";
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isSales ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">
                                ${isSales ? '↑ Satış' : '↓ Alış'}
                            </span>`;
                        }
                    },
                    {
                        title: "Cari (Müşteri / Tedarikçi)",
                        field: "partyName",
                        minWidth: 200,
                        formatter: function (cell) {
                            return `<strong class="text-slate-900">${gridText(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Departman",
                        field: "departmentLabel",
                        width: 130,
                        formatter: function (cell) {
                            return `<span class="px-2 py-0.5 rounded-md text-xs font-semibold bg-slate-100 text-slate-800 border border-slate-200">
                                ${gridText(cell.getValue())}
                            </span>`;
                        }
                    },
                    {
                        title: "Toplam Tutar",
                        field: "totalAmount",
                        width: 150,
                        formatter: function (cell) {
                            return `<strong class="font-mono text-emerald-700 text-sm">${gridMoney(cell.getValue())}</strong>`;
                        }
                    },
                    {
                        title: "Durum",
                        field: "statusLabel",
                        width: 120,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            let cls = "bg-amber-100 text-amber-800";
                            if (row.status === "PAID") cls = "bg-emerald-100 text-emerald-800";
                            else if (row.status === "OVERDUE" || row.status === "CANCELLED") cls = "bg-rose-100 text-rose-800";
                            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${cls}">● ${gridText(cell.getValue())}</span>`;
                        }
                    },
                    {
                        title: "İşlemler",
                        width: 100,
                        headerSort: false,
                        responsive: 0,
                        formatter: function (cell) {
                            const row = cell.getRow().getData();
                            return gridActionsHtml([
                                {icon: 'eye', label: 'Görüntüle', href: '/invoices/' + row.id}
                            ]);
                        }
                    }
                ]
            });

            attachTabulatorPagingAnimation(invoicesTable);
            bindGridSearch(invoicesTable, "invoice-search-input");
            invoicesTable.on("renderComplete", () => {
                if (window.lucide) window.lucide.createIcons();
            });
        });

        function reloadInvoicesGrid() {
            if (invoicesTable) invoicesTable.setData();
        }
        window.reloadInvoicesGrid = reloadInvoicesGrid;
    </script>
</th:block>
</body>
</html>
