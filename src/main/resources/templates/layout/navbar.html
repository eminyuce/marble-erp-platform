<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="navbar" class="admin-topbar">
    <div class="admin-topbar-left">
        <button type="button"
                class="admin-menu-trigger"
                id="adminMegaMenuOpen"
                aria-controls="adminMegaMenu"
                aria-expanded="false"
                title="Menüyü aç"
                data-label-open="Menüyü aç"
                data-label-close="Menüyü kapat">
            <i data-lucide="layout-grid" aria-hidden="true"></i>
            <span class="admin-menu-trigger-label">Menüyü aç</span>
        </button>
        <div class="admin-topbar-title">
            <span class="admin-topbar-panel">Özerler Mermer ERP</span>
            <span class="admin-topbar-page" id="adminTopbarPage">Yönetim</span>
        </div>
    </div>

    <div class="admin-topbar-right" sec:authorize="isAuthenticated()">
        <span class="admin-topbar-user" sec:authentication="name">admin</span>
        <a th:href="@{/account/change-password}" class="admin-topbar-logout" title="Şifre Değiştir" style="text-decoration:none;">
            <i data-lucide="key-round" class="w-4 h-4"></i>
            <span>Şifre Değiştir</span>
        </a>
        <button type="submit" form="logoutForm" class="admin-topbar-logout" title="Güvenli Çıkış Yap">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Çıkış Yap</span>
        </button>
    </div>
</header>
</html>
