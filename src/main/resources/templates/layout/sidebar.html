<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<aside th:fragment="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 min-h-screen border-r border-slate-800">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-500">Ana Menü</span>
        <span class="px-2 py-0.5 bg-slate-800 text-slate-400 rounded text-[10px] font-mono">v1.0-PRO</span>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <!-- Dashboard -->
        <a th:href="@{/admin/dashboard}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="layout-dashboard" class="w-5 h-5 text-amber-400"></i>
            <span>Yönetici Kokpiti</span>
        </a>

        <!-- Admin Only: User Management -->
        <div sec:authorize="hasRole('ADMIN')">
            <div class="pt-4 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Yönetim</div>
            <a th:href="@{/admin/users}"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
                <i data-lucide="users" class="w-5 h-5 text-blue-400"></i>
                <span>Kullanıcı Yönetimi</span>
            </a>
        </div>

        <div class="pt-4 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Mermer Operasyonları</div>

        <!-- 1. Ocak & Blok -->
        <a th:href="@{/blocks}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="mountain" class="w-5 h-5 text-emerald-400"></i>
            <span>1. Ocak &amp; Blok</span>
        </a>

        <!-- 2. Fabrika & Plaka -->
        <a th:href="@{/production}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="factory" class="w-5 h-5 text-amber-400"></i>
            <span>2. Fabrika &amp; Katrak</span>
        </a>

        <!-- 2b. Plaka Ambarı -->
        <a th:href="@{/production/slabs}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="layers" class="w-5 h-5 text-indigo-400"></i>
            <span>Plaka Ambarı</span>
        </a>

        <!-- 3. Atölye & Ebatlama -->
        <a th:href="@{/workshop}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="scissors" class="w-5 h-5 text-rose-400"></i>
            <span>3. Atölye &amp; Ebatlama</span>
        </a>

        <!-- 4. Proje & Şantiye -->
        <a th:href="@{/projects}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="building-2" class="w-5 h-5 text-cyan-400"></i>
            <span>4. Proje &amp; Şantiye</span>
        </a>

        <div class="pt-4 pb-1 px-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Mali &amp; Karar Destek</div>

        <!-- 5. Dinamik Maliyet -->
        <a th:href="@{/costs}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="calculator" class="w-5 h-5 text-emerald-400"></i>
            <span>Maliyet &amp; Fiyatlama</span>
        </a>

        <!-- 6. Soy Ağacı -->
        <a th:href="@{/genealogy}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition group">
            <i data-lucide="git-branch" class="w-5 h-5 text-amber-400"></i>
            <span>Dijital Soy Ağacı</span>
        </a>
    </nav>

    <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
        <div class="flex items-center gap-2 mb-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-slate-300 font-medium">Bulut Çekirdek Aktif</span>
        </div>
        <div>Özerler Mermer A.Ş. &copy; 2026</div>
    </div>
</aside>
</html>
