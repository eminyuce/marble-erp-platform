<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${pageTitle != null ? pageTitle + ' | Özerler Mermer ERP' : 'Özerler Mermer ERP'}">Özerler Mermer
        ERP</title>

    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>

    <link rel="preload" th:href="@{/fonts/inter-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/fonts/inter-latin-ext-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/searchable-select.css}">
    <link rel="stylesheet" th:href="@{/vendor/tabulator/tabulator.min.css}">
    <link rel="stylesheet" href="https://unpkg.com/filepond@^4/dist/filepond.css">
    <link rel="stylesheet"
          href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.css">

    <style>
        [x-cloak] {
            display: none !important;
        }

        .grid-actions {
            position: relative;
            display: inline-flex;
        }

        .grid-actions-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #334e68;
            background: #f1f5f9;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s;
        }

        .grid-actions-btn:hover {
            background: #e2e8f0;
            border-color: #c5d1dc;
        }

        .grid-actions-portal {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .15);
            min-width: 180px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: .12s ease-out grid-actions-in;
        }

        @keyframes grid-actions-in {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .grid-actions-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s;
        }

        .grid-actions-item:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .grid-actions-item--danger {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 4px;
            justify-content: center;
        }

        .grid-actions-item--danger:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .grid-actions-divider {
            height: 1px;
            background: #e2e8f0;
            border: none;
            margin: 4px 0;
        }

        .erp-audit-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .erp-audit-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1rem;
            margin-top: 0.75rem;
        }

        @media (max-width: 1024px) {
            .erp-audit-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .erp-audit-grid {
                grid-template-columns: 1fr;
            }
        }

        .erp-audit-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .erp-audit-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .erp-audit-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }

    </style>
</head>
<body class="admin-app min-h-screen antialiased"
      th:data-help-page-key="${helpPageKey}">

<form id="logoutForm" th:action="@{/logout}" method="post" class="hidden" hidden></form>

<div class="admin-main">
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="admin-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div layout:fragment="content">
        </div>
    </main>
</div>

<div th:replace="~{layout/mega-menu :: megaMenu}"></div>

<div id="modal-container"></div>

<div class="help-panel-layer"
     x-data="helpPanel"
     @open-help.window="openFromEvent($event)"
     @keydown.window="onKeydown($event)"
     :class="{ 'is-open': open }"
     :aria-hidden="(!open).toString()">
    <div class="help-panel-backdrop" @click="closeHelp()" role="presentation"></div>
    <aside id="helpPanelDialog"
           class="help-panel"
           role="dialog"
           aria-modal="true"
           aria-labelledby="helpPanelTitle"
           x-ref="panel"
           tabindex="-1">
        <div class="help-panel-handle" aria-hidden="true"></div>
        <header class="help-panel-header">
            <span class="help-panel-header-icon" aria-hidden="true">
                <i data-lucide="circle-help" class="w-5 h-5"></i>
            </span>
            <h2 id="helpPanelTitle" class="help-panel-title" x-text="title">Yardım</h2>
            <button type="button"
                    class="help-panel-close"
                    @click="closeHelp()"
                    x-ref="closeBtn"
                    aria-label="Kapat"
                    title="Kapat">
                <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
            </button>
        </header>
        <div class="help-panel-body">
            <div class="help-panel-skeleton" x-show="loading" x-cloak>
                <div class="help-panel-skel-line"></div>
                <div class="help-panel-skel-line"></div>
                <div class="help-panel-skel-line is-short"></div>
            </div>
            <p class="help-panel-status" x-show="loading" x-cloak>Yükleniyor...</p>
            <p class="help-panel-error" x-show="!loading && error" x-text="error" x-cloak></p>
            <div class="help-panel-content" x-show="!loading && !error && bodyHtml" x-html="bodyHtml"></div>
        </div>
        <footer class="help-panel-footer">
            <p class="help-panel-updated" x-show="lastUpdated" x-cloak>
                Son güncelleme: <span x-text="lastUpdated"></span>
            </p>
            <div class="help-panel-feedback" x-show="!loading && !error && pageKey" x-cloak>
                <span>Faydalı oldu mu?</span>
                <button type="button"
                        class="help-panel-vote"
                        :class="{ 'is-active': feedback === 'up' }"
                        :disabled="feedbackBusy || !!feedback"
                        @click="sendFeedback(true)"
                        aria-label="Evet, faydalı oldu">
                    <i data-lucide="thumbs-up" class="w-4 h-4" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="help-panel-vote"
                        :class="{ 'is-active is-down': feedback === 'down' }"
                        :disabled="feedbackBusy || !!feedback"
                        @click="sendFeedback(false)"
                        aria-label="Hayır, faydalı olmadı">
                    <i data-lucide="thumbs-down" class="w-4 h-4" aria-hidden="true"></i>
                </button>
                <span class="help-panel-feedback-thanks" x-show="feedback" x-cloak>Teşekkürler.</span>
            </div>
        </footer>
    </aside>
</div>

<script th:src="@{/vendor/htmx.min.js}"></script>
<script th:src="@{/js/help-panel.js}"></script>
<script th:src="@{/js/change-password-form.js}"></script>
<script th:src="@{/vendor/alpine-collapse.min.js}"></script>
<script th:src="@{/vendor/alpine.min.js}"></script>
<script th:src="@{/vendor/tabulator/tabulator.min.js}"></script>
<script th:src="@{/vendor/xlsx.full.min.js}"></script>
<script th:src="@{/vendor/lucide.min.js}"></script>
<script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.js"></script>
<script src="https://unpkg.com/filepond@^4/dist/filepond.js"></script>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/searchable-select.js}"></script>
<script th:inline="javascript">window.ERP_GRID_PAGE_SIZE = /*[[${gridDefaultPageSize}]]*/ 25;</script>
<script th:src="@{/js/mega-menu.js}"></script>
<script th:src="@{/js/editor-setup.js}"></script>
<script th:src="@{/js/filepond-setup.js}"></script>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
