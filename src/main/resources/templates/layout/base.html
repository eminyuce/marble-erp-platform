<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${pageTitle != null ? pageTitle + ' | Özerler Mermer ERP' : 'Özerler Mermer ERP'}">Özerler Mermer
        ERP</title>

    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>

    <link rel="preload" th:href="@{/fonts/inter-latin-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" th:href="@{/fonts/inter-latin-ext-wght-normal.woff2}" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" th:href="@{/css/app.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/css/searchable-select.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/vendor/tabulator/tabulator.min.css}">

    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Help slide-over is inlined so a year-cached /css/app.css cannot hide it in prod. */
        body.help-panel-open { overflow: hidden; }
        .help-panel-layer {
            position: fixed;
            inset: 0;
            z-index: 4000;
            pointer-events: none;
            visibility: hidden;
        }
        .help-panel-layer.is-open {
            pointer-events: auto;
            visibility: visible;
        }
        .help-panel-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.28s ease;
        }
        .help-panel-layer.is-open .help-panel-backdrop { opacity: 1; }
        .help-panel {
            position: absolute;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: -12px 0 40px rgba(15, 23, 42, 0.18);
            outline: none;
        }
        .help-panel-handle { display: none; }
        @media (min-width: 1024px) {
            .help-panel {
                top: 0;
                right: 0;
                bottom: 0;
                width: 400px;
                max-width: 100%;
                transform: translateX(100%);
                transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
                border-left: 1px solid #d9e2ec;
            }
            .help-panel-layer.is-open .help-panel { transform: translateX(0); }
        }
        @media (max-width: 1023px) {
            .help-panel {
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                max-height: 85vh;
                transform: translateY(100%);
                transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -12px 40px rgba(15, 23, 42, 0.18);
            }
            .help-panel-layer.is-open .help-panel { transform: translateY(0); }
            .help-panel-handle {
                display: block;
                width: 40px;
                height: 4px;
                margin: 10px auto 0;
                border-radius: 999px;
                background: #cbd5e1;
                flex-shrink: 0;
            }
        }
        .help-panel-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.15rem;
            background: #f0f9ff;
            border-bottom: 1px solid #bae6fd;
        }
        .help-panel-header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 0.6rem;
            background: #e0f2fe;
            color: #0284c7;
            flex-shrink: 0;
        }
        .help-panel-title {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            color: #0c4a6e;
        }
        .help-panel-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            background: #fff;
            color: #0369a1;
            cursor: pointer;
            flex-shrink: 0;
        }
        .help-panel-body {
            flex: 1 1 auto;
            min-height: 0;
            padding: 1.1rem 1.2rem;
            overflow-y: auto;
        }
        .help-panel-content p {
            margin: 0 0 0.75rem;
            font-size: 0.875rem;
            line-height: 1.55;
            color: #334e68;
        }
        .help-panel-content h3,
        .help-panel-content h4 {
            margin: 1rem 0 0.45rem;
            font-size: 0.95rem;
            font-weight: 800;
            color: #0f172a;
        }
        .help-panel-content h3:first-child,
        .help-panel-content h4:first-child {
            margin-top: 0;
        }
        .help-panel-footer {
            padding: 0.9rem 1.2rem 1.1rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .grid-actions {
            position: relative;
            display: inline-flex;
        }

        .grid-actions-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #334e68;
            background: #f1f5f9;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s;
        }

        .grid-actions-btn:hover {
            background: #e2e8f0;
            border-color: #c5d1dc;
        }

        .grid-actions-portal {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .15);
            min-width: 180px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            animation: .12s ease-out grid-actions-in;
        }

        @keyframes grid-actions-in {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        .grid-actions-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background .15s;
        }

        .grid-actions-item:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .grid-actions-item--danger {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 4px;
            justify-content: center;
        }

        .grid-actions-item--danger:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        .grid-actions-divider {
            height: 1px;
            background: #e2e8f0;
            border: none;
            margin: 4px 0;
        }

        .erp-audit-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .erp-audit-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1rem;
            margin-top: 0.75rem;
        }

        @media (max-width: 1024px) {
            .erp-audit-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .erp-audit-grid {
                grid-template-columns: 1fr;
            }
        }

        .erp-audit-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.875rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .erp-audit-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .erp-audit-value {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }

        /* Grid visibility is inlined so a year-cached /css/app.css cannot collapse Tabulator. */
        .erp-grid-shell .tabulator,
        .tabulator {
            min-height: 180px;
        }
        .tabulator .tabulator-tableholder {
            min-height: 140px;
        }
        .tabulator .tabulator-placeholder {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #627d98;
            font-weight: 600;
        }

    </style>
</head>
<body class="admin-app min-h-screen antialiased"
      th:data-help-page-key="${helpPageKey}">

<form id="logoutForm" th:action="@{/logout}" method="post" class="hidden" hidden></form>

<div class="admin-main">
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="admin-content">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div layout:fragment="content">
        </div>
    </main>
</div>

<div th:replace="~{layout/mega-menu :: megaMenu}"></div>

<div id="modal-container"></div>

<div class="help-panel-layer"
     x-data="helpPanel"
     @open-help.window="openFromEvent($event)"
     @keydown.window="onKeydown($event)"
     :class="{ 'is-open': open }"
     :aria-hidden="(!open).toString()">
    <div class="help-panel-backdrop" @click="closeHelp()" role="presentation"></div>
    <aside id="helpPanelDialog"
           class="help-panel"
           role="dialog"
           aria-modal="true"
           aria-labelledby="helpPanelTitle"
           x-ref="panel"
           tabindex="-1">
        <div class="help-panel-handle" aria-hidden="true"></div>
        <header class="help-panel-header">
            <span class="help-panel-header-icon" aria-hidden="true">
                <i data-lucide="circle-help" class="w-5 h-5"></i>
            </span>
            <h2 id="helpPanelTitle" class="help-panel-title" x-text="title">Yardım</h2>
            <button type="button"
                    class="help-panel-close"
                    @click="closeHelp()"
                    x-ref="closeBtn"
                    aria-label="Kapat"
                    title="Kapat">
                <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
            </button>
        </header>
        <div class="help-panel-body">
            <div class="help-panel-skeleton" x-show="loading" x-cloak>
                <div class="help-panel-skel-line"></div>
                <div class="help-panel-skel-line"></div>
                <div class="help-panel-skel-line is-short"></div>
            </div>
            <p class="help-panel-status" x-show="loading" x-cloak>Yükleniyor...</p>
            <p class="help-panel-error" x-show="!loading && error" x-text="error" x-cloak></p>
            <div class="help-panel-content" x-show="!loading && !error && bodyHtml" x-html="bodyHtml"></div>
        </div>
        <footer class="help-panel-footer">
            <p class="help-panel-updated" x-show="lastUpdated" x-cloak>
                Son güncelleme: <span x-text="lastUpdated"></span>
            </p>
            <div class="help-panel-feedback" x-show="!loading && !error && pageKey" x-cloak>
                <span>Faydalı oldu mu?</span>
                <button type="button"
                        class="help-panel-vote"
                        :class="{ 'is-active': feedback === 'up' }"
                        :disabled="feedbackBusy || !!feedback"
                        @click="sendFeedback(true)"
                        aria-label="Evet, faydalı oldu">
                    <i data-lucide="thumbs-up" class="w-4 h-4" aria-hidden="true"></i>
                </button>
                <button type="button"
                        class="help-panel-vote"
                        :class="{ 'is-active is-down': feedback === 'down' }"
                        :disabled="feedbackBusy || !!feedback"
                        @click="sendFeedback(false)"
                        aria-label="Hayır, faydalı olmadı">
                    <i data-lucide="thumbs-down" class="w-4 h-4" aria-hidden="true"></i>
                </button>
                <span class="help-panel-feedback-thanks" x-show="feedback" x-cloak>Teşekkürler.</span>
            </div>
        </footer>
    </aside>
</div>

<script th:src="@{/vendor/htmx.min.js}"></script>
<script th:src="@{/js/help-panel.js(v=${assetVersion})}"></script>
<script th:src="@{/js/change-password-form.js(v=${assetVersion})}"></script>
<script th:src="@{/vendor/alpine-collapse.min.js}"></script>
<script th:src="@{/vendor/alpine.min.js}"></script>
<script th:src="@{/vendor/tabulator/tabulator.min.js}"></script>
<script th:src="@{/vendor/xlsx.full.min.js}"></script>
<script th:src="@{/vendor/lucide.min.js}"></script>
<script th:src="@{/js/app.js(v=${assetVersion})}"></script>
<script>
(function (window) {
    if (typeof window.gridText !== "function") {
        window.gridText = function (value) {
            return value === undefined || value === null || value === "" ? "—" : String(value);
        };
    }
    if (typeof window.gridNumber !== "function") {
        window.gridNumber = function (value, format) {
            if (value === undefined || value === null || value === "") {
                return "—";
            }
            var n = Number(value);
            if (!isFinite(n)) {
                return "—";
            }
            return typeof format === "function" ? format(n) : String(n);
        };
    }
    if (typeof window.gridMoney !== "function") {
        window.gridMoney = function (value) {
            var amount = window.gridNumber(value, function (n) { return n.toLocaleString("tr-TR"); });
            return amount === "—" ? "—" : amount + " TL";
        };
    }
    if (typeof window.gridArea !== "function") {
        window.gridArea = function (value) {
            var amount = window.gridNumber(value, function (n) { return n.toFixed(2); });
            return amount === "—" ? "—" : amount + " m²";
        };
    }
    if (typeof window.erpStatusBadge !== "function") {
        window.erpStatusBadge = function (status, label) {
            return '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">● '
                + window.gridText(label || status) + '</span>';
        };
    if (typeof window.erpGridDefaults !== "function") {
        window.erpGridDefaults = function () {
            return { locale: "tr" };
        };
    }
    if (typeof window.erpResponsiveCollapseColumn !== "function") {
        window.erpResponsiveCollapseColumn = function () {
            return {
                title: "",
                formatter: "responsiveCollapse",
                width: 46,
                minWidth: 46,
                hozAlign: "center",
                headerHozAlign: "center",
                resizable: false,
                headerSort: false,
                responsive: 0,
                download: false
            };
        };
    }
    if (typeof window.erpIndexColumn !== "function") {
        window.erpIndexColumn = function (options) {
            options = options || {};
            var title = options.title !== undefined ? options.title : "#";
            var continueGlobally = options.continueGlobally === true;
            return {
                title: title,
                field: "_rowIndex",
                formatter: function (cell) {
                    var row = cell.getRow();
                    var pos = (typeof row.getPosition === "function") ? row.getPosition(true) : false;
                    if (pos === false || typeof pos !== "number") {
                        pos = (typeof row.getPosition === "function") ? row.getPosition(false) : false;
                    }
                    if (continueGlobally && typeof pos === "number" && pos > 0) {
                        var table = cell.getTable();
                        var page = (typeof table.getPage === "function") ? (table.getPage() || 1) : 1;
                        var size = (typeof table.getPageSize === "function") ? (table.getPageSize() || 0) : 0;
                        if (typeof page === "number" && typeof size === "number" && size > 0) {
                            pos = ((page - 1) * size) + pos;
                        }
                    }
                    return '<span class="erp-grid-row-num" aria-label="Sıra: ' + (pos || "") + '">' + (pos || "") + '</span>';
                },
                width: options.width || 56,
                minWidth: 48,
                maxWidth: 72,
                hozAlign: "center",
                headerHozAlign: "center",
                resizable: false,
                headerSort: false,
                cssClass: "erp-col-index",
                responsive: 0,
                download: false
            };
        };
    }
})(window);
</script>
<script th:src="@{/js/searchable-select.js(v=${assetVersion})}"></script>
<script th:inline="javascript">window.ERP_GRID_PAGE_SIZE = /*[[${gridDefaultPageSize}]]*/ 25;</script>
<script th:src="@{/js/mega-menu.js(v=${assetVersion})}"></script>
<script th:src="@{/js/editor-setup.js(v=${assetVersion})}"></script>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
