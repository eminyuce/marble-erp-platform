spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/marble_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true

server:
  port: 81
  forward-headers-strategy: native

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:81}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
