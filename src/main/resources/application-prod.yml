spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:marble_erp}}
    username: ${DB_USERNAME:marbleuser}
    password: ${DB_PASSWORD:marblepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  thymeleaf:
    cache: true
  web:
    locale: tr
    locale-resolver: fixed
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${PORT:${SERVER_PORT:10000}}
  request:
    header:
      forwarded:
        strategy: framework
  servlet:
    session:
      cookie:
        # Production is HTTPS. Secure is the default; no .env entry is required.
        # Set SESSION_COOKIE_SECURE=false only for an explicit HTTP exception.
        secure: ${SESSION_COOKIE_SECURE:true}

app:
  backup:
    database:
      docker-container: ${PG_DOCKER_CONTAINER:ozerler-marble-erp-postgres}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:81}
    allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:https://*.onrender.com}
  deployment:
    enabled: true
  storage:
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
      public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:https://ozerler.naklink.com}
      bucket: ${RUSTFS_BUCKET:erp-files}
      region: ${RUSTFS_REGION:us-east-1}

# Public endpoint must be https on a public host. Startup fails otherwise.
# RUSTFS_ENDPOINT stays on the internal Docker DNS name.
rustfs:
  endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
  public-endpoint: ${RUSTFS_PUBLIC_ENDPOINT:https://ozerler.naklink.com}
  access-key: ${RUSTFS_ACCESS_KEY:}
  secret-key: ${RUSTFS_SECRET_KEY:}
  bucket: ${RUSTFS_BUCKET:erp-files}
  region: ${RUSTFS_REGION:us-east-1}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
