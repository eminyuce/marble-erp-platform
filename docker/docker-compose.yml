services:
  postgres:
    image: postgres:16-alpine
    container_name: marble-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-marble_erp}
      POSTGRES_USER: ${DB_USERNAME:-marbleuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marblepass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marble-network

  rustfs-perms:
    image: alpine:3.24.1
    container_name: marble-rustfs-perms
    user: root
    restart: "no"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    networks:
      - marble-network

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: marble-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marble-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: marble-erp-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marble_erp}
      DB_USERNAME: ${DB_USERNAME:-marbleuser}
      DB_PASSWORD: ${DB_PASSWORD:-marblepass}
      APP_UPLOAD_DIR: /app/uploads
      APP_MEDIA_DIR: /app/media
      STORAGE_TYPE: rustfs
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-erp-files}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    ports:
      - "${APP_PORT:-81}:81"
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - marble-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  media_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  marble-network:
    driver: bridge
