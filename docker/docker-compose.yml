# Project name is explicit so it is not the folder name "docker".
# Service DNS names stay "postgres" and "rustfs" (RUSTFS_ENDPOINT=http://rustfs:9000).
# Postgres data stays in the existing volume docker_postgres_data.
# Other local volumes use ozerler-marble-erp-* names. See RUNNING_LOCALLY.md
# for the one-time copy from docker_uploads_data, docker_media_data, and docker_rustfs_data.
name: ozerler-marble-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: ozerler-marble-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-marble_erp}
      POSTGRES_USER: ${DB_USERNAME:-marbleuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marblepass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marble-network

  rustfs-perms:
    image: alpine:3.24.1
    container_name: ozerler-marble-erp-rustfs-perms
    user: root
    restart: "no"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    networks:
      - marble-network

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: ozerler-marble-erp-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - marble-network

  app-perms:
    image: alpine:3.24.1
    container_name: ozerler-marble-erp-app-perms
    user: root
    restart: "no"
    volumes:
      - uploads_data:/uploads
      - media_data:/media
    command: ["sh", "-c", "mkdir -p /uploads /media && chown -R 1001:1001 /uploads /media && chmod 755 /uploads /media"]
    networks:
      - marble-network

  app:
    image: ${DOCKERHUB_USERNAME:-guvenulu}/marble-erp-platform:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ozerler-marble-erp-app
    init: true
    stop_grace_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      app-perms:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      PORT: "81"
      SERVER_PORT: "81"
      DB_HOST: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marble_erp}
      DB_USERNAME: ${DB_USERNAME:-marbleuser}
      DB_PASSWORD: ${DB_PASSWORD:-marblepass}
      APP_UPLOAD_DIR: /app/uploads
      APP_MEDIA_DIR: /app/media
      STORAGE_TYPE: rustfs
      # Inside this stack the API is the Compose DNS name. The browser on the
      # host reaches RustFS through the published port. Production compose
      # (docker-compose.prod.yml) requires an https public host instead.
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-marblerustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-marblerustfs_change_me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-erp-files}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      PRESIGNED_IMAGE_EXPIRY_MINUTES: ${PRESIGNED_IMAGE_EXPIRY_MINUTES:-30}
      PRESIGNED_DOCUMENT_EXPIRY_MINUTES: ${PRESIGNED_DOCUMENT_EXPIRY_MINUTES:-5}
      SESSION_STORE_TYPE: ${SESSION_STORE_TYPE:-jdbc}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      # This local stack publishes plain HTTP. Exporting SPRING_PROFILES_ACTIVE=prod
      # would mark the session cookie Secure, which browsers drop on http://localhost.
      SESSION_COOKIE_SECURE: "false"
      SESSION_CLEANUP_CRON: "${SESSION_CLEANUP_CRON:-0 * * * * *}"
    ports:
      - "${APP_PORT:-81}:81"
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - marble-network

volumes:
  # Same volume the production JAR deploy already uses. Do not rename it.
  postgres_data:
    name: docker_postgres_data
  uploads_data:
    name: ozerler-marble-erp-uploads
  media_data:
    name: ozerler-marble-erp-media
  rustfs_data:
    name: ozerler-marble-erp-rustfs

networks:
  marble-network:
    name: ozerler-marble-erp
    driver: bridge
