services:
  postgres:
    image: postgres:16-alpine
    container_name: marble-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-marble_erp}
      POSTGRES_USER: ${DB_USERNAME:-marbleuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marblepass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - marble-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: marble-erp-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marble_erp}
      DB_USERNAME: ${DB_USERNAME:-marbleuser}
      DB_PASSWORD: ${DB_PASSWORD:-marblepass}
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-81}:81"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:81/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - marble-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  marble-network:
    driver: bridge
